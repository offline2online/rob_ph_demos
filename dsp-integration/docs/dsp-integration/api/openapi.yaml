  # ------------------------------------------------------------------ Public
  /sellers.json:
    servers: &rootServers
      - url: https://{instance}
        description: Served at the root of the instance, not under /api.
        variables:
          instance:
            default: hub.example-retailer.com
    get:
      tags: [Public]
      operationId: getSellersJson
      summary: IAB sellers.json for the seller of record (served at https://[domain]/sellers.json)
      security: []
      responses:
        '200':
          description: sellers.json
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellersJson'}
        '404': {description: Not published — DSP integration switched off, or Exchange settings incomplete.}

  /assets/{file}:
    servers: *rootServers
    get:
      tags: [Public]
      operationId: getAsset
      summary: A creative file from the asset store (POC stand-in for the platform's asset hosting)
      description: |
        Served at the root of the instance. The name is one the store
        generated (`^[a-z0-9-]+\.[a-z0-9]+$`); anything else is a 404. Every
        file is sent with `X-Content-Type-Options: nosniff` and a CSP that
        blocks script, so an SVG creative cannot run code when opened
        directly. On integration `assetUrl` points at the platform's own
        hosting and this route goes away.
      security: []
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The file, with its own content type.
          content:
            '*/*': {schema: {type: string, format: binary}}
        '404': {description: No such file.}

  # -------------------------------------------------------------- Operations
  /healthz:
    servers: *rootServers
    get:
      tags: [Operations]
      operationId: healthz
      summary: Liveness — the process is up
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean, enum: [true]}}}
  /readyz:
    servers: *rootServers
    get:
      tags: [Operations]
      operationId: readyz
      summary: Readiness — the database answers and every migration is applied, so requests can be served
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {type: object, required: [ok], properties: {ok: {type: boolean, enum: [true]}}}
        '503':
          description: Not ready (a pod stays out of the load balancer until it is)
          content:
            application/json:
              schema: {type: object, required: [ok, reason], properties: {ok: {type: boolean, enum: [false]}, reason: {type: string}}}

components:
  securitySchemes:
    partnerToken:
      type: http
      scheme: bearer
      description: Token issued to a connected DSP or tier-2 partner. Identifies the partner; advertiser is passed per request.
    playerToken:
      type: http
      scheme: bearer
      description: PH Core's player credential for the Player API (PH_PLAYER_TOKEN). Not a partner token.
    adminSession:
      type: apiKey
      in: cookie
      name: ph_session
      description: |
        Existing HQ Admin session. Who sees what (spec, Who sees each section):
        admin users get everything, including DSP Integration and editing
        advertiser settings; marketing users get Display Types, Playlist
        Management, Advertisers / Inventory (read-only on the per-advertiser
        settings) and Campaign Status; help desk users get none of it.
        Scopes: admin (DSP Integration, saving advertiser settings), approver
        (approve/reject; HQ Admin role by default, open question 39),
        sections (the four shared sections). In the POC there is no cookie —
        the session is a stand-in whose role comes from the POC_ROLE env var
        (hq_admin | hq_marketing | hq_helpdesk).

  parameters:
    PositionId: {name: positionId, in: path, required: true, schema: {type: string}}
    CampaignId: {name: campaignId, in: path, required: true, schema: {type: string}}
    PartnerId: {name: partnerId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}

  responses:
    Unauthorised: {description: Missing or invalid credentials, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Authenticated but not allowed (e.g. non-admin on Advertisers), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: 'Not found, or not visible to this caller', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationFailed: {description: 'error.code = validation_failed; details lists each field', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    VariableNotPermitted: {description: 'error.code = variable_not_permitted; details names each variable', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ChecksFailed: {description: 'error.code = checks_failed; details lists each failed check with its reason', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotEligible: {description: 'error.code = not_approved | below_floor | advertiser_blocked | category_blocked | not_on_whitelist | not_invited | targeting_not_supported | too_many_versions', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: 'error.code = conflict (e.g. version changed, already submitted, window sold, bidding not open or closed, live not allowed)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    HasDependents: {description: 'error.code = has_dependents; details lists what depends on the item', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: 'error.code = rate_limited. Per partner token (default 50 requests/s, bursts of 100), or too many asset uploads in flight at once. Retry-After gives the seconds to wait.', headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_failed, variable_not_permitted, checks_failed, not_approved, below_floor, advertiser_blocked, category_blocked, not_on_whitelist, not_invited, targeting_not_supported, too_many_versions, conflict, has_dependents, unauthorised, forbidden, not_found, rate_limited, internal_error]
            message: {type: string}
            details:
              type: array
              items:
                type: object
                properties:
                  field: {type: string}
                  variable: {type: string}
                  reason: {type: string}

    ImpressionSignal:
      type: object
      required: [displayId, slot]
      properties:
        displayId: {type: string, description: The display about to play the impression.}
        slot: {type: integer, minimum: 1, description: The slot (1-based) in that display's display type that is next in the rotation.}
        cachedCrids: {type: array, maxItems: 500, items: {type: string}, description: 'The creative ids (the `crid` a DSP bids with) the player already holds in its cache. Used only while the uncached-creative restriction is in force (Advertiser settings): then a bid wins only if its crid is listed. Omitted means none are cached.'}
        slotStartsAt: {type: string, format: date-time, description: 'When the slot is expected to play (Broadsign Reach sends its bid request about 35 s ahead of the expected programmatic slot). The exchange opens the slot''s auction `bidLookaheadSeconds` (Advertiser settings) before this time: an earlier signal is refused, 409, naming when it opens. Omitted means the player is signalling at playout and the auction opens now.'}
        storeOpen: {type: boolean, description: 'Whether the display''s store is open now, from PH Core''s store hours (the same source as the Store Open / Closed targeting variable). Used when the restriction follows store trading hours; omitted is treated as not open, so the exchange never goes dark on a missing signal.'}
    ImpressionFill:
      type: object
      required: [impressionId, status]
      properties:
        impressionId: {type: string}
        status: {type: string, enum: [filled, no_fill, played]}
        reason: {type: [string, 'null'], description: Why there is no fill; absent on a fill.}
        expiresAt: {type: string, format: date-time, description: The proof of play must arrive by this time.}
        clearingCpm: {type: number, description: First price, USD CPM.}
        creativeSource: {type: string, enum: [approved, under_review, at_bid], description: Which kind of fill this was; also on `creative.source`.}
        reviewNote: {type: string, description: On the proof-of-play answer for an at-bid creative, what the post-play review did with it.}
        creative:
          type: object
          description: What to play. The player fetches the asset from `url`.
          properties:
            campaignId: {type: [string, 'null'], description: Null for an at-bid creative PH has not seen yet; its campaign exists once it has played and been retrieved.}
            source:
              type: string
              enum: [approved, under_review, at_bid]
              description: |
                approved: PH's approved copy. under_review: PH's copy, its
                review still open. at_bid: the DSP's own creative URL, not
                yet seen by PH; reviewed after the play.
            assetVersion: {type: string}
            url: {type: string}
            mimeType: {type: string}
            durationSec: {type: [number, 'null']}

    WindowStatus:
      type: string
      enum: [available, reserved, sold, unavailable]
      description: |
        reserved: held for a named advertiser (and shown as available to that
        advertiser), committed at the reserve price, or inside a locked
        private-auction term. A window in either of the last two cases is not
        auctioned and takes no bids until it plays.
    PlayWindow:
      type: object
      required: [start, end, status, assumedViews]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/WindowStatus'}
        assumedViews: {type: integer}
    Position:
      type: object
      required: [positionId, displayTypeId, displayTypeName, slot, slotLabel, storeCount, displayCount, screen, assignment, billingUnitHours, scored, pricing]
      properties:
        positionId: {type: string}
        displayTypeId: {type: string}
        displayTypeName: {type: string}
        slot: {type: integer, minimum: 1}
        slotLabel: {type: string}
        zone: {type: [string, 'null']}
        storeCount: {type: integer}
        displayCount: {type: integer}
        screen:
          type: object
          required: [width, height, orientation, slotDurationSec, loopLengthSec, shareOfVoice]
          properties:
            width: {type: integer}
            height: {type: integer}
            orientation: {type: string, enum: [landscape, portrait]}
            slotDurationSec: {type: number}
            loopLengthSec: {type: number}
            shareOfVoice: {type: number, description: 1 / maximumCampaignsPlayedInRotation}
            openOohVenueType: {type: string}
        assignment: {type: string, enum: [rtb, whitelist_only, deal, reserved]}
        billingUnitHours:
          type: integer
          description: |
            This position's play-window length, in hours — its billing unit
            (OQ27, 29 Sep 2026): the slot's own, else its display type's,
            else the company-wide play window. Every window this position
            is sold in (availability, a reservation's windowStart, the bid
            request's `exp`) is this long, laid back to back from a fixed
            Monday 00:00 UTC.
        playsPerWindow:
          type: integer
          description: The transacting unit. Plays this slot gets on one display in one of its windows (billingUnitHours long) — floor(window / loopLengthSec). Assumed views (VAC-d) convert plays to impressions for billing only.
        assumedViewsPerWindow:
          type: integer
          description: Assumed views (VAC-d) in one of this position's windows (billingUnitHours long).
        scored:
          type: boolean
          description: |
            Whether the slot has an audience score. Inventory lists only
            scored positions, so this is always true here; an unscored slot
            is a 404 (not sellable) and a bid on it is refused with a 409
            that says why (ticket, 30 Sep 2026). There is no fallback
            estimate: an invented audience number would end up on invoices.
        maxCampaigns:
          type: integer
          minimum: 1
          maximum: 10
          description: |
            The most campaigns (the default layer plus targeted versions, 1 +
            targeted.length) a bid or reservation on this position may carry:
            the slot's own Max campaigns, else its display type's default,
            else 5. A campaign with more versions is refused with
            `too_many_versions` (decision, 1 Oct 2026). Submission only guards
            package size; this is the sellable count.
        pricing: {$ref: '#/components/schemas/Pricing'}
        reservePrice:
          type: [number, 'null']
          description: |
            A CPM premium at which this position can be reserved in advance
            of the open auction (decision, 22 Sep); null when no reserve is
            set. The resolved value: the slot's own override when it has
            one, else its display type's reserve price default, else null
            (spec §1 configuration inheritance). Set on Advertisers /
            Inventory. A buyer books the position at this price with
            `POST /v1/reservations`, `type: reserve` (open questions 45 and 52,
            decided by Rob on 29 Sep 2026). The window is then held as
            Reserved, out of the open auction, and billed at this CPM on its
            realised VAC-d. It is the CPM itself, not an amount added to the
            floor, and it must clear the buyer's effective floor.
        interactiveReservePrice:
          type: [number, 'null']
          description: |
            The reserve price for a reservation whose campaign is
            interactive (ticket 5eLDRBqEGhNyJSHSIFFG, 4 Oct 2026): the
            slot's own interactive reserve price when set, else
            `reservePrice`. Only offered while the slot supports
            interactive targeting. Same booking rules as `reservePrice`.
    Pricing:
      type: object
      required: [currency, floorCpm, effectiveFloorCpm]
      properties:
        currency: {type: string}
        floorCpm: {type: number}
        effectiveFloorCpm:
          type: object
          description: |
            What a bid must clear per thousand assumed views, for this caller:
            the base floor × the advertiser's floor multiplier, whatever the
            campaign's type. There is no personalised price (Rob, 5 Oct 2026).
          required: [localised]
          properties:
            localised: {type: number, description: The floor every campaign type clears.}

    TargetingAttribute:
      type: object
      required: [key, source, label, group, operators]
      properties:
        key: {type: string, example: store.fixed_segments}
        source: {type: string, enum: [store, visitor]}
        label: {type: string}
        group: {type: string, enum: [localisation, personalisation]}
        operators: {type: array, items: {type: string}}
    Condition:
      type: object
      required: [source, variable, op, values]
      properties:
        source: {type: string}
        variable: {type: string}
        op: {type: string, enum: [include, match_exactly, exclude_or, exclude_and, equal, not_equal, greater_than, less_than, greater_than_or_equal, less_than_or_equal]}
        values: {type: array, items: {type: string, maxLength: 200}, maxItems: 100}
    TargetingRules:
      description: AND groups of OR conditions (existing Targeting tab structure).
      type: array
      maxItems: 10
      items: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/Condition'}}

    CampaignBrief:
      type: object
      description: |
        What the advertiser is booking, in the same shape as the platform's
        Campaign Brief tab (Rob, 20 Sep). Every field is optional: an
        advertiser supplies as much as it has. Stored with the campaign and
        shown to the reviewer; nothing here targets or prices anything.
      properties:
        details: {type: string, maxLength: 2000, description: The campaign in the advertiser's own words.}
        landingPageUrl: {type: string}
        promotedProducts: {type: array, maxItems: 50, items: {type: string}}
        skus: {type: array, maxItems: 100, items: {type: string}}
        targetAudiences: {type: array, maxItems: 50, items: {type: string}}
        objective: {type: string, maxLength: 200}
        touchPoints:
          type: array
          maxItems: 2
          items: {type: string, enum: [Digital Signage, Kiosk]}
          description: Digital Signage only for now; Kiosk is accepted for later.
    PricingType: {type: string, enum: [default, localised, personalised, interactive]}
    CampaignCreate:
      type: object
      required: [advertiserId, name, default]
      description: |
        default is mandatory for every submission (decision, 22 Sep,
        superseding the earlier same-day "baseline optional" decision —
        ticket "Make default creative mandatory; retire localised-only
        booking path"): the earlier fallback-free/part-sold submission
        shape (a campaign with targeted versions but no baseline/default,
        leaving stores none of them match unsold to another advertiser) is
        retired. Every slot now goes to a single advertiser, who supplies a
        mandatory default layer plus optional localised/personalised
        layers as upsells on that one purchase.
      properties:
        advertiserId: {type: string}
        name: {type: string, maxLength: 200}
        displayTypeId: {type: string}
        slot:
          type: integer
          minimum: 1
          description: |
            Which of displayTypeId's advertiser-owned slots this submission
            is for (the same 1-based index as AvailableInventoryRow.slot).
            Optional, but required alongside displayTypeId to resolve that
            slot's own max-campaigns cap below — omitted, the submission
            falls back to the platform-wide campaignLimits.targetedVersions
            cap, unscoped to any one slot. A slot carries no targeting
            capability of its own: targeting is defined on the buyers and
            targeting list assigned to it.
        brief: {$ref: '#/components/schemas/CampaignBrief'}
        default:
          type: object
          required: [pricingType]
          description: |
            The untargeted layer every submission must carry — no targeting
            variables, priced at the floor rate.
          properties:
            pricingType: {$ref: '#/components/schemas/PricingType'}
        targeted:
          type: array
          maxItems: 20
          description: |
            Optional upsells on top of the mandatory default layer —
            localised and/or personalised targeted versions. Bounded by
            slot's own max campaigns (default + targeted versions, 1-10)
            when displayTypeId and slot resolve to a real advertiser slot;
            otherwise by the platform-wide campaignLimits.targetedVersions.
          items:
            type: object
            required: [id, priority, pricingType, rules]
            properties:
              id: {type: string}
              priority: {type: integer}
              pricingType: {$ref: '#/components/schemas/PricingType'}
              rules: {$ref: '#/components/schemas/TargetingRules'}
    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignStatus'
        - type: object
          required: [name, advertiserId, displayTypeId, default, targeted]
          properties:
            name: {type: string}
            advertiserId: {type: string}
            displayTypeId: {type: [string, 'null']}
            default:
              type: object
              required: [pricingType]
              properties:
                pricingType: {$ref: '#/components/schemas/PricingType'}
            targeted:
              type: array
              items:
                type: object
                required: [id, priority, pricingType, rules]
                properties:
                  id: {type: string}
                  priority: {type: integer}
                  pricingType: {$ref: '#/components/schemas/PricingType'}
                  rules: {$ref: '#/components/schemas/TargetingRules'}
    ApprovalStatus: {type: string, enum: [draft, awaiting_approval, approved, rejected]}
    Check:
      type: object
      required: [name, passed]
      properties:
        name: {type: string, enum: [file_type, file_size, bitrate, dimensions, aspect_ratio, duration, default_present, targeting_permitted, dsp_audit, previously_cleared]}
        passed: {type: boolean}
        detail: {type: string}
        assetId: {type: string, description: '"default" or a targeted version id — the specific asset this check ran against. Unset for a campaign-level check (default_present, targeting_permitted).'}
        advisory:
          type: boolean
          description: |
            Information for the reviewer, never a gate (open question 40,
            resolved 29 Sep 2026): a failed advisory check never blocks a
            submission and a passed one never approves it. `dsp_audit` is the
            DSP's own creative audit (DV360 review status, The Trade Desk
            approvedBy, Amazon DSP moderation); `previously_cleared` marks an
            asset byte-identical to one a reviewer already approved.
    AssetRejection:
      type: object
      required: [assetId, reason]
      description: A rejection reason attached to one specific asset, not the whole campaign (spec §3).
      properties:
        assetId: {type: string}
        reason: {type: string, minLength: 1}
    CampaignStatus:
      type: object
      required: [campaignId, status, liveAssetVersion, pendingEdit]
      properties:
        campaignId: {type: string}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        mode: {type: [string, 'null'], enum: [manual, auto, null]}
        reason: {type: [string, 'null']}
        assetVersion: {type: [string, 'null']}
        liveAssetVersion:
          type: [string, 'null']
          description: |
            The approved version that is running — eligible for reservation,
            bidding and hand-off — whatever is under review (open question 38,
            resolved 29 Sep 2026). null until a version has been approved.
        pendingEdit:
          type: boolean
          description: |
            True while an edit to a running campaign awaits approval: `status`
            is awaiting_approval and `assetVersion` is the edit, while
            `liveAssetVersion` keeps running. Approving the edit makes it the
            live version in one step; rejecting it discards it.
        rejectedEdit:
          type: object
          required: [assetVersion, reason, at]
          description: The most recent edit the retailer rejected, which was discarded while the live version carried on. Present until the next edit.
          properties:
            assetVersion: {type: string}
            reason: {type: [string, 'null']}
            at: {type: string, format: date-time}

    ReservationCreate:
      type: object
      required: [positionId, windowStart, campaignId, advertiserId, type, bidCpm]
      properties:
        positionId: {type: string}
        windowStart: {type: string, format: date-time}
        campaignId: {type: string}
        advertiserId: {type: string}
        type: {type: string, enum: [reserve, bid]}
        dealType: {type: string, enum: [preferred, guaranteed], default: preferred, description: 'Only for type reserve. preferred (the default, unchanged) holds the premium window at the reserve price with no volume promised. guaranteed also commits a delivery volume: the window''s forecast impressions (plays x VAC-d) less the retailer''s contingency buffer, returned as guaranteedImpressions and sent to the DSP as the guaranteed unit count in dspDeal. Refused (validation_failed) with type bid.'}
        bidCpm: {type: number, exclusiveMinimum: 0, maximum: 10000, description: 'The CPM, in the company currency, at most 10,000. For type bid, the bid, which must clear the effective floor. For type reserve on a position with a reservePrice, the buyer''s commitment: it must be at least the reservePrice (validation_failed otherwise), and the booking is made at the reservePrice itself, which must clear the effective floor. For type reserve on a named-advertiser position with no reservePrice, the price agreed through the DSP: it must clear the effective floor, and the booking is made at it.'}
    Reservation:
      type: object
      required: [reservationId, status]
      properties:
        reservationId: {type: string}
        status: {type: string, enum: [pending, won, lost, reserved, rejected]}
        clearingCpm: {type: [number, 'null']}
        currency: {type: string}
        reason: {type: [string, 'null']}
        dealType: {type: string, enum: [preferred, guaranteed], description: 'preferred: price held, no volume. guaranteed: guaranteedImpressions is committed.'}
        forecastImpressions: {type: [integer, 'null'], description: 'Guaranteed only: the window''s forecast (plays x VAC-d audience).'}
        guaranteedImpressions: {type: [integer, 'null'], description: 'Guaranteed only: the forecast less the contingency buffer; the committed volume.'}
        dspDeal:
          type: [object, 'null']
          description: 'How the deal is expressed to the buying DSP: DV360 Programmatic Guaranteed or Amazon guaranteed deal (unitCount = guaranteedImpressions), or a preferred deal with no volume.'
          properties:
            dealType: {type: string, enum: [preferred, guaranteed]}
            dspDealKind: {type: string}
            unitCount: {type: [integer, 'null']}
            unit: {type: [string, 'null'], enum: [impressions, null]}

    Exchange:
      allOf:
        - $ref: '#/components/schemas/ExchangeInput'
        - type: object
          required: [published]
          properties:
            published: {type: boolean, description: 'Switched on and all four fields complete: sellers.json is live and DSPs are sent bid requests.'}
            sellersJsonUrl: {type: [string, 'null']}
    ExchangeInput:
      type: object
      required: [enabled, organisation, domain, sellerId, contactEmail]
      description: |
        The four seller-of-record fields are required while `enabled` is
        true. Switched off, they may be blank and are kept as sent, so
        switching back on restores them.
      properties:
        enabled: {type: boolean, description: 'The retailer''s DSP integration switch (Rob, 24 Sep 2026). Off for a new instance. Switching it off deletes nothing.'}
        organisation: {type: string}
        domain: {type: string}
        sellerId: {type: string}
        contactEmail: {type: string, description: An email address when set}
    Features:
      type: object
      required: [dspIntegration]
      properties:
        dspIntegration: {type: boolean, description: The build flag is on and the retailer has DSP integration switched on.}

    AdvertiserSettingsInput:
      type: object
      required: [currency, floorCpm, interactiveCpe, auctionOpensHours, playWindowHours, auctionCutoffTime, categoryWhitelist, categoryBlacklist]
      properties:
        currency: {type: string, description: ISO 4217, default: AUD}
        auctionOpensHours: {type: integer, minimum: 1, default: 168, description: 'Auction schedule: how long before the auction cutoff bidding for a play window opens, in hours (shown as days and hours).'}
        playWindowHours: {type: integer, minimum: 1, maximum: 8760, default: 24, description: 'Auction schedule: the default play-window length, in hours (shown as days and hours) — since OQ27 (29 Sep 2026) only what a slot inherits when neither it nor its display type sets a billing unit; a slot''s billing unit is its window length. While any current window on an inheriting slot is bid on or booked, a change is deferred rather than applied — see pendingPlayWindowHours.'}
        auctionCutoffTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '18:00', description: 'Auction schedule: the daily time (HH:MM, UTC) by which bids must be received; the auction for the next play window runs then.'}
        floorCpm: {type: number, exclusiveMinimum: 0, default: 100}
        interactiveCpe: {type: number, minimum: 0, multipleOf: 0.01, default: 0.5, description: 'Interactive cost per engagement: what an advertiser pays each time someone engages with an interactive campaign (a QR Control scan), on top of the CPM. To the cent; 0 means engagements are not charged for.'}
        categoryWhitelist: {type: array, items: {type: string}, description: 'IAB categories, chosen from the IAB taxonomy (free text is refused, 422). One list for every DSP.'}
        categoryBlacklist: {type: array, items: {type: string}}
        bidLookaheadSeconds: {type: integer, minimum: 1, default: 35, description: 'Real-time bidding: how many seconds before a slot plays its auction opens, so the winning creative can be downloaded and rendered in time. Company-wide. Default 35, matching Broadsign Reach (its Real-Time Audience API sends bid requests about 35 s before the expected programmatic slot). Optional on save: omitted keeps the stored value.'}
        defaultCommittedPlays: {type: integer, minimum: 1, nullable: true, description: 'Play config: the committed-plays figure a new buyers list is pre-filled with (the field stays editable per list; editing a saved list never changes it). Whole number, at least 1; null means no default (per play). Optional on save: omitted keeps the stored value, null clears it.'}
        uncachedRestriction: {type: string, enum: [off, fixed, store_open], default: off, description: 'Bandwidth protection (real-time impressions): while the restriction is in force, only a bid whose creative the player already holds in its cache can win; an uncached creative would need a live download. `off`: never restricted. `fixed`: restricted between uncachedRestrictionStart and uncachedRestrictionEnd every day (UTC). `store_open`: restricted while the player reports the store open (`storeOpen` on the impression signal). Optional on save: omitted keeps the stored value.'}
        uncachedRestrictionStart: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '09:00', description: 'Start of the daily restricted window (HH:MM, UTC); used when uncachedRestriction is `fixed`. A start after the end wraps past midnight. Optional on save.'}
        uncachedRestrictionEnd: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '18:00', description: 'End of the daily restricted window (HH:MM, UTC, exclusive); used when uncachedRestriction is `fixed`. Optional on save.'}
        guaranteeBufferPct: {type: number, minimum: 0, maximum: 50, default: 10, description: 'Guaranteed deals: the contingency (percent, for screen downtime) taken off a window''s forecast impressions (plays x VAC-d audience) before the remainder is committed as the guaranteed volume. Instance-wide. Optional on save: omitted keeps the stored value.'}
    AdvertiserSettings:
      allOf:
        - $ref: '#/components/schemas/AdvertiserSettingsInput'
        - type: object
          required: [pendingPlayWindowHours, pendingPlayWindowEffectiveFrom]
          properties:
            pendingPlayWindowHours:
              type: [integer, 'null']
              description: |
                Read-only. Set when a playWindowHours change was requested
                while a non-test window was still bid on or booked: the
                requested length, waiting to take effect at
                pendingPlayWindowEffectiveFrom. Null when nothing is deferred.
            pendingPlayWindowEffectiveFrom:
              type: [string, 'null']
              format: date-time
              description: |
                Read-only. When pendingPlayWindowHours takes effect — once
                every window active when it was requested has played (a
                booking made since, running later than that, pushes this
                out). Null when nothing is deferred.
    DspAdvertisers:
      type: object
      description: A DSP and the advertisers it brings, for a picker or a filter.
      required: [partnerId, name, advertisers]
      properties:
        partnerId: {type: string}
        name: {type: string}
        advertisers:
          type: array
          items:
            type: object
            required: [advertiserId, name]
            properties:
              advertiserId: {type: string}
              name: {type: string}
    AssignedTo:
      type: object
      description: |
        Who may buy a position: DSPs, named advertisers, the advertiser
        whitelist, or a buyers list (private auction). No DSPs and no
        advertisers means any connected DSP. A buyers list is mutually
        exclusive with advertisers and whitelistOnly.
      required: [partnerIds, partnerNames, advertisers, whitelistOnly, buyersListId, buyersListName]
      properties:
        partnerIds: {type: array, items: {type: string}}
        partnerNames: {type: array, items: {type: string}, description: The same DSPs by name, for display.}
        advertisers: {type: array, items: {type: string}, description: Named advertisers it is held for.}
        whitelistOnly: {type: boolean, description: 'Only advertisers on the whitelist may bid; never true when advertisers is non-empty or buyersListId is set.'}
        buyersListId: {type: [string, 'null'], description: 'A private auction restricted to this buyers list''s invited buyers; null means not a private auction.'}
        buyersListName: {type: [string, 'null'], description: The same buyers list by name, for display.}
        buyersListIds: {type: array, items: {type: string}, description: 'The buyers lists assigned to this slot in priority order (a waterfall): the first is tried first and the exchange falls through to the next only when the tier above yields no winning bid at its floor. Priority belongs to the slot, so one list may rank differently on each slot it is assigned to. One list per tier. buyersListId is the first of these. Optional on write (omitted: buyersListId alone).'}
        buyersListNames: {type: array, items: {type: string}, description: The same lists by name, in the same order.}
    InvitedBuyer:
      type: object
      description: |
        One invited buyer on a buyers list (deal): a seat (advertiser) that a
        connected DSP synced, picked from that DSP's own seats. There is no
        free text and no identifier type — the entry always carries the
        identifier the DSP bids under, and entitlement (bid intake and
        auction clear, `not_invited`) matches it exactly.
      required: [partnerId, seatId]
      properties:
        partnerId: {type: string, description: The DSP (partner) whose synced seat this is.}
        seatId: {type: string, description: 'The seat / advertiser ID as synced from that DSP (a seat in `Partner.seats`).'}
    LockedWin:
      type: object
      description: |
        The winning bid a private auction's rate has locked to, for the
        rest of its delivery term (spec "…dynamic VAC-d billing over the
        delivery term", 23 Sep 2026). Set once, by the exchange: the first
        time a bid clears within the deal's auctionCloses deadline, or
        when an invited buyer first commits at the position's reserve price
        (see `source`). It is never overwritten, and an API caller never
        sets it directly. Every later
        play window in the term is booked at `cpm` for this winner
        directly, without a fresh auction; each is still billed on its own
        realised VAC-d for that window (dynamic VAC-d is unchanged — only
        the rate is fixed rather than re-cleared).
      required: [cpm, partnerId, advertiserId, campaignId, pricingType, channel, lockedAt]
      properties:
        cpm: {type: number, description: The CPM every later play window in the term is booked and billed at.}
        partnerId: {type: string, description: The winning DSP.}
        advertiserId: {type: [string, 'null']}
        campaignId: {type: string, description: The campaign every later play window hands off to.}
        pricingType: {type: [string, 'null']}
        channel: {type: string, enum: [api, openrtb], description: How the winning bid arrived — carried forward so later windows book the same way.}
        lockedAt: {type: string, format: date-time}
        source:
          type: string
          enum: [auction, reserve]
          description: |
            What locked the term (open questions 45 and 52, decided by Rob on
            29 Sep 2026). `auction`: a bid cleared within auctionCloses.
            `reserve`: an invited buyer committed to the position's reserve price
            (`POST /v1/reservations`, `type: reserve`) before any bid cleared.
            That is a programmatic-guaranteed commitment, so every later window
            in the term is held as Reserved and booked as a `reserved`
            reservation. Absent on a lock written before this field existed,
            which reads as `auction`. Neither kind books a window below the
            effective floor in force when the window is booked.
            In both cases each window is billed on its own realised VAC-d.
            There is no guaranteed volume and no make-good.
    BuyersList:
      type: object
      description: |
        A reusable private-auction deal (spec "Support private auctions";
        two-period model, 23 Sep 2026): an invited-buyer list, a delivery
        term (activeFrom/activeTo) and, optionally, a one-time auction
        window (auctionCloses) — created once and attached to any number of
        slots' assignedTo.buyersListId. Floor, auction resolution rule
        (first- vs second-price) and the per-brand relationship variable
        are never set here — they come from the slot, the platform, and the
        brand entity respectively.

        This is the deal object (open question 45, decided by Rob on 29 Sep
        2026). A deal is per DSP and bilateral: its invited buyers resolve to
        DSP seats, and a locked term binds one DSP's buyer
        (lockedWin.partnerId). There is no company-wide deal. A deal's rate
        is priced against the same score-driven floor as everything else. It
        is a commitment on top of the floor, never under it, and a deal never
        bypasses the floor.
      required: [id, name, description, invitedBuyers, targeting, activeFrom, activeTo, auctionCloses, lockedWin, committedPlays, floorCpm, deliveredPlays, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        invitedBuyers: {type: array, items: {$ref: '#/components/schemas/InvitedBuyer'}}
        floorCpm:
          type: [number, 'null']
          description: 'This list''s own bid floor in USD CPM, or null to inherit the DSP''s floor, else the platform floor. Never below the platform floor.'
        committedPlays:
          type: [integer, 'null']
          minimum: 1
          description: |
            The play volume this deal commits to over its delivery term
            (7 Oct 2026; open question 45). Volume is carried by deals,
            never by the open auction, which stays per play and holds no
            block of plays. null = no volume commitment (the deal is per
            play). For a guaranteed deal the figure is sized from the
            forecast plus the contingency buffer, not typed in here.
        deliveredPlays:
          type: integer
          minimum: 0
          readOnly: true
          description: |
            Read only. Plays billed so far at every position this deal is
            attached to, in play windows that start inside the delivery term
            (summed from billing line items). 0 when committedPlays is null.
        targeting:
          type: array
          items: {$ref: '#/components/schemas/Condition'}
          description: |
            Targeting criteria appended to the deal, ANDed (buyers and
            targeting definition, 7 Oct 2026). Variable and fixed store
            segments, state, suburb (city), display tags, localisation
            variables, and personalised variables only where the retailer has
            enabled them for the invited DSPs. A personalised criterion is a
            predicate only: it is matched against the live visitor at bid
            time and no attribute value is ever sent to the buyer.
        activeFrom:
          type: [string, 'null']
          format: date-time
          description: |
            The delivery term's start (spec "Private auctions: two-period
            model") — the span being awarded, not the bidding deadline
            (see auctionCloses). Inclusive; null = no start bound.
        activeTo: {type: [string, 'null'], format: date-time, description: 'The delivery term''s end. Inclusive; null = no end bound.'}
        auctionCloses:
          type: [string, 'null']
          format: date-time
          description: |
            The deal's own one-time bidding deadline (the auction window):
            invited brands may submit and revise bids until this time, at
            or before which the auction clears once and locks the winning
            rate (lockedWin) for the rest of the delivery term. null = this
            deal isn't using the two-period model — it clears fresh every
            play window, same as a buyers list before this field existed.
        lockedWin:
          oneOf: [{$ref: '#/components/schemas/LockedWin'}, {type: 'null'}]
          description: 'null until the term''s one-time auction has cleared (or when auctionCloses itself is null). See LockedWin.'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AvailableInventoryRow:
      type: object
      required: [displayTypeId, displayTypeName, playlistName, playlistId, unassigned, scored, unsellableReason, salesLocked, slot, zoneSlot, position, assignedTo, qrControl, visionAi, reservePrice, reservePriceOverride, displayTypeReservePrice, interactiveReservePrice, interactiveReservePriceOverride, billingUnitHours, billingUnitHoursOverride, displayTypeBillingUnitHours, companyPlayWindowHours, maxCampaigns, maxCampaignsOverride, displayTypeMaxCampaigns]
      properties:
        displayTypeId: {type: string}
        displayTypeName: {type: string}
        touchPoint: {type: string}
        scored:
          type: boolean
          description: |
            Whether the slot has an audience score (an audience_vacd row).
            An unscored slot reports 0 assumed views, so it is never
            exposed to advertisers (GET /v1/inventory), forecast, auctioned
            or bid on (ticket, 30 Sep 2026). Saving it is not blocked.
        unsellableReason:
          type: [string, 'null']
          description: 'Why the slot can''t be sold yet — no audience score — or null when it can. Shown as a warning on Available Inventory.'
        salesLocked:
          type: boolean
          description: |
            True while this slot is locked against new sales (ticket "Lock
            playlist slot against new sales when slots are sold", 30 Sep
            2026). Existing bookings are unaffected; the lock releases by
            itself once the booking schedule has no live booking on the slot.
        salesLockedUntil:
          type: [string, 'null']
          format: date-time
          description: When the last live booking on a locked slot finishes playing, i.e. the earliest the lock can release; null when not locked.
        playlistName: {type: string}
        playlistId:
          type: [string, 'null']
          description: |
            The id of the playlist this row's position sits under: the zone
            playlist its slot belongs to (`Slot.zoneId`, spec §1) when the
            display type is multi-zone, else the
            display type's own default playlist. Null only when neither
            resolves to a real playlist record. playlistName is what is
            shown; this is for linking/lookup (Available Inventory,
            ticket "Available Inventory: playlist-primary table (drop
            Display type column) with Unassigned indicator", 27 Sep 2026).
        unassigned:
          type: boolean
          description: |
            True when this position's display type currently has no
            physical display using it (Displays & Devices,
            DisplaySource.summaryByDisplayType) — its advertiser slots
            exist and can be configured and sold, but nothing is actually
            playing them. Available Inventory shows this as an "Unassigned"
            indicator next to the playlist (same ticket as playlistId,
            27 Sep 2026).
        slot:
          type: integer
          description: |
            This position's 1-based index in the display type's own flat slot
            list — spans every zone (spec "one segment per zone, in zone
            order"), never resets per zone. This is the position's identity
            (`PH-CORE-BOUNDARIES.md` "At most one campaign per display type,
            slot and play window") and what `PUT` keys edits on — it is not
            what Available Inventory displays as "Slot"; see zoneSlot for that.
        zoneSlot:
          type: integer
          description: |
            This position's 1-based index within its own zone's segment of
            the slot list (ticket, 28 Sep 2026: a multi-zone display's
            Available Inventory row showed the flat `slot` number — e.g. 4
            for Zone 2's first slot on a display with two slots per zone —
            when each zone runs its own separate playlist and rotation, so
            the position that actually matters to the reader is "which slot
            in this zone's own rotation", always starting at 1 per zone).
            Equal to `slot` when the display type isn't multi-zone, or the
            slot has no `zoneId`, since there is then only one segment.
            Display-only — never sent to `PUT`, which still keys on `slot`.
        position: {type: string}
        assignedTo: {$ref: '#/components/schemas/AssignedTo'}
        qrControl:
          type: boolean
          description: |
            Whether the display type has QR Control enabled. Interactive
            targeting needs it — there is nothing for a visitor to engage with
            otherwise — so a slot on a display type without it cannot support
            interactive.
        visionAi:
          type: boolean
          description: |
            Whether the display type has the Vision/AI feature enabled —
            on-device computer vision for passerby insight and person match
            (Display Types → Enabled Features). Shown here as a plain
            capability flag, the same way qrControl is (ticket "show a
            computer vision icon when computer vision is enabled on a
            specific display type", 22 Sep) — this display type's hardware
            capability, not any one booking's personalised targeting rules
            (see BookingSchedule.personalisedTriggers.computerVision, a
            different thing: whether a specific campaign's rules happen to
            use a computer-vision variable).
        reservePrice:
          type: [number, 'null']
          description: |
            The resolved CPM premium at which this slot can be reserved in
            advance of the open auction: reservePriceOverride when set,
            else displayTypeReservePrice, else null. Company currency;
            this is what is published on the position in `GET /v1/inventory`.
        reservePriceOverride:
          type: [number, 'null']
          description: |
            This slot's own reserve price, admin-editable here; null means
            it has none and follows displayTypeReservePrice (spec §1
            configuration inheritance — override always wins).
        displayTypeReservePrice:
          type: [number, 'null']
          description: |
            The reserve price default set on this slot's display type; null
            means the display type has none either. The same value on every
            row sharing a displayTypeId. Editable from any of those rows —
            see `PUT`'s reservePriceDefault.
        billingUnitHours:
          type: number
          description: |
            The resolved billing-unit granularity, in hours (spec "Private
            auctions: two-period model", 23 Sep 2026): billingUnitHoursOverride
            when set, else displayTypeBillingUnitHours, else
            companyPlayWindowHours. Always a real number — unlike reserve
            price, there is no "no billing unit" state. Since OQ27 (29 Sep
            2026) this is the slot's play-window length: the windows it is
            auctioned, booked and billed against.
        billingUnitHoursOverride:
          type: [number, 'null']
          description: |
            This slot's own billing unit, admin-editable here; null means
            it has none and follows displayTypeBillingUnitHours (spec §1
            configuration inheritance — override always wins).
        displayTypeBillingUnitHours:
          type: [number, 'null']
          description: |
            The billing-unit default set on this slot's display type; null
            means the display type has none either (so an un-overridden
            slot resolves to companyPlayWindowHours). The same value on
            every row sharing a displayTypeId. Editable from any of those
            rows — see `PUT`'s billingUnitHoursDefault.
        companyPlayWindowHours:
          type: integer
          description: |
            The company-wide play window (Advertiser settings →
            playWindowHours, platform default 24): what a slot's billing
            unit resolves to when neither it nor its display type sets one
            (OQ27, 29 Sep 2026). The same on every row; read-only here.
        interactiveReservePrice:
          type: [number, 'null']
          description: |
            The resolved reserve price (CPM) for an interactive campaign on
            this slot: interactiveReservePriceOverride when set, else
            `reservePrice`. Null when neither exists.
        interactiveReservePriceOverride:
          type: [number, 'null']
          description: |
            This slot's own interactive reserve price, admin-editable here
            while the slot supports interactive targeting; null means
            interactive campaigns follow `reservePrice`.
        maxCampaigns:
          type: integer
          description: |
            The resolved maximum number of campaigns (the mandatory default
            layer plus optional targeted versions) this advertiser may
            submit for this slot: maxCampaignsOverride when set, else
            displayTypeMaxCampaigns, else the platform default of 5.
            Purely a submission cap — it does not feed the auction or
            billing. Always a real integer, 1-10 inclusive — unlike reserve
            price, there is no "unlimited" state.
        maxCampaignsOverride:
          type: [integer, 'null']
          description: |
            This slot's own maximum campaigns, admin-editable here; null
            means it has none and follows displayTypeMaxCampaigns (spec §1
            configuration inheritance — override always wins). 1-10
            inclusive when set.
        displayTypeMaxCampaigns:
          type: [integer, 'null']
          description: |
            The maximum-campaigns default set on this slot's display type;
            null means the display type has none either (so an
            un-overridden slot resolves to the platform default of 5). The
            same value on every row sharing a displayTypeId. Editable from
            any of those rows — see `PUT`'s maxCampaignsDefault. 1-10
            inclusive when set.

    BookingSchedule:
      type: object
      required: [currency, windows, positions, revenue, dsps, byPricingType, totals]
      properties:
        currency: {type: string, description: ISO 4217}
        windows:
          type: array
          items: {type: object, required: [start, end], properties: {start: {type: string, format: date-time}, end: {type: string, format: date-time}}}
        positions:
          type: array
          items:
            type: object
            required: [positionId, displayTypeId, displayTypeName, slot, slotLabel, zoneName, zoneSlot, partnerNames, assignment, displayCount, windows]
            properties:
              positionId: {type: string}
              displayTypeId: {type: string}
              displayTypeName: {type: string}
              slot: {type: integer, minimum: 1}
              slotLabel: {type: string}
              zoneName:
                type: [string, 'null']
                description: The zone this slot plays in on a multi-zone display type (null on a single-zone one). Shown as "Zone n / Slot m" with zoneSlot.
              zoneSlot:
                type: integer
                minimum: 1
                description: The slot's 1-based place within its own zone (equals `slot` on a single-zone display type) — the number Available Inventory shows. positionId keeps the flat index.
              partnerNames: {type: array, items: {type: string}, description: 'The DSPs the slot is tied to; empty = any connected DSP.'}
              assignment: {type: string, enum: [rtb, whitelist_only, deal, reserved]}
              displayCount:
                type: integer
                description: |
                  Displays using this display type across the whole retail
                  footprint: plain sizing from the display source. This
                  prototype has no narrower per-slot store scope for an
                  advertiser position, so it is also what "the slot's store
                  scope" resolves to here.
              windows:
                type: array
                description: One per schedule window, in the same order.
                items:
                  type: object
                  required: [start, status, booking]
                  properties:
                    start: {type: string, format: date-time}
                    status: {type: string, enum: [booked, available, unavailable]}
                    booking:
                      type: [object, 'null']
                      required: [reservationId, campaignId, advertiserId, partnerId, pricingType, type, advertiserName, partnerName, cpm, assumedViews, bookedRevenue, billedRevenue, layers, personalisedTriggers]
                      properties:
                        reservationId: {type: string}
                        campaignId: {type: string}
                        advertiserId: {type: [string, 'null']}
                        partnerId: {type: string}
                        pricingType: {$ref: '#/components/schemas/PricingType'}
                        layers:
                          type: object
                          description: |
                            Which of the three layers this one advertiser's
                            booking actually carries (ticket "Booking
                            schedule: single-advertiser stacking tile", 22
                            Sep) — default is always present (mandatory
                            since the same-day "Make default creative
                            mandatory" ticket); localised/personalised are
                            upsells on the same purchase, present when the
                            campaign submitted a targeted version of that
                            type (interactive counts as localised for this
                            breakdown, same grouping the schedule has always
                            used). Drives the tile's stacked height: 1-3
                            layers, tallest at the top.
                          required: [default, localised, personalised]
                          properties:
                            default: {type: boolean}
                            localised: {type: boolean}
                            personalised: {type: boolean}
                        personalisedTriggers:
                          type: [object, 'null']
                          description: |
                            Only when layers.personalised is true (ticket
                            "Booking schedule: personalised trigger icons",
                            22 Sep): which trigger mechanism(s) the
                            personalised layer's targeting rules use, from
                            broadest/most frequent to narrowest/rarest —
                            computer vision (fires on almost anyone in front
                            of the screen), aggregate store-level (the
                            aggregate of who is in the store), individual
                            (the visitor is identified/checked in). More
                            than one may be lit when the rules combine
                            tiers. All false when personalised has no
                            classifiable targeting rules yet; null when
                            layers.personalised is false.
                          required: [computerVision, aggregateStore, individual]
                          properties:
                            computerVision: {type: boolean}
                            aggregateStore: {type: boolean}
                            individual: {type: boolean}
                        type: {type: string, enum: [reserve, bid]}
                        advertiserName: {type: string}
                        partnerName: {type: string}
                        cpm: {type: number, description: The CPM it was booked at (the agreed reservation price, or the clearing CPM).}
                        assumedViews: {type: integer}
                        bookedRevenue: {type: number}
                        billedRevenue: {type: [number, 'null'], description: From billing once the window has played; null before.}
        revenue:
          type: array
          description: Per display type with advertiser slots, over the schedule's windows.
          items: {$ref: '#/components/schemas/BookingRevenue'}
        dsps:
          type: array
          description: The DSPs the filters offer, and the advertisers each one brings.
          items: {$ref: '#/components/schemas/DspAdvertisers'}
        byPricingType:
          type: array
          description: The same bookings by campaign type, so a retailer can see what is selling.
          items:
            type: object
            required: [pricingType, bookedWindows, bookedRevenue]
            properties:
              pricingType: {$ref: '#/components/schemas/PricingType'}
              bookedWindows: {type: integer}
              bookedRevenue: {type: number}
        totals: {$ref: '#/components/schemas/BookingRevenueTotals'}
    BookingRevenueTotals:
      type: object
      required: [bookedWindows, sellableWindows, bookedRevenue, billedRevenue]
      properties:
        bookedWindows: {type: integer}
        sellableWindows: {type: integer, description: Sum of every display type's sellableWindows — see BookingRevenue.}
        bookedRevenue: {type: number}
        billedRevenue: {type: number}
    BookingRevenue:
      type: object
      required: [displayTypeId, displayTypeName, bookedWindows, sellableWindows, bookedRevenue, billedRevenue]
      properties:
        displayTypeId: {type: string}
        displayTypeName: {type: string}
        bookedWindows: {type: integer}
        sellableWindows:
          type: integer
          description: |
            Windows this display type could have sold in the period shown —
            booked or still available, excluding unavailable (no displays,
            or before the first sellable window) — across every advertiser
            position of this display type, regardless of the advertiser/DSP
            filter (ticket "booking revenue table: % of slots sold", 22
            Sep). bookedWindows ÷ sellableWindows is the % sold; 0 means
            nothing on this display type could be sold in the period, so no
            percentage is meaningful.
        bookedRevenue: {type: number}
        billedRevenue: {type: number}
    VariableAccess:
      oneOf:
        - {type: string, const: all}
        - {type: array, items: {type: string}}
    SharedVariable:
      type: object
      required: [key, label, group, exampleValues, access]
      properties:
        key: {type: string}
        label: {type: string}
        group: {type: string, enum: [localisation, personalisation]}
        exampleValues: {type: string, description: Tooltip text}
        access: {$ref: '#/components/schemas/VariableAccess'}

    Provider: {type: string, enum: [google_dv360, amazon_dsp, the_trade_desk]}
    Partner:
      type: object
      required: [id, provider, name, status, mode]
      properties:
        id: {type: string}
        provider: {$ref: '#/components/schemas/Provider'}
        name: {type: string}
        status: {type: string, enum: [draft, connected, error]}
        lastSync: {type: [string, 'null'], description: Last connection result, e.g. the DSP's error reason.}
        mode: {type: string, enum: [test, live]}
        credentials:
          type: object
          description: Non-secret fields in full; secret fields only as {set:true}.
          additionalProperties: true
        bidder:
          type: object
          properties:
            bidderEndpoint: {type: string, format: uri}
            seatIds: {type: array, items: {type: string}}
            qps: {type: [integer, 'null'], minimum: 1, maximum: 10000, description: 'Per-DSP QPS ceiling override (Q46). Absent: the platform default, 500. null on save clears it.'}
            timeoutMs: {type: [integer, 'null'], minimum: 50, maximum: 2000, description: 'Per-DSP bidder timeout override in ms (Q46), also sent as tmax. Absent: the platform default, 300. null on save clears it.'}
            floorCpm: {type: [number, 'null'], exclusiveMinimum: 0, description: 'This DSP''s bid floor in USD CPM (bid floor hierarchy, Rob 7 Oct 2026). Raises the platform floor for this DSP only; never below it (400 otherwise). Absent: inherits the platform floor. null on save clears it.'}
        issues:
          type: array
          description: Shown at the top of the DSP page.
          items:
            type: object
            required: [kind, message]
            properties:
              kind: {type: string, enum: [connection_error, missing_credentials, missing_bidder_fields]}
              message: {type: string}
              fields: {type: array, items: {type: string}}
        seats:
          type: array
          description: The DSP's seats and advertisers, pulled on connect (spec §8). Offered in the slot picker and as list suggestions.
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
        advertiserWhitelist: {type: array, items: {type: string}, description: 'This DSP''s own advertiser whitelist: seat IDs from its synced seats (the ids in seats). Always present; there is no company-wide advertiser list.'}
        advertiserBlacklist: {type: array, items: {type: string}, description: 'This DSP''s own advertiser blacklist: seat IDs from its synced seats. Always subtracts.'}
    PartnerInput:
      type: object
      properties:
        credentials:
          type: object
          description: |
            google_dv360 — partnerId, serviceAccountEmail, privateKeyJson (secret).
            amazon_dsp — region, lwaClientId, lwaClientSecret (secret), refreshToken (secret), profileId, entityId.
            the_trade_desk — supplySourceId, ttdPartnerId, apiToken (secret), region.
          additionalProperties: {type: string}
        bidder:
          type: object
          properties:
            bidderEndpoint: {type: string, format: uri}
            seatIds: {type: array, items: {type: string}}
            qps: {type: [integer, 'null'], minimum: 1, maximum: 10000, description: 'Per-DSP QPS ceiling override (Q46). Absent: the platform default, 500. null on save clears it.'}
            timeoutMs: {type: [integer, 'null'], minimum: 50, maximum: 2000, description: 'Per-DSP bidder timeout override in ms (Q46), also sent as tmax. Absent: the platform default, 300. null on save clears it.'}
            floorCpm: {type: [number, 'null'], exclusiveMinimum: 0, description: 'This DSP''s bid floor in USD CPM (bid floor hierarchy, Rob 7 Oct 2026). Raises the platform floor for this DSP only; never below it (400 otherwise). Absent: inherits the platform floor. null on save clears it.'}
        mode: {type: string, enum: [test, live]}
        advertiserWhitelist: {type: array, items: {type: string}, description: 'Seat IDs from this DSP''s synced seats. An ID that is not one of them is refused (422); free text is not accepted.'}
        advertiserBlacklist: {type: array, items: {type: string}, description: Seat IDs from this DSP's synced seats.}

    AdvertiserSetting:
      type: object
      required: [approvalRequired, floorMultiplier]
      properties:
        approvalRequired: {type: boolean, default: true}
        floorMultiplier: {type: number, exclusiveMinimum: 0, default: 1.0}
    Advertiser:
      allOf:
        - $ref: '#/components/schemas/AdvertiserSetting'
        - type: object
          required: [advertiserId, name, via, effectiveFloorCpm, campaigns, bookings]
          properties:
            advertiserId: {type: string}
            name: {type: string}
            via: {type: array, items: {type: string}, description: DSP names}
            effectiveFloorCpm: {type: number}
            bookings:
              type: integer
              description: |
                Play windows this advertiser holds from the current window on.
                0 means it has nothing on the booking schedule, so there is
                nothing to open there.
            campaigns:
              type: object
              description: This advertiser's campaigns by approval status, so the retailer can see who is waiting.
              required: [draft, awaiting_approval, approved, rejected]
              properties:
                draft: {type: integer}
                awaiting_approval: {type: integer}
                approved: {type: integer}
                rejected: {type: integer}

    Approval:
      type: object
      required: [campaignId, status, assetVersion, liveAssetVersion, pendingEdit]
      properties:
        campaignId: {type: string}
        campaignName: {type: string}
        advertiserName: {type: string}
        partnerName: {type: string}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        mode: {type: [string, 'null'], enum: [manual, auto, null]}
        assetVersion: {type: string}
        submittedAt: {type: [string, 'null'], format: date-time}
        reviewedBy: {type: [string, 'null']}
        reviewedAt: {type: [string, 'null'], format: date-time}
        reason: {type: [string, 'null']}
        assetReasons:
          type: array
          description: The current rejection's per-asset breakdown, when the reviewer named specific assets (spec §3, "asset-level rejection").
          items: {$ref: '#/components/schemas/AssetRejection'}
        checks: {type: array, items: {$ref: '#/components/schemas/Check'}}
        liveAssetVersion:
          type: [string, 'null']
          description: |
            The approved version that is running — eligible for reservation,
            bidding and hand-off — whatever is under review (open question 38,
            resolved 29 Sep 2026). null until a version has been approved.
        pendingEdit:
          type: boolean
          description: |
            True while an edit to a running campaign awaits approval: `status`
            is awaiting_approval and `assetVersion` is the edit, while
            `liveAssetVersion` keeps running. Approving the edit makes it the
            live version in one step; rejecting it discards it.
        rejectedEdit:
          type: object
          required: [assetVersion, reason, at]
          description: The most recent edit the retailer rejected, which was discarded while the live version carried on. Present until the next edit.
          properties:
            assetVersion: {type: string}
            reason: {type: [string, 'null']}
            at: {type: string, format: date-time}
        targetingSummary: {type: string}
        creative:
          type: [object, 'null']
          description: The default layer's creative under review, for rendering on the target canvas.
          required: [assetUrl, mimeType, width, height]
          properties:
            assetUrl: {type: string}
            mimeType: {type: string}
            width: {type: integer}
            height: {type: integer}
            contentHash: {type: string, description: 'sha256 of the file, when available — the basis for "safe reuse of previously approved assets" (spec §3).'}
        canvas:
          type: [object, 'null']
          description: The target display type's canvas.
          required: [width, height]
          properties:
            width: {type: integer}
            height: {type: integer}
        audit:
          type: array
          items:
            type: object
            required: [at, action]
            properties:
              at: {type: string, format: date-time}
              action: {type: string, enum: [submitted, auto_approved, approved, rejected, returned_for_review, unrejected, edit_discarded, reused_clearance]}
              by: {type: [string, 'null']}
              reason: {type: [string, 'null']}
              assetVersion: {type: string}
              assetReasons: {type: array, items: {$ref: '#/components/schemas/AssetRejection'}}

    DisplayTypeExtensions:
      type: object
      required: [slots]
      properties:
        defaultVacd:
          type: [integer, 'null']
          minimum: 0
          description: |
            Default VAC-d audience score: assumed views per play window, per
            display (ticket, 1 Oct 2026). Every display of this type starts
            with it, and a slot with no score of its own is scored from it
            (the sum over the type's displays, each at its own override
            where it has one), so no slot is unscored. Editing it reaches
            every display that was never overridden. Absent keeps the saved
            value; null clears it.
        defaultVacdSource:
          type: string
          enum: [manual, computer_vision]
          readOnly: true
          description: |
            Who set the default. `computer_vision` (written by PH Core
            through `PUT …/default-vacd`) is counted and overrides a manual
            value; `manual` (this editor) is modelled. Set by the server —
            ignored on write here.
        slots:
          type: array
          items:
            type: object
            required: [label, owner]
            properties:
              label: {type: string}
              owner: {type: string, enum: [internal, advertiser, retail]}
              zoneId:
                type: [string, 'null']
                description: |
                  Which zone of a multi-zone display type this slot belongs
                  to (id of an entry in `multiZone.zones`). Each zone runs
                  its own playlist and so its own rotation (ticket, 28 Sep
                  2026): the slot list is one segment per zone, in zone
                  order, each segment sized by that zone's own
                  `maximumCampaignsPlayedInRotation` (on the zone entry),
                  and every slot in a segment carries that zone's id — the
                  server rejects a slot in the wrong segment. Absent or
                  null only on a single-zone display type, whose slots
                  follow the display type's own cap. Available Inventory
                  shows a slot under its zone's playlist. This does not
                  change what identifies a sellable position (still display
                  type + slot number, PH-CORE-BOUNDARIES.md "At most one
                  campaign per display type, slot and play window") or
                  anything about booking, pricing or delivery — a
                  three-zone Menu Board with two slots a zone simply has six
                  positions.
              partnerIds:
                type: array
                description: |
                  The DSPs that may buy this position; empty or absent means any
                  connected DSP. Set on Advertisers / Inventory, not on the
                  display type: the slot editor only sets the label and owner.
                items: {type: string}
              advertisers:
                type: array
                description: |
                  Named advertisers the position is held for; empty means it is
                  not reserved. Their DSPs are always among partnerIds.
                items: {type: string}
              listMode: {type: [string, 'null'], enum: [rtb, whitelist_only, deal, null]}
              buyersListId:
                type: [string, 'null']
                description: |
                  A private auction restricted to this buyers list's
                  invited buyers (set from Advertisers / Inventory, not the
                  slot editor). Mutually exclusive with advertisers and
                  whitelistOnly; listMode is deal whenever this is set.
              buyersListIds:
                type: array
                description: The slot's buyers lists in priority order (waterfall); buyersListId is the first.
                items: {type: string}
              storeScope: {type: [string, 'null']}
              quota: {type: [integer, 'null']}
              salesLocked:
                type: boolean
                description: |
                  Locked against new sales (30 Sep 2026): set from Available
                  Inventory when the advertiser can't be removed because slots
                  are sold, cleared by the server itself once the slot has no
                  live booking. Not writable through the slot editor's PUT.
              bidMode:
                type: string
                enum: [advance, realtime]
                description: |
                  How this Advertiser slot is sold (7 Oct 2026). `advance`
                  (the default when absent) is the play-window path: bids and
                  reserve bookings for a window, cleared by the scheduled
                  auction. `realtime` sells each impression as the player
                  signals it (POST /api/player/v1/impressions): a bid request
                  goes to the connected DSPs and must clear within tmax. A
                  real-time position takes no window bookings or bids and its
                  windows read unavailable. Set from the slot editor; only an
                  Advertiser slot may be `realtime`, and it is for open and
                  whitelist-only positions (a slot held for named advertisers
                  or assigned to a private auction does not fill in real time).
              reservePrice:
                type: [number, 'null']
                description: |
                  This slot's own override of the display type's reserve
                  price (decision, 22 Sep; real inheritance, 22 Sep — spec
                  §1 configuration inheritance, not a copy action). Absent
                  or null means it has none and follows the display type's
                  own `reservePrice` (below); an override always wins. Set
                  from Advertisers / Inventory, not the slot editor.
              billingUnitHours:
                type: [number, 'null']
                description: |
                  This slot's own override of the display type's billing
                  unit (spec "Private auctions: two-period model", 23 Sep
                  2026): the granularity a CPM is quoted and charged
                  against — default one day (24 hours). Same inheritance as
                  reservePrice: absent or null follows the display type's
                  own `billingUnitHours` (below), else the company-wide
                  play window (Advertiser settings → playWindowHours,
                  platform default 24). Set from Advertisers / Inventory,
                  not the slot editor. The source of truth for this slot's
                  play-window length (OQ27, 29 Sep 2026): its windows are
                  this long, each auctioned, booked and billed (dynamic
                  VAC-d) on its own.
              interactiveReservePrice:
                type: [number, 'null']
                description: |
                  This slot's own reserve price (CPM) for interactive
                  campaigns (ticket 5eLDRBqEGhNyJSHSIFFG, 4 Oct 2026):
                  what a buyer commits to for a window when the campaign's
                  type is interactive. Absent or null means interactive
                  campaigns follow the slot's ordinary reserve price
                  (override, else the display type's default). Only used
                  while the slot supports interactive targeting. There is no
                  display-type default for it. Set from Advertisers /
                  Inventory, not the slot editor.
              maxCampaigns:
                type: [integer, 'null']
                description: |
                  This slot's own override of the display type's maximum
                  campaigns (spec §1 configuration inheritance — override
                  always wins). Absent or null means it has none and
                  follows the display type's own `maxCampaigns` (below),
                  else the platform default of 5. 1-10 inclusive when set.
                  A purely-submission cap: the single authority on how many
                  campaigns (default + targeted versions) an advertiser may
                  submit for this slot, replacing the former blanket
                  20-targeted-versions cap for it — does not feed the
                  auction or billing. Set from Advertisers / Inventory, not
                  the slot editor.
        reservePrice:
          type: [number, 'null']
          description: |
            The display type's own reserve price default (decision, 22 Sep),
            inherited by every slot on it that has no override of its own.
            Absent or null means the display type has no default, so an
            un-overridden slot has no reserve either. Set from Advertisers /
            Inventory (every row for this display type edits the same
            value), not the slot editor.
        billingUnitHours:
          type: [number, 'null']
          description: |
            The display type's own billing-unit default (spec "Private
            auctions: two-period model", 23 Sep 2026), inherited by every
            slot on it with no override of its own. Absent or null means
            the company-wide play window (playWindowHours) applies. Set from
            Advertisers / Inventory (every row for this display type edits
            the same value), not the slot editor.
        maxCampaigns:
          type: [integer, 'null']
          description: |
            The display type's own maximum-campaigns default, inherited by
            every slot on it with no override of its own. Absent or null
            means the platform default of 5 applies. 1-10 inclusive when
            set. Set from Advertisers / Inventory (every row for this
            display type edits the same value), not the slot editor.
        venue:
          type: object
          description: POC stand-in; PH Core owns venue and geo metadata and the exchange keeps no copy on integration (Q35). On integration this is read from PH Core's store/display record and the extensions PUT stops accepting it.
          properties:
            openOohVenueType: {type: string}
            orientation: {type: string, enum: [landscape, portrait]}
            loopLengthSec: {type: number}
    DeleteCheck:
      type: object
      required: [canDelete, dependents]
      properties:
        canDelete: {type: boolean}
        dependents:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind: {type: string, enum: [display, display_type_default, zone, reservation], description: 'reservation: a position reserved or sold for a current or future window (Q47); name is the position id, detail the window and whether it is sold or reserved.'}
              name: {type: string}
              detail: {type: string, description: e.g. store name or zone name}

    DisplayType:
      type: object
      description: POC stand-in for the existing display type record (spec §8), including phExtensions.
      required: [id, name, touchPoint, displayCanvasSize, playlistSettings]
      properties:
        id: {type: string}
        name: {type: string}
        touchPoint: {type: string}
        description: {type: [string, 'null']}
        displayCanvasSize:
          type: object
          required: [width, height]
          properties: {width: {type: integer}, height: {type: integer}}
        backgroundColor: {type: string}
        defaultPlaylistId: {type: string}
        playlistSettings: {type: object, additionalProperties: true, description: 'Maximum Campaigns Played In Rotation only, as of 26 Sep 2026 — the slot count and slot assignment (phExtensions) size and sell that specific display type''s screen, so they stay here even though the other playlist settings moved to the Playlist record. null means inherit.'}
        qrControl: {type: object, additionalProperties: true}
        enabledFeatures: {type: object, additionalProperties: true}
        multiZone: {type: object, additionalProperties: true}
        phExtensions: {$ref: '#/components/schemas/DisplayTypeExtensions'}
    Playlist:
      type: object
      required: [id, name, assignments]
      properties:
        id: {type: string}
        name: {type: string}
        autoCreatedFor: {type: [string, 'null'], description: Display type id if auto-created}
        playlistSettings: {type: object, additionalProperties: true, description: 'Asset Position, Asset Fill, Campaign Transition, Auto-Rotation and Auto-Play (26 Sep 2026: moved off the display type so a playlist''s own settings can be edited from Playlist Management whether or not it is currently assigned to a display type). null values mean inherit. Maximum Campaigns Played In Rotation and slot assignment stay on the assigned display type(s) — see DisplayType.playlistSettings.'}
        assignments:
          type: array
          items:
            type: object
            required: [displayTypeId, displayTypeName]
            properties:
              displayTypeId: {type: string}
              displayTypeName: {type: string}
              zoneId: {type: [string, 'null']}
              zoneName: {type: [string, 'null']}
    Campaign:
      type: object
      description: POC stand-in for the existing campaign record (spec §8 additions included). Approval state is read from /admin/v1/approvals.
      required: [campaignId, name, source, schedule, activation, campaignCount, localisedVariables, localisedRuleLines, personalisedVariables, personalisedRuleLines]
      properties:
        campaignId: {type: string}
        name: {type: string}
        source: {type: string, enum: [hq, api, dsp]}
        advertiserId: {type: [string, 'null']}
        advertiserName: {type: [string, 'null']}
        partnerId: {type: [string, 'null']}
        partnerName: {type: [string, 'null']}
        displayTypeId: {type: [string, 'null']}
        pricingType: {type: [string, 'null'], enum: [default, localised, personalised, interactive, null]}
        brief: {$ref: '#/components/schemas/CampaignBrief'}
        schedule:
          type: object
          description: What the advertiser booked, so the table can show what is up next.
          required: [nextWindowStart, bookedWindows]
          properties:
            nextWindowStart: {type: [string, 'null'], format: date-time, description: The next play window this campaign holds, or null when none is ahead.}
            bookedWindows: {type: integer, description: Live windows won or reserved, past and future.}
        activation:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean}
        campaignCount: {type: integer, description: 'This playlist''s layers (spec §6): the mandatory default plus each targeted (localised/personalised) upsell version submitted for this slot. Checked against the slot''s own Max campaigns cap at submission time, not recomputed here.'}
        localisedVariables: {type: array, items: {type: string}, description: 'High-level summary for the Campaign Status table''s Localised variables column: the deduped, catalog-ordered display names of variables targeted by this playlist''s localised layer(s). Empty when none.'}
        localisedRuleLines: {type: array, items: {type: string}, description: 'The exact targeting rules behind localisedVariables — one human-readable line per localised layer (variable, operator and values), for that column''s hover tooltip.'}
        personalisedVariables: {type: array, items: {type: string}, description: Same as localisedVariables, for this playlist's personalised layer(s).}
        personalisedRuleLines: {type: array, items: {type: string}, description: Same as localisedRuleLines, for this playlist's personalised layer(s).}
    SellersJson:
      type: object
      required: [version, sellers]
      properties:
        contact_email: {type: string}
        version: {type: string, const: '1.0'}
        sellers:
          type: array
          items:
            type: object
            required: [seller_id, seller_type, name, domain]
            properties:
              seller_id: {type: string}
              seller_type: {type: string, const: PUBLISHER}
              name: {type: string}
              domain: {type: string}
              is_confidential: {type: integer, const: 0}

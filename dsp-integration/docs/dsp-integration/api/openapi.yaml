openapi: 3.1.0
info:
  title: Personalisation Hub — Display Types & DSP Integration API
  version: 1.0.0-draft
  description: |
    The agreed contract for every API added by the Display Types & DSP
    Integration build. Implement exactly these endpoints, fields and error
    codes; do not add endpoints, fields or behaviour that are not here.
    Changes to this file are made in the same commit as the code change.

    Two surfaces:
      * Partner API (/v1)       — DSPs and direct advertisers (tier 2).
      * Admin API (/admin/v1)   — behind HQ Admin screens.
    Plus the public sellers.json. The OpenRTB bid request/response contract
    is documented in API.md (it is sent by us, not served).

    Out of scope (existing Personalisation Hub functionality, no endpoints
    here): playback, playlists' playback behaviour, targeting evaluation,
    distribution to players, playback logging, campaign playback analytics.

    The retailer's DSP integration switch (Exchange settings; Rob, 24 Sep
    2026): while it is off, the Partner API and sellers.json answer 404,
    exactly as with the build flag off, and no auction sends bid requests.
    The Admin API keeps answering, and nothing is deleted.

    Jobs with no endpoint: the SSP auction runs as a scheduled job
    (CLI for demos: npm run auction:run); billing line items are stored
    only (CLI to print them: npm run billing:print). Neither has a UI,
    report or API.
servers:
  - url: https://{instance}/api
    variables:
      instance:
        default: hub.example-retailer.com
        description: The retailer's own Personalisation Hub instance (in its VPC).
tags:
  - name: Partner — Inventory
  - name: Partner — Targeting
  - name: Partner — Campaigns
  - name: Partner — Reservations
  - name: Player — Real-time impressions
    description: |
      Called by PH Core's PWA player, not by partners (7 Oct 2026). The
      player signals an impression is about to play in a real-time position
      and plays the creative the exchange fills it with. See
      PH-CORE-BOUNDARIES.md "Real-time bidding".
  - name: Admin — Exchange
  - name: Admin — Advertiser settings
  - name: Admin — Shared targeting variables
  - name: Admin — DSPs
  - name: Admin — Advertisers
  - name: Admin — Campaign approval
  - name: Admin — Display types and playlists
  - name: POC stand-in — existing platform
    description: |
      POC only. These stand in for existing Personalisation Hub APIs that this
      repo can't reach. Engineering replaces them with the existing APIs on
      integration; nothing else may depend on their internals.
  - name: Public
  - name: Operations
    description: |
      For whatever supervises the process — Kubernetes probes, a load
      balancer's health check (deploy/kubernetes/). Served at the root like
      sellers.json, no authentication, no partner or admin data. Not for
      partners.

security:
  - partnerToken: []

paths:
  # ------------------------------------------------------------------ Partner
  /v1/inventory:
    get:
      tags: [Partner — Inventory]
      operationId: listInventory
      summary: Sellable positions this partner/advertiser could buy
      description: |
        Only advertiser-owned slots. Positions the caller can't buy (blacklisted,
        excluded by whitelist-only, or reserved to another advertiser) are omitted,
        never returned as errors.
      parameters:
        - {name: advertiserId, in: query, schema: {type: string}, description: Scope to one of the partner's advertisers (applies their lists and floor multiplier).}
        - {name: displayTypeId, in: query, schema: {type: string}}
        - {name: touchPoint, in: query, schema: {type: string, enum: [Digital Signage, Kiosk]}}
        - {name: storeIds, in: query, schema: {type: array, items: {type: string}}, style: form, explode: false, description: Personalisation Hub store IDs (stores are managed by the platform).}
        - {name: region, in: query, schema: {type: string}, description: A store region from the platform's store records.}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/WindowStatus'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Position'}}
                  nextCursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/inventory/{positionId}:
    get:
      tags: [Partner — Inventory]
      operationId: getPosition
      summary: One position in full
      parameters:
        - $ref: '#/components/parameters/PositionId'
        - {name: advertiserId, in: query, schema: {type: string}}
      responses:
        '200': {description: Position, content: {application/json: {schema: {$ref: '#/components/schemas/Position'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/inventory/{positionId}/availability:
    get:
      tags: [Partner — Inventory]
      operationId: getAvailability
      summary: Status per play window across a date range
      parameters:
        - $ref: '#/components/parameters/PositionId'
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: advertiserId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema:
                type: object
                required: [positionId, windows]
                properties:
                  positionId: {type: string}
                  windows: {type: array, items: {$ref: '#/components/schemas/PlayWindow'}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/inventory/forecast:
    post:
      tags: [Partner — Inventory]
      operationId: forecast
      summary: Projected assumed views for a position set and targeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionIds, from, to]
              properties:
                positionIds: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {type: string}, description: 'At most 200 positions per request, each once.'}
                from: {type: string, format: date}
                to: {type: string, format: date}
                advertiserId: {type: string}
                rules: {$ref: '#/components/schemas/TargetingRules'}
      responses:
        '200':
          description: Forecast
          content:
            application/json:
              schema:
                type: object
                required: [assumedViews, currency, estimatedCost]
                properties:
                  assumedViews: {type: integer, description: Projected VAC-d assumed views across the positions and dates.}
                  currency: {type: string, description: ISO 4217}
                  estimatedCost: {type: number, description: assumedViews / 1000 × effective floor CPM.}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '422': {$ref: '#/components/responses/VariableNotPermitted'}

  /v1/targeting/attributes:
    get:
      tags: [Partner — Targeting]
      operationId: listTargetingAttributes
      summary: The shared targeting variables this partner may use
      description: Only variables enabled for the calling DSP. Values are never returned.
      responses:
        '200':
          description: Variables
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/TargetingAttribute'}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /v1/campaigns:
    post:
      tags: [Partner — Campaigns]
      operationId: createCampaign
      summary: Create a campaign (content package) — a mandatory default layer plus optional targeted versions
      description: |
        Targeting rules are validated against the variables permitted for the
        calling DSP and stored in the existing campaign targeting structure.
        Evaluation and playback are the existing platform's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignStatus'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '422': {$ref: '#/components/responses/VariableNotPermitted'}
  /v1/campaigns/{campaignId}/assets:
    post:
      tags: [Partner — Campaigns]
      operationId: uploadAsset
      summary: Upload creative for the default layer or a targeted version; runs automated checks
      description: |
        On a submitted campaign a new file is a new version. On an approved
        campaign it is a pending edit, Awaiting approval, while the approved
        version keeps running (open question 38) — unless every asset and the
        targeting rules are byte-identical to what a reviewer already approved,
        in which case it is approved without another review (safe reuse,
        open question 40).

        **Dimensions are checked by shape, not pixels.** `aspect_ratio` passes
        when the asset's width÷height is within ±5% of the target's;
        `dimensions` passes when the asset is at least 50% of the target in
        each dimension (1920×1080 → floor 960×540). Larger assets of the right
        shape are accepted. On a zoned display type the target is a zone's own
        size, not the full canvas. Images and videos alike; each failure names
        its own reason in `checks_failed`.
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                version: {type: string, description: '"default" or the targeted version id'}
                file: {type: string, format: binary, description: 'Per-asset limit, checked by `file_size`: 100 MB for an image, 200 MB for a video.'}
      responses:
        '201':
          description: Uploaded and checked
          content:
            application/json:
              schema:
                type: object
                required: [assetId, checks]
                properties:
                  assetId: {type: string}
                  checks: {type: array, items: {$ref: '#/components/schemas/Check'}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ChecksFailed'}
  /v1/campaigns/{campaignId}/submit:
    post:
      tags: [Partner — Campaigns]
      operationId: submitCampaign
      summary: Submit for retailer approval (or auto-approve if the advertiser doesn't require it)
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      responses:
        '200': {description: Submitted, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ChecksFailed'}
  /v1/campaigns/{campaignId}:
    get:
      tags: [Partner — Campaigns]
      operationId: getCampaign
      summary: Read back the stored campaign — default and targeted versions, priorities and rules
      description: |
        Returns what the exchange stored from the package (the same shape
        `POST /v1/campaigns` accepted, rules and priorities unchanged) plus
        the approval status fields of `GET …/status`.
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      responses:
        '200': {description: Campaign, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/campaigns/{campaignId}/status:
    get:
      tags: [Partner — Campaigns]
      operationId: getCampaignStatus
      summary: Approval status and rejection reason
      description: |
        `liveAssetVersion` is the approved version that runs; `pendingEdit` is
        true while an edit to it awaits approval (`status` awaiting_approval,
        `assetVersion` the edit). A rejected edit is discarded — `status` is
        back to the live version's — and `rejectedEdit` carries its reason.
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      responses:
        '200': {description: Status, content: {application/json: {schema: {$ref: '#/components/schemas/CampaignStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/reservations:
    post:
      tags: [Partner — Reservations]
      operationId: createReservation
      summary: Reserve (at a reserve price, or for a named advertiser) or bid (CPM) for a play window
      description: |
        Approved and activated campaigns only. Pre-auction checks apply
        (floor, lists, categories, approval, activation). A bid is taken
        while the window's auction is open: from auctionOpensHours before
        the auction cutoff until the cutoff (Advertiser settings → Auction
        schedule). A reservation can be made any time before the cutoff.

        Reserve-price booking (programmatic guaranteed; open questions 45 and
        52, decided by Rob on 29 Sep 2026): `type: reserve` on a position with
        a reservePrice commits the buyer to the window at that price. The
        window is held as Reserved (status `reserved`) and is not auctioned.
        It is booked and billed at the reserve price on the window's
        realised VAC-d, with no guaranteed volume and no make-good. On a
        private auction with auctionCloses set, the commitment also locks
        the deal's term at the reserve price (BuyersList.lockedWin, source
        `reserve`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationCreate'}
      responses:
        '201': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/NotEligible'}
  /player/v1/impressions:
    post:
      tags: [Player — Real-time impressions]
      operationId: signalImpression
      summary: Impression available — ask the exchange to fill a real-time position just before playout
      security: [{playerToken: []}]
      description: |
        The impression-available signal. The exchange sends one OpenRTB
        request per eligible connected DSP (same request as the advance
        auction, `imp.ext.ph.mode` = `realtime`, `tmax` cut to the
        real-time budget), clears the bids first price, and answers within
        that budget. The answer is always 200: `filled` with the creative
        to play, or `no_fill` (no bid cleared in time, nothing approved and
        fitting, DSP integration off, position locked…) — on `no_fill` the
        player plays its own content. No creative is retrieved inside tmax.
        A creative PH has approved (or is still reviewing) is served from
        PH's own copy; a creative PH has not seen yet is served at bid time
        from the DSP's own creative URL (`creative.source` = `at_bid`) and
        reviewed after the play, when the player reports it. A creative a
        reviewer rejected does not play, and its content is blocked by hash.
        Only a position whose slot is in `realtime` mode can be filled this
        way; an advance position answers 409.

        **Bandwidth protection.** When the retailer has restricted uncached
        creatives (Advertiser settings -> `uncachedRestriction`) and the
        restriction is in force, only a bid whose creative the player
        already holds can win: the player lists those in `cachedCrids`.
        An uncached bid is passed over and the next-best cached bid wins;
        with none, the answer is `no_fill`. Cached creatives bid, win and
        play as normal throughout, so peak trade is not blacked out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImpressionSignal'}
      responses:
        '200': {description: Fill or no fill, content: {application/json: {schema: {$ref: '#/components/schemas/ImpressionFill'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /player/v1/impressions/{impressionId}/played:
    post:
      tags: [Player — Real-time impressions]
      operationId: confirmImpressionPlayed
      summary: Proof of play for a filled impression
      security: [{playerToken: []}]
      description: |
        Reported once, within the fill's `expiresAt`. Records the play
        against the display and the winning campaign; reporting it twice, or
        for a fill that has expired or was never filled, answers 409.
      parameters: [{name: impressionId, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playedAt: {type: string, format: date-time, description: When playout started; defaults to now.}
                durationSec: {type: number, description: Seconds played; defaults to the slot's duration.}
      responses:
        '200': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ImpressionFill'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/reservations/{reservationId}:
    get:
      tags: [Partner — Reservations]
      operationId: getReservation
      summary: One reservation or bid, with its outcome
      parameters: [{name: reservationId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Reservation, content: {application/json: {schema: {$ref: '#/components/schemas/Reservation'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Admin
  /admin/v1/exchange:
    get:
      tags: [Admin — Exchange]
      operationId: getExchange
      security: [{adminSession: []}]
      responses:
        '200': {description: Exchange settings, content: {application/json: {schema: {$ref: '#/components/schemas/Exchange'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
    put:
      tags: [Admin — Exchange]
      operationId: saveExchange
      summary: Save changes (whole page)
      security: [{adminSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExchangeInput'}}}
      responses:
        '200': {description: Saved; sellers.json republished when switched on and complete, content: {application/json: {schema: {$ref: '#/components/schemas/Exchange'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/v1/features:
    get:
      tags: [Admin — Exchange]
      operationId: getFeatures
      summary: Whether the retailer has DSP integration switched on
      description: |
        Readable by every user who sees these sections (admin and
        marketing), unlike Exchange settings, so the navigation can hide
        Campaign Status and Advertisers / Inventory while the switch is off.
        Always false with the build flag off.
      security: [{adminSession: []}]
      responses:
        '200': {description: Features, content: {application/json: {schema: {$ref: '#/components/schemas/Features'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/v1/test/plays:
    post:
      tags: [POC stand-in — existing platform]
      operationId: reportTestPlays
      summary: Test only — report plays for a cleared reservation's window
      description: |
        **Not part of the product.** Served only while the instance runs with
        test endpoints on (any `NODE_ENV` other than `production`; in
        production the route is not registered and answers 404). It exists so
        the Run 6 journey runner can finish billing inside one run: it moves
        `PH_TEST_CLOCK` past the window end, reports plays here, ticks the
        scheduler and reads the line item. It writes to the POC stand-in
        `plays` table, which is PH Core's playback store on integration (the
        platform reports plays itself), and is deleted with it. Plays are
        spread round-robin over the display type's displays and evenly
        through the window; each entry is one tier. Every play carries the
        campaign version it showed (`versionId`, interface contract v3.1 row
        3): by default the version handed off on the booking for this window,
        so a play's versionId equals the booking's asset version.
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservationId, plays]
              properties:
                reservationId: {type: string, description: A won or reserved reservation that carries a campaign.}
                plays:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [tier, count]
                    properties:
                      tier: {type: [string, 'null'], enum: [default, localised, personalised, null], description: The version tier the play showed; null bills as default.}
                      count: {type: integer, minimum: 1, maximum: 100000}
                      durationSec: {type: number, exclusiveMinimum: 0}
                      versionId: {type: [string, 'null'], maxLength: 200, description: "The campaign version the play showed. Omitted: the asset version on the window's booking (null when there is no booking)."}
      responses:
        '201':
          description: Plays written.
          content:
            application/json:
              schema:
                type: object
                required: [reservationId, campaignId, positionId, windowStart, windowEnd, displays, written, total]
                properties:
                  reservationId: {type: string}
                  campaignId: {type: string}
                  positionId: {type: string}
                  windowStart: {type: string, format: date-time}
                  windowEnd: {type: string, format: date-time}
                  displays: {type: integer}
                  written:
                    type: array
                    items:
                      type: object
                      required: [tier, count, versionId]
                      properties:
                        tier: {type: [string, 'null']}
                        count: {type: integer}
                        versionId: {type: [string, 'null']}
                  total: {type: integer}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/v1/advertiser-settings:
    get:
      tags: [Admin — Advertiser settings]
      operationId: getAdvertiserSettings
      security: [{adminSession: []}]
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/AdvertiserSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
    put:
      tags: [Admin — Advertiser settings]
      operationId: saveAdvertiserSettings
      summary: Save changes — pricing and list management
      security: [{adminSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdvertiserSettingsInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/AdvertiserSettings'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/v1/available-inventory:
    get:
      tags: [Admin — Advertiser settings]
      operationId: listAvailableInventory
      summary: Advertiser-owned slots (no advertisers column)
      security: [{adminSession: []}]
      responses:
        '200':
          description: Rows, and the DSPs (with their advertisers) a position can be assigned to
          content:
            application/json:
              schema:
                type: object
                required: [items, dsps]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AvailableInventoryRow'}}
                  dsps: {type: array, items: {$ref: '#/components/schemas/DspAdvertisers'}}
        '401': {$ref: '#/components/responses/Unauthorised'}
    put:
      tags: [Admin — Advertiser settings]
      operationId: saveAvailableInventory
      summary: Save changes — who a slot is assigned to, what targeting it supports, its reserve price and its max campaigns
      description: |
        The editable fields of a sellable slot. Everything else about it —
        its label and owner — is set on its display type. Admin only:
        marketing users read this table.

        assignedTo: pick DSPs to say who may bid, advertisers to hold the
        position for them (their DSPs are added automatically), or
        whitelistOnly for the advertiser whitelist. Nothing chosen means any
        connected DSP. Advertisers and whitelistOnly are mutually exclusive.

        Sold slots can't lose their advertiser (ticket "Lock playlist slot
        against new sales when slots are sold", 30 Sep 2026). Removing an
        advertiser from a slot (or replacing it with DSPs, a buyers list or
        the whitelist) while that slot has a live booking — reserved or
        sold for a window that has not finished playing, Test mode
        excluded — is refused with `409 has_dependents`; each detail's
        `field` is `items[n].assignedTo.advertisers` for the offending row.
        The slot keeps its advertiser and its bookings run as they are. The
        admin can then lock the slot against new sales (`PUT
        /admin/v1/available-inventory/lock`); once the booking schedule has
        no live booking left on it the lock releases by itself and the
        advertiser can be removed.

        reservePrice: a CPM premium at which this slot can be reserved in
        advance of the open auction (decision, 22 Sep). Real inheritance
        (spec §1 configuration inheritance), not a copy action: a display
        type carries its own reserve price default (reservePriceDefault,
        below), and a slot's own reservePrice is null until explicitly
        overridden, in which case it always wins. Clear a slot's override
        back to null to return it to following the display type's default.
        Published — resolved, override-or-default — on the position in
        `GET /v1/inventory` and `/v1/inventory/{positionId}`. It is the
        rate of a reserve-price booking (`POST /v1/reservations`,
        `type: reserve`; open questions 45 and 52, decided by Rob on 29 Sep
        2026).

        reservePriceDefault: the display type's own reserve price default
        that a slot with no override inherits; null means no default is
        set. Sent once per slot row for simplicity (omission is not
        supported, same as reservePrice), but it describes the display
        type, not the slot — every row sharing a displayTypeId must submit
        the same value in one request.

        billingUnitHours / billingUnitHoursDefault: the same override/
        default pattern as reservePrice/reservePriceDefault, for the
        granularity a CPM is quoted and charged against (spec "Private
        auctions: two-period model", 23 Sep 2026). Since OQ27 (29 Sep 2026)
        it is the slot's play-window length — the windows it is auctioned,
        booked and billed against; when neither is set the slot inherits
        the company-wide `playWindowHours` (platform default 24). Whole
        hours, 1-8760. A change that would alter the resolved length of a
        slot with windows still bid on or booked (live, not yet played) is
        refused (`validation_failed`, naming the slot and when its last
        such window ends) — the slot's other changes, and every other
        slot's, must be resubmitted without it.

        maxCampaigns / maxCampaignsDefault: the same override/default
        pattern again, for the maximum number of campaigns (default +
        targeted versions) this advertiser may submit for the slot — 5
        when neither is set, 1-10 inclusive otherwise. Purely a submission
        cap; replaces the former blanket 20-targeted-versions cap for this
        slot. Does not feed the auction or billing.
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [displayTypeId, slot, assignedTo]
                    properties:
                      displayTypeId: {type: string}
                      slot: {type: integer, minimum: 1}
                      assignedTo:
                        type: object
                        required: [partnerIds, advertisers, whitelistOnly]
                        properties:
                          partnerIds: {type: array, items: {type: string}}
                          advertisers: {type: array, items: {type: string}}
                          whitelistOnly: {type: boolean}
                      reservePrice:
                        type: [number, 'null']
                        minimum: 0
                        description: This slot's own override; null = inherit reservePriceDefault. Omitted = unchanged is not supported — always send the slot's current value.
                      reservePriceDefault:
                        type: [number, 'null']
                        minimum: 0
                        description: The display type's reserve price default; null = none. Must be the same value on every row for a given displayTypeId in one request.
                      billingUnitHours:
                        type: [integer, 'null']
                        minimum: 1
                        maximum: 8760
                        description: This slot's own billing-unit override (its play-window length), in whole hours; null = inherit billingUnitHoursDefault. Omitted = unchanged is not supported — always send the slot's current value.
                      billingUnitHoursDefault:
                        type: [integer, 'null']
                        minimum: 1
                        maximum: 8760
                        description: The display type's billing-unit default, in whole hours; null = none (the company-wide playWindowHours applies). Must be the same value on every row for a given displayTypeId in one request.
                      interactiveReservePrice:
                        type: [number, 'null']
                        minimum: 0
                        description: This slot's own reserve price (CPM) for interactive campaigns only; null = interactive campaigns follow the slot's ordinary reserve price. Only meaningful while interactive campaigns are enabled. Omitted = unchanged is not supported — always send the slot's current value.
                      maxCampaigns:
                        type: [integer, 'null']
                        minimum: 1
                        maximum: 10
                        description: This slot's own maximum-campaigns override; null = inherit maxCampaignsDefault. Omitted = unchanged is not supported — always send the slot's current value.
                      maxCampaignsDefault:
                        type: [integer, 'null']
                        minimum: 1
                        maximum: 10
                        description: The display type's maximum-campaigns default; null = none (the platform default of 5 applies). Must be the same value on every row for a given displayTypeId in one request.
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [items, dsps]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AvailableInventoryRow'}}
                  dsps: {type: array, items: {$ref: '#/components/schemas/DspAdvertisers'}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/HasDependents'}
  /admin/v1/available-inventory/lock:
    put:
      tags: [Admin — Advertiser settings]
      operationId: lockInventorySlot
      summary: Lock a sold slot against new sales
      description: |
        Slot-level, per playlist, as in the Available Inventory table (ticket
        "Lock playlist slot against new sales when slots are sold", 30 Sep
        2026). A locked slot takes no new bid, reservation or auction win for
        any window it has not already sold: its status reads `unavailable`
        for those windows, the exchange skips it, and the Partner API
        refuses a bid or reservation on it (`409 conflict`). Existing
        bookings are not deleted, reassigned or cancelled and play out as
        booked, including the remaining windows of a locked-rate term.

        Only a slot with a live booking (reserved or sold for a window that
        has not finished playing, Test mode excluded) can be locked; any
        other slot answers `409 conflict`, since there is nothing to
        protect. Locking a locked slot is a no-op.

        There is no unlock. The lock releases automatically, on the
        exchange's schedule tick and whenever Available Inventory is read
        or saved, as soon as the booking schedule shows no live booking on
        the slot. The release depends on bookings only — never on campaign
        playback or delivery analytics. Admin only.
      security: [{adminSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayTypeId, slot]
              properties:
                displayTypeId: {type: string}
                slot: {type: integer, minimum: 1, description: The flat 1-based slot number (AvailableInventoryRow.slot), not the per-zone one.}
      responses:
        '200':
          description: Locked (or already locked)
          content:
            application/json:
              schema:
                type: object
                required: [items, dsps]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AvailableInventoryRow'}}
                  dsps: {type: array, items: {$ref: '#/components/schemas/DspAdvertisers'}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/v1/reports/lost-revenue:
    get:
      tags: [Admin — Advertiser settings]
      operationId: getLostRevenueReport
      summary: Lost revenue from display downtime, by store, display or day
      description: |
        Settlement is final (spec §4 "Billing"): a play the platform received
        after its window's line item was written is never billed, and is
        recorded at what it would have been worth at the window's cleared CPM
        (no personalised uplift: every play is valued at the cleared CPM). This reports those plays, placed
        by when they played. An operational report for the retailer; never
        shown on or charged to an advertiser's invoice.
      security: [{adminSession: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}, description: 'Inclusive; at most 366 days after from.'}
        - {name: by, in: query, schema: {type: string, enum: [store, display, day], default: store}}
        - {name: storeId, in: query, schema: {type: string}}
        - {name: displayId, in: query, schema: {type: string}}
      responses:
        '200':
          description: Lost revenue, per currency (never summed across currencies)
          content:
            application/json:
              schema:
                type: object
                required: [from, to, by, totals, rows]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  by: {type: string, enum: [store, display, day]}
                  totals:
                    type: array
                    items: {type: object, required: [currency, plays, lostSec, lostViews, lostAmount], properties: {currency: {type: string}, plays: {type: integer}, lostSec: {type: number}, lostViews: {type: number}, lostAmount: {type: number}}}
                  rows:
                    type: array
                    items: {type: object, required: [key, label, storeId, currency, plays, lostSec, lostViews, lostAmount], properties: {key: {type: string}, label: {type: string}, storeId: {type: [string, 'null']}, currency: {type: string}, plays: {type: integer}, lostSec: {type: number}, lostViews: {type: number}, lostAmount: {type: number}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
  /admin/v1/booking-schedule:
    get:
      tags: [Admin — Advertiser settings]
      operationId: getBookingSchedule
      summary: Every advertiser-owned slot across its play windows, with bookings and booking revenue
      description: |
        Reached from Available Inventory. Per position and play window: booked
        (reserved or won, live only, at the CPM it was booked at), available
        (bidding not yet closed) or unavailable. Plus booking revenue per
        display type: booked (CPM × assumed views ÷ 1000) and billed (billing
        line items, once the window has played). Test-mode wins are never
        counted. Without dates: the current window and the 13 after it.
      security: [{adminSession: []}]
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}, description: 'At most 92 days after from.'}
        - {name: campaignId, in: query, schema: {type: string}, description: 'Only this campaign''s bookings; without dates, the range covers all of them.'}
        - {name: advertiserId, in: query, schema: {type: string}, description: Only this advertiser's bookings.}
        - {name: partnerId, in: query, schema: {type: string}, description: Only this DSP's bookings.}
      responses:
        '200': {description: Schedule, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSchedule'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}


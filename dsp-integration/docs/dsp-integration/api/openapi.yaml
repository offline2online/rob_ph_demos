  /admin/v1/campaigns/{campaignId}/approval:
    get:
      tags: [Admin — Campaign approval]
      operationId: getApproval
      summary: Approval state, check results and audit trail (review panel)
      security: [{adminSession: []}]
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      responses:
        '200': {description: Approval, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/campaigns/{campaignId}/approve:
    post:
      tags: [Admin — Campaign approval]
      operationId: approveCampaign
      security: [{adminSession: [approver]}]
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetVersion]
              properties:
                assetVersion: {type: string, description: The version reviewed; rejected with 409 if it has changed.}
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/v1/campaigns/{campaignId}/reject:
    post:
      tags: [Admin — Campaign approval]
      operationId: rejectCampaign
      description: |
        Rejecting a pending edit to a running campaign (open question 38)
        discards the edit: the response is the campaign at its live, still
        approved version, with `rejectedEdit` set. The rejection stays in the
        audit trail (`rejected`, then `edit_discarded`).
      security: [{adminSession: [approver]}]
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetVersion, reason]
              properties:
                assetVersion: {type: string}
                reason: {type: string, minLength: 1}
                assetReasons: {type: array, items: {$ref: '#/components/schemas/AssetRejection'}, description: 'Optional — names specific assets the overall reason covers (spec §3, "asset-level rejection").'}
      responses:
        '200': {description: Rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/v1/campaigns/{campaignId}/unreject:
    post:
      tags: [Admin — Campaign approval]
      operationId: unrejectCampaign
      summary: Undo a mistaken rejection — Rejected → Awaiting approval. Never auto-approves.
      security: [{adminSession: [approver]}]
      parameters: [{$ref: '#/components/parameters/CampaignId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetVersion]
              properties:
                assetVersion: {type: string, description: The rejected version; rejected with 409 if it has changed.}
                reason: {type: string, description: Optional — why the rejection is being reversed. Recorded in the audit trail alongside the original rejection reason, which is kept.}
      responses:
        '200': {description: Back to Awaiting approval, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/v1/display-types/{displayTypeId}/extensions:
    put:
      tags: [Admin — Display types and playlists]
      operationId: saveDisplayTypeExtensions
      summary: Save slot ownership and venue metadata (phExtensions only)
      description: Existing display type fields keep using the existing display type API.
      security: [{adminSession: []}]
      parameters: [{name: displayTypeId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DisplayTypeExtensions'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/DisplayTypeExtensions'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/display-types/{displayTypeId}/default-vacd:
    put:
      tags: [Admin — Display types and playlists]
      operationId: setDisplayTypeDefaultVacd
      summary: PH Core writes the display type's default VAC-d (computer vision score)
      description: |
        The write path for computer-vision dynamic scoring (ticket
        MuZ4KUSLJI2BIGbEV2pq, 4 Oct 2026). PH Core writes the score CV
        measured at the edge as the display type's default VAC-d
        (`phExtensions.defaultVacd`); it appears on the Display Type form
        and scores that type's slots.

        **Precedence (decided by Rob, 4 Oct 2026): the automated score
        wins.** A write here replaces any manually set value and is marked
        `defaultVacdSource: computer_vision`, which makes slots scored from
        it **counted** (OpenRTB `qty.sourcetype` 1). A manual edit through
        `PUT …/extensions` still saves, is marked `manual` (modelled), and
        stays until the next write here. It targets the display-type
        default only — never a display's counted VAC-d or its
        `vacd_override`, which stay with PH Core's scoring framework.
      security: [{adminSession: []}]
      parameters: [{name: displayTypeId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultVacd]
              properties:
                defaultVacd: {type: integer, minimum: 0, description: Assumed views per play window, per display.}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/DisplayTypeExtensions'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/display-types/{displayTypeId}/delete-check:
    get:
      tags: [Admin — Display types and playlists]
      operationId: checkDisplayTypeDelete
      summary: Can this display type be deleted? Lists assigned displays if not.
      security: [{adminSession: []}]
      parameters: [{name: displayTypeId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteCheck'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/display-types/{displayTypeId}:
    delete:
      tags: [Admin — Display types and playlists]
      operationId: deleteDisplayType
      summary: Delete; 409 with the assigned displays if any remain
      security: [{adminSession: []}]
      parameters: [{name: displayTypeId, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/HasDependents'}
  /admin/v1/playlists/{playlistId}/settings:
    put:
      tags: [Admin — Display types and playlists]
      operationId: savePlaylistSettings
      summary: Save this playlist's own settings (Asset Position/Fill, Campaign Transition, Auto-Rotation, Auto-Play)
      description: Edited from an expandable row on Playlist Management (26 Sep 2026), whether or not the playlist is currently assigned to a display type. Maximum Campaigns Played In Rotation and slot assignment are edited per assignment, through the display type's own /extensions endpoint.
      security: [{adminSession: []}]
      parameters: [{name: playlistId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Playlist'}}}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/HasDependents'}
  /admin/v1/playlists/{playlistId}/delete-check:
    get:
      tags: [Admin — Display types and playlists]
      operationId: checkPlaylistDelete
      summary: Can this playlist be deleted? Lists display type / zone assignments if not.
      security: [{adminSession: []}]
      parameters: [{name: playlistId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/DeleteCheck'}}}}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/playlists/{playlistId}:
    delete:
      tags: [Admin — Display types and playlists]
      operationId: deletePlaylist
      summary: Delete; 409 with the assignments if it is a default or zone playlist
      security: [{adminSession: []}]
      parameters: [{name: playlistId, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorised'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/HasDependents'}

  # ------------------------------------------------------ POC stand-ins (existing platform)

# EXAMPLE ONLY — never commit a real one. In the client's cluster this
# Secret is produced by External Secrets Operator from AWS Secrets Manager
# (or sealed/SOPS), so no key or token is ever in git or in a kubectl
# history. The Deployment reads it as env vars.
apiVersion: v1
kind: Secret
metadata:
  name: dsp-exchange-api
  namespace: dsp-exchange
type: Opaque
stringData:
  # 32 bytes, base64: AES-256-GCM key for DSP credentials at rest.
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  PH_SECRETS_KEY: REPLACE_ME
  # Partner API bearer tokens, JSON token → partner id. With
  # NODE_ENV=production the API refuses to start with the public POC tokens.
  #   node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
  PARTNER_TOKENS: '{"REPLACE_WITH_A_LONG_RANDOM_TOKEN":"p_google","REPLACE_WITH_ANOTHER":"p_amazon"}'
  # The bearer PH Core's player presents to the Player API (/api/player/v1,
  # real-time bidding). Unset in production, every Player API call is 401, so
  # nothing sells in real time. One shared token for every player is the
  # POC's model; see docs/dsp-integration/api/HANDOVER-REVIEW.md.
  #   node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
  PH_PLAYER_TOKEN: REPLACE_ME

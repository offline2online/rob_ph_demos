apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsp-exchange-api
  namespace: dsp-exchange
  # With IRSA, the role that lets the pod read its secrets from AWS Secrets
  # Manager (through External Secrets) or use KMS goes here; the API itself
  # needs no AWS API access.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/dsp-exchange-api
automountServiceAccountToken: false

name: DSP integration — hosted API

# Deploys the DSP Integration POC's API as a Cloud Function (codebase
# `dsp-api`) in the backlog-tracker-e4ed2 Firebase project, so the hosted
# prototype on GitHub Pages can save:
#   https://us-central1-backlog-tracker-e4ed2.cloudfunctions.net/dspApi
# See dsp-integration/deploy/firebase/README.md.
#
# Only the `dsp-api` codebase is deployed: the console's own functions
# (deploy-backlog-tracker.yml, codebase `default`) are never touched by this,
# and that workflow never touches these.

on:
  push:
    branches: [main]
    paths:
      - 'dsp-integration/apps/api/**'
      - 'dsp-integration/apps/dsp-mocks/**'
      - 'dsp-integration/packages/**'
      - 'dsp-integration/deploy/firebase/**'
      - 'dsp-integration/package-lock.json'
      - '.github/workflows/dsp-api-deploy.yml'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Type RESET to wipe the hosted data and start again from the demo estate (keeps its keys and tokens)'
        required: false
        default: ''

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: dsp-api-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsp-integration
    env:
      API_URL: https://us-central1-backlog-tracker-e4ed2.cloudfunctions.net/dspApi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsp-integration/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Never ship a red API: its own tests gate the deploy.
      - name: API tests
        run: npm test -w @ph-dsp/api

      - name: Build the function bundle
        run: node deploy/firebase/build.mjs

      - name: Install the function's runtime dependencies
        working-directory: dsp-integration/deploy/firebase/functions
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/firebase-sa.json"

      # The one `reset` input also drives backups (a workflow's `on:` block can
      # only change in a reviewed PR, so no new inputs): RESET wipes and reseeds;
      # BACKUP only copies; LIST prints the backups; "RESTORE <timestamp>" puts
      # one back. A copy of everything in dspApiState (database, creatives,
      # keys) goes to the private Firestore collection dspApiBackups before
      # anything can delete it, a reset or a restore. Never an Actions
      # artifact: this repo is public and instance.json holds the keys.
      # (22 Oct 2026: two resets wiped hand-made demo data, nothing was kept.)
      - name: Back up hosted data
        if: github.event_name == 'workflow_dispatch' && (inputs.reset == 'RESET' || inputs.reset == 'BACKUP' || startsWith(inputs.reset, 'RESTORE '))
        working-directory: dsp-integration/deploy/firebase/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          REASON: ${{ inputs.reset == 'RESET' && 'before reset' || inputs.reset == 'BACKUP' && 'manual' || 'before restore' }}
        run: node state-backup.mjs backup "$REASON"

      - name: List backups
        if: github.event_name == 'workflow_dispatch' && inputs.reset == 'LIST'
        working-directory: dsp-integration/deploy/firebase/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node state-backup.mjs list

      # Puts a backup back (the step above has just copied what is there now,
      # and the script copies it again as "before restore"). The deploy below
      # starts a new instance, which cold-starts from what was restored.
      - name: Restore hosted data
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.reset, 'RESTORE ')
        working-directory: dsp-integration/deploy/firebase/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          INPUT: ${{ inputs.reset }}
        run: node state-backup.mjs restore "${INPUT#RESTORE }"

      # Wipes the saved database and creatives (Firestore dspApiState), not the
      # instance's keys and tokens. DESTROYS hand-made demo data: only with the
      # owner's go-ahead for this run. The backup step above has already copied
      # it all; put it back with reset = "RESTORE <timestamp>". The redeploy
      # below starts a new instance, which then seeds fresh demo data.
      - name: Reset hosted data
        if: github.event_name == 'workflow_dispatch' && inputs.reset == 'RESET'
        working-directory: dsp-integration/deploy/firebase/functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          node --input-type=module -e "
            import { initializeApp } from 'firebase-admin/app'
            import { getFirestore } from 'firebase-admin/firestore'
            initializeApp({ projectId: 'backlog-tracker-e4ed2' })
            const col = getFirestore().collection('dspApiState')
            const snap = await col.get()
            const doomed = snap.docs.filter((d) => !d.id.startsWith('blob~instance.json'))
            for (let i = 0; i < doomed.length; i += 400) {
              const batch = getFirestore().batch()
              doomed.slice(i, i + 400).forEach((d) => batch.delete(d.ref))
              await batch.commit()
            }
            console.log('Deleted', doomed.length, 'documents of hosted data.')
          "

      # Only dspApi: scheduled work runs inside it (host.ts), because a Cloud
      # Scheduler job needs cloudscheduler.googleapis.com, which this service
      # account may not enable — the first deploy (run #1) failed on exactly
      # that, even with the scheduled function in a separate step, since the
      # CLI checks every function in the codebase.
      - name: Deploy dspApi
        working-directory: dsp-integration/deploy/firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@13 deploy --only functions:dsp-api --project backlog-tracker-e4ed2 --non-interactive --force

      # Proves it end to end: the function answers, CORS is right for GitHub
      # Pages, and a save round-trips (and is put back as it was).
      - name: Smoke test the live API
        run: |
          ok=
          for i in $(seq 1 30); do
            if curl -sf "$API_URL/api/admin/v1/session" >/dev/null; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "The API never answered at $API_URL"; exit 1; }
          curl -sf "$API_URL/api/admin/v1/session"; echo
          curl -s -D - -o /dev/null -H 'Origin: https://offline2online.github.io' "$API_URL/api/admin/v1/session" | tr -d '\r' | grep -i '^access-control-allow-origin: https://offline2online.github.io$'
          node --input-type=module -e "
            // No trailing slash: the API routes /display-types, not /display-types/.
            const base = process.env.API_URL + '/api/admin/v1/display-types'
            const list = await (await fetch(base)).json()
            const first = (list.items ?? list)[0]
            if (!first) { console.log('Unexpected display type list:', JSON.stringify(list).slice(0, 500)); process.exit(1) }
            const rec = await (await fetch(base + '/' + first.id + '/record')).json()
            delete rec.phExtensions
            const put = (body) => fetch(base + '/' + first.id + '/record', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
            const r1 = await put({ ...rec, description: 'deploy smoke test' })
            const back = await (await fetch(base + '/' + first.id + '/record')).json()
            const r2 = await put(rec)
            console.log('save', r1.status, '| read back', JSON.stringify(back.description), '| restore', r2.status)
            if (r1.status !== 200 || back.description !== 'deploy smoke test' || r2.status !== 200) process.exit(1)
          "

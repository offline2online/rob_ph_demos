name: Lead ingest diagnosis (one-off)

# One-off check of the website → leadIngest path (5 Nov 2026). Runs on push
# to this session branch only; never merged to main. The repo is public, so
# the log shows times, HTTP statuses and counts only. Company names are
# encrypted to a key held outside this repo; the stored LEAD_INGEST_KEY is
# masked and only its length and an 8-character sha256 prefix are printed.
on:
  push:
    branches: [ccr-47593db0-1kuvwo]
    paths: [.github/workflows/lead-ingest-diagnose.yml]

permissions:
  contents: read

env:
  PROJECT: backlog-tracker-e4ed2
  DIAG_PUBKEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArf/UnFQ5afwrn1EfOPBB
    Q0NGM8nslF1y3hdaGx17J5dm9ya++8y6W9DXKqA6UwtQZCOY19ZbhPTRIT1K4fhf
    T6WXmK/T5GJmAY0zisPt6/sN7aZ/cu1aKI23/DpRxGzSp3rFuCNPw2bdq0fxFwMT
    3z3NJSxhI+XN0/Mfn+83UrYYQ7WcB/fskD4simpjYuKjg/lvtRWt6wn6dBbIuRWc
    gcfwK0Ot7D9qu0E20FdommJlZwz98SB6S2z3LZxyNcdIxNK4LI9uE+QLjAv86reK
    FOZMMi1L3M4s9k+i13hhRfa8qchJ3Jkhn0BXtGqqGiqMTfDiRhKESEFckqjIjTv0
    MIp3h/BUZ+wyPvXE+rvYsL9vHv90/6q2Hw6VmtO2/SvCI7cuCREF6jjgmiQXIogQ
    mNZg9c8X4sDyCMVa6+IPE/yx8v7C8X+CdQEwJBrK0kuRhiJ/IedmOE8P+G5v7M3t
    Kl7Foc3xTN5v0LrbcjgE5Vy3ls5kjiqLSbtRihHUDvJfAgMBAAE=
    -----END PUBLIC KEY-----

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet

      - name: Delete the key-check test lead
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --silent >/dev/null 2>&1
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp({ projectId: process.env.PROJECT });
            (async () => {
              const ref = admin.firestore().collection("leads").doc("SoBMjUN9OVPcte5QG9gJ");
              const d = await ref.get();
              if (!d.exists) return console.log("already gone");
              if (d.data().test !== true) { console.log("not a test lead, leaving it"); process.exit(1); }
              await ref.delete();
              const left = await admin.firestore().collection("leads").get();
              console.log("deleted test lead; leads left: " + left.size);
            })().catch((e) => { console.log("failed: " + e.message); process.exit(1); });
          '

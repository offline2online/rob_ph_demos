name: Lead ingest diagnosis (one-off)

# One-off check of the website → leadIngest path (5 Nov 2026). Runs on push
# to this session branch only; never merged to main. The repo is public, so
# the log shows times, HTTP statuses and counts only. Company names are
# encrypted to a key held outside this repo; the stored LEAD_INGEST_KEY is
# masked and only its length and an 8-character sha256 prefix are printed.
on:
  push:
    branches: [ccr-47593db0-1kuvwo]
    paths: [.github/workflows/lead-ingest-diagnose.yml]

permissions:
  contents: read

env:
  PROJECT: backlog-tracker-e4ed2
  DIAG_PUBKEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArf/UnFQ5afwrn1EfOPBB
    Q0NGM8nslF1y3hdaGx17J5dm9ya++8y6W9DXKqA6UwtQZCOY19ZbhPTRIT1K4fhf
    T6WXmK/T5GJmAY0zisPt6/sN7aZ/cu1aKI23/DpRxGzSp3rFuCNPw2bdq0fxFwMT
    3z3NJSxhI+XN0/Mfn+83UrYYQ7WcB/fskD4simpjYuKjg/lvtRWt6wn6dBbIuRWc
    gcfwK0Ot7D9qu0E20FdommJlZwz98SB6S2z3LZxyNcdIxNK4LI9uE+QLjAv86reK
    FOZMMi1L3M4s9k+i13hhRfa8qchJ3Jkhn0BXtGqqGiqMTfDiRhKESEFckqjIjTv0
    MIp3h/BUZ+wyPvXE+rvYsL9vHv90/6q2Hw6VmtO2/SvCI7cuCREF6jjgmiQXIogQ
    mNZg9c8X4sDyCMVa6+IPE/yx8v7C8X+CdQEwJBrK0kuRhiJ/IedmOE8P+G5v7M3t
    Kl7Foc3xTN5v0LrbcjgE5Vy3ls5kjiqLSbtRihHUDvJfAgMBAAE=
    -----END PUBLIC KEY-----

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet

      - name: 1. leadIngest requests (time + HTTP status only)
        continue-on-error: true
        run: |
          for win in 30m 6h; do
            [ "$win" = 6h ] && since=$(date -u -d '-6 hours' +%FT%TZ)
            [ "$win" = 30m ] && since=$(date -u -d '-30 minutes' +%FT%TZ)
            echo "=== requests since $since ($win) ==="
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"leadingest\" AND log_id(\"run.googleapis.com/requests\") AND timestamp>=\"$since\"" \
              --project "$PROJECT" --order=asc --limit=500 \
              --format='value(timestamp,httpRequest.requestMethod,httpRequest.status)' 2>&1 \
              | sed -E 's/https?:[^ ]*//g'
            echo "=== end ($win) ==="
          done
          echo "=== function errors in the last 6h (severity + time only) ==="
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"leadingest\" AND severity>=ERROR AND timestamp>=\"$(date -u -d '-6 hours' +%FT%TZ)\"" \
            --project "$PROJECT" --order=asc --limit=100 --format='value(timestamp,severity)' 2>&1
          echo "=== end errors ==="

      - name: 2. leads collection
        continue-on-error: true
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --silent >/dev/null 2>&1
          node -e '
            const admin = require("firebase-admin");
            admin.initializeApp({ projectId: process.env.PROJECT });
            (async () => {
              const snap = await admin.firestore().collection("leads").get();
              const rows = snap.docs.map((d) => {
                const x = d.data(), c = x.createdAt;
                return { id: d.id, test: x.test === true, source: x.source || "", company: (x.company || {}).name || "",
                  createdAt: c && c.toDate ? c.toDate().toISOString() : String(c || "") };
              }).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
              const t = rows.filter((r) => r.test).length;
              console.log(`leads: ${rows.length} total, test==true ${t}, test==false ${rows.length - t}`);
              require("fs").writeFileSync(process.env.RUNNER_TEMP + "/leads.json", JSON.stringify(rows, null, 1));
            })().catch((e) => { console.log("leads read failed: " + e.message); process.exit(1); });
          '
          printf '%s\n' "$DIAG_PUBKEY" > "$RUNNER_TEMP/pub.pem"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          echo "=== ENC_KEY ==="
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/k" | base64 -w0; echo
          echo "=== ENC_DATA ==="
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/k" -in "$RUNNER_TEMP/leads.json" | base64 -w0; echo
          echo "=== END_ENC ==="
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/leads.json"

      - name: 3. Direct test with the stored LEAD_INGEST_KEY
        continue-on-error: true
        run: |
          echo "=== Secret Manager versions ==="
          gcloud secrets versions list LEAD_INGEST_KEY --project "$PROJECT" --format='value(name,state,createTime)' 2>&1
          KEY="$(gcloud secrets versions access latest --secret=LEAD_INGEST_KEY --project "$PROJECT")"
          echo "::add-mask::$KEY"
          if [ "$KEY" = unset ]; then echo "stored key: the 'unset' placeholder"; else echo "stored key: ${#KEY} chars, sha256 prefix $(printf '%s' "$KEY" | sha256sum | cut -c1-8)"; fi
          code=$(curl -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' -X POST \
            -H "X-Lead-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"company":"TEST key check 2 - delete","email":"e2e-test@example.com","contactName":"Key Check","test":true}' \
            https://backlog-tracker-e4ed2.web.app/leadIngest/v1/submit)
          echo "POST status: $code"
          echo "POST body: $(cat "$RUNNER_TEMP/body")"

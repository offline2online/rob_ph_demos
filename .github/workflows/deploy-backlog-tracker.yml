name: Deploy backlog-tracker

on:
  push:
    branches: [main]
    paths:
      - 'backlog-tracker/**'
      - 'faq/**'
  workflow_dispatch:
    inputs:
      seed_faq:
        description: 'Also run the one-off Freshdesk FAQ seed. ONLY for bootstrapping an empty Firestore: it recreates any article or category deleted in the console that has no tombstone.'
        type: boolean
        default: false
      force:
        description: 'Deploy even if this exact backlog-tracker/ + faq/ content is already live — e.g. to push a rotated repo secret into Secret Manager.'
        type: boolean
        default: false

# Several PRs merging within seconds of each other (a common shape for this
# repo — the Notify Claude Routine and its human reimplementations both
# tend to land a batch of small fixes back to back) used to fire one deploy
# run per push, all racing to update the same Cloud Functions at once and
# failing with GCP's "409 unable to queue the operation". Grouping runs by
# workflow+branch, so a newer push replaces a still-queued one, means a burst of N merges now completes exactly one deploy —
# for the last commit, which already contains every change in the burst —
# instead of N racing runs where only one (not necessarily the last) wins.
#
# cancel-in-progress is false (4 Oct 2026): cancelling a run in the middle of
# `firebase deploy` leaves its function updates running on Google's side,
# and the newer run then collides with them (409). Runs now queue instead;
# GitHub keeps only the newest pending run, so a burst still ends in one
# deploy of the last commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backlog-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: backlog-tracker/functions
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/firebase-sa.json"

      # Firebase cost review (4 Oct 2026): this workflow ran 100 times in ten
      # days, often for content that was already live — a push and the
      # pipeline's own dispatch for the same merge, or two dispatches of one
      # commit three minutes apart (runs 37194492882 / 37194636723). Every run
      # repeats the secret sync, the docs sync, the seeds and a full
      # `firebase deploy`. So a run first fingerprints everything it deploys
      # (the backlog-tracker/ and faq/ trees plus this file) and stops here
      # if the last successful deploy recorded the same fingerprint
      # (systemStatus/pipeline.deployedTree). `force` or `seed_faq` always
      # deploys; so does any read failure, since skipping is only an
      # optimisation.
      - name: Skip if this exact content is already deployed
        id: dedupe
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          TREE=$(git rev-parse HEAD:backlog-tracker HEAD:faq HEAD:.github/workflows/deploy-backlog-tracker.yml | sha1sum | cut -c1-40)
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.seed_faq }}" = "true" ]; then
            echo "Forced deploy requested."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(node scripts/write-system-status.js --get deployedTree 2>/dev/null || true)
          if [ -n "$LAST" ] && [ "$LAST" = "$TREE" ]; then
            echo "::notice title=Already deployed::backlog-tracker/ and faq/ are unchanged since the last successful deploy ($TREE) — skipping. Re-run with force to deploy anyway."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Content changed since the last successful deploy (${LAST:-none recorded}) — deploying $TREE."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets go into Secret Manager WITHOUT redeploying any function
      # (scripts/sync-function-secret.sh): an unchanged value is a no-op and a
      # changed one only adds a version, which the "Deploy to Firebase" step
      # below pins every function to. This replaced five
      # `functions:secrets:set --force` calls (4 Oct 2026) that re-uploaded
      # every unchanged secret on every deploy and redeployed six functions
      # each time; one transient 503 left five of those updates running on
      # Google's side, every retry hit "409, unable to queue the operation",
      # and the job died before hosting deployed (run 37189515221).
      #
      # GH_DISPATCH_TOKEN and BOARD_API_KEY are written even when the repo
      # secret is empty, as the "unset" placeholder: functions/index.js
      # declares them with defineSecret(), and `firebase deploy` fails
      # outright if a declared secret does not exist. Their functions treat
      # "unset" as missing (boardApi answers 503, dispatch falls back to
      # backlog-automation.yml's own schedule). NOTIFY_WEBHOOK_URL and the
      # Routine pair are skipped when unset, as before.
      - name: Sync secrets into Firebase Secret Manager
        if: steps.dedupe.outputs.skip != 'true'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          sync() { printf '%s' "$2" | bash scripts/sync-function-secret.sh "$1"; }
          if [ -n "$NOTIFY_WEBHOOK_URL" ]; then sync NOTIFY_WEBHOOK_URL "$NOTIFY_WEBHOOK_URL"; else echo "NOTIFY_WEBHOOK_URL repo secret not set, skipping"; fi
          if [ -n "$CLAUDE_ROUTINE_FIRE_URL" ] && [ -n "$CLAUDE_ROUTINE_TOKEN" ]; then
            sync CLAUDE_ROUTINE_FIRE_URL "$CLAUDE_ROUTINE_FIRE_URL"
            sync CLAUDE_ROUTINE_TOKEN "$CLAUDE_ROUTINE_TOKEN"
          else
            echo "CLAUDE_ROUTINE_FIRE_URL/CLAUDE_ROUTINE_TOKEN repo secrets not set, skipping"
          fi
          sync GH_DISPATCH_TOKEN "${GH_DISPATCH_TOKEN:-unset}"
          sync BOARD_API_KEY "${BOARD_API_KEY:-unset}"

      - name: Install migration script dependencies
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: backlog-tracker/scripts
        run: npm install

      # The Firebase Auth user Routine-fired Claude sessions sign in as
      # (password = BOARD_API_KEY). See scripts/ensure-automation-user.js.
      - name: Ensure the board automation user exists
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: node ensure-automation-user.js

      # The board keeps its own copy of this project's README and
      # Requirements (projects/{id}.readmeMd / requirementsMd) for the Docs
      # page. The repo files are the source of truth; root CLAUDE.md asks
      # for the copy to follow in the same session the file changes. This
      # README is ~80 KB, so the only honest way to do that is to send the
      # file rather than have anyone retype it — see scripts/sync-board-docs.js.
      - name: Sync this project's docs onto the board
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node sync-board-docs.js

      - name: Seed historical backlog data from artifact export
        if: steps.dedupe.outputs.skip != 'true'
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node migrate-artifact-data.js

      # XFeVboxWduEPT2zGcj8y: seed-faq-data.js is an insert-only Freshdesk
      # import (see the file's own header) — safe against overwriting an
      # existing article/category, but NOT safe against a deleted one: once
      # a doc is gone from Firestore, ref.create() succeeds again on the
      # very next run and silently resurrects it with its original imported
      # content. Running it on every deploy meant any article or category
      # deleted from the console came back the moment anyone next shipped
      # an unrelated change.
      #
      # The first fix (25 Sep 2026, 04:54) gated this on
      # `github.event_name == 'workflow_dispatch'`, meaning "a person's Run
      # workflow click" — but workflow_dispatch is ALSO how the pipeline
      # runs this workflow after every train merge: a GITHUB_TOKEN merge
      # fires no push event, so run-backlog-automation.js's finishTrain
      # dispatches the deploy explicitly. The seed therefore ran at 04:56,
      # 06:52, 07:13, 08:04 and 09:37 that same day and resurrected the
      # same five deleted articles five times. The gate is now an explicit
      # input nobody ticks by accident; the pipeline passes no inputs. And
      # independently of this gate, seed-faq-data.js skips any id with a
      # tombstone in faqDeletedArticles / faqDeletedCategories, which the
      # console writes the moment an editor deletes something.
      - name: Seed starting FAQ / Help Center content
        if: steps.dedupe.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.seed_faq == true
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node seed-faq-data.js

      # --force is required here, not optional: removing a Cloud Function
      # from source (as happened when notifyOnBacklogItemCreated was
      # deleted) makes the CLI stop and ask "delete this function too?" —
      # a prompt --non-interactive can't answer, so without --force this
      # step aborts outright ("Aborting because deletion cannot proceed in
      # non-interactive mode") on every deploy after a function removal,
      # taking every other change in the same push down with it. --force
      # skips that (and every other) confirmation prompt.
      # The public help centre is a second Hosting site in the same project
      # (target "help" → site ph-help-centre, serving repo-root faq/ at its
      # root, custom domain help.personalisationhub.com). Creating the site
      # is idempotent: it already existing is the normal case.
      - name: Ensure the help-centre Hosting site exists
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@13 hosting:sites:create ph-help-centre --project backlog-tracker-e4ed2 --non-interactive 2>&1 | tee /dev/stderr | grep -qiE "already exists|Site .* has been created" || true

      # firebase-tools refuses a public dir outside the firebase.json folder,
      # so the help centre (repo-root faq/) is staged into backlog-tracker/
      # help-site/ (git-ignored) right before deploying.
      - name: Stage the help centre for Hosting
        if: steps.dedupe.outputs.skip != 'true'
        run: rsync -a --delete --exclude README.md ../faq/ help-site/

      - name: Deploy to Firebase (hosting, functions, firestore rules)
        if: steps.dedupe.outputs.skip != 'true'
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        # Retried on Google's transient errors only. A failed function update
        # can leave sibling updates still running on Google's side, and an
        # immediate retry just collides with them ("409, unable to queue the
        # operation"), so each retry first waits for the project's in-flight
        # Cloud Functions operations to drain (up to 10 minutes). Deploying
        # again is idempotent: unchanged functions are skipped.
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          set -o pipefail
          # In-flight operations, from the Cloud Functions v2 API itself
          # (gcloud has no list command for them). Always waits at least a
          # minute, so a failure to read the list can't turn into an
          # immediate, colliding retry.
          drain() {
            sleep 60
            for i in $(seq 1 36); do
              n=$( { curl -sf -H "Authorization: Bearer $(gcloud auth print-access-token)" \
                "https://cloudfunctions.googleapis.com/v2/projects/backlog-tracker-e4ed2/locations/us-central1/operations?filter=done%3Dfalse&pageSize=100" || true; } \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log((JSON.parse(d||"{}").operations||[]).length)}catch{console.log(0)}})')
              [ "${n:-0}" = 0 ] && return 0
              echo "  $n Cloud Functions operation(s) still running, waiting…"
              sleep 15
            done
          }
          for attempt in 1 2 3; do
            if npx firebase-tools@13 deploy --only hosting,functions,firestore:rules --project backlog-tracker-e4ed2 --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
              exit 0
            fi
            if ! grep -qE "HTTP Error: (409|429|500|502|503|504)|unable to queue the operation|Deadline Exceeded|Failed to list functions" "$RUNNER_TEMP/deploy.log"; then
              echo "Deploy failed and the failure is not a transient Google error — not retrying."
              exit 1
            fi
            [ "$attempt" = 3 ] && { echo "Deploy still failing on transient Google errors after 3 attempts."; exit 1; }
            echo "Deploy hit a transient Google error (attempt $attempt/3); waiting for in-flight operations before retrying."
            drain
          done

      # Storage rules go in their own, non-fatal step. `storage:rules` (PR
      # #136) is not a valid --only target — the CLI read "rules" as a
      # deploy-target name and failed every deploy with "Could not find
      # rules for the following storage targets: rules" (runs #140-#142),
      # which is what left the console stuck on 1.5.29. The correct spec is
      # plain `storage`; and because Firebase Storage may not be set up on
      # the project yet, a failure here must not take hosting/functions/
      # firestore rules down with it.
      # Secret Manager bills every enabled secret version (~$0.06/month each
      # beyond six free). Until 4 Oct 2026 every deploy added a version of all
      # five secrets (NOTIFY_WEBHOOK_URL reached 297), so roughly 1,500 old
      # versions were still being billed. `functions:secrets:prune` destroys
      # every version no deployed function is pinned to — it reads the live
      # functions, both codebases, so a pinned version is never touched.
      # Only after a deploy that fully succeeded: a failed one can leave a
      # function update still running on Google's side, pinned to a version
      # the live listing doesn't show yet, and prune would destroy it.
      # Non-fatal like the other housekeeping steps, but loud when it fails.
      - name: Destroy secret versions no function uses
        if: steps.dedupe.outputs.skip != 'true' && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          if ! npx firebase-tools@13 functions:secrets:prune --project backlog-tracker-e4ed2 --non-interactive --force; then
            echo "::warning title=Old secret versions not cleaned up::functions:secrets:prune failed (the deploy service account may need Secret Manager Admin). Unused secret versions keep being billed. See backlog-tracker/README.md → 'Old secret versions'."
          fi

      - name: Deploy Storage rules (non-fatal until Storage is set up)
        if: steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@13 deploy --only storage --project backlog-tracker-e4ed2 --non-interactive --force

      - name: Set Artifact Registry cleanup policy for gcf-artifacts
        if: steps.dedupe.outputs.skip != 'true'
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json"
          cat > "$RUNNER_TEMP/cleanup-policy.json" <<'POLICY'
          [
            {
              "name": "delete-untagged-after-3-days",
              "action": {"type": "Delete"},
              "condition": {
                "tagState": "untagged",
                "olderThan": "259200s"
              }
            }
          ]
          POLICY
          # The deploy service account lacks artifactregistry.repositories.update,
          # so this has failed on every run (seen 4 Oct 2026, run 37194636723)
          # and old function images have never been deleted. It stays
          # non-fatal, but now says so on the run summary instead of
          # silently. One-time fix: backlog-tracker/README.md → "Old Cloud
          # Functions build images".
          if ! gcloud artifacts repositories set-cleanup-policies gcf-artifacts \
            --project=backlog-tracker-e4ed2 \
            --location=us-central1 \
            --policy="$RUNNER_TEMP/cleanup-policy.json" \
            --quiet; then
            echo "::warning title=Old function images are not being cleaned up::Couldn't set the gcf-artifacts cleanup policy (the deploy service account needs Artifact Registry Repository Administrator on it, or set the policy once by hand). Old Cloud Functions images keep accumulating storage charges. See backlog-tracker/README.md → 'Old Cloud Functions build images'."
          fi

      # Pipeline health strip (YeCj7sNpHXFUZQhmAmEb — see public/js/app.js's
      # renderHealthStrip). `if: always()` so a failed deploy is recorded
      # too, not just a successful one — that's the whole point of a health
      # check. deployedAppVersion is only ever set on success: claiming a
      # version is "live" off a deploy that didn't actually finish would be
      # worse than the strip saying nothing at all.
      - name: Record deploy status for the board's health strip
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONCLUSION="${{ steps.deploy.outcome }}"
          TREE="${{ steps.dedupe.outputs.tree }}"
          # A skipped run (content already live) reports as a successful
          # deploy of the same version — which it is.
          [ "${{ steps.dedupe.outputs.skip }}" = "true" ] && CONCLUSION=success
          AT="$(date -u +%FT%TZ)"
          if [ "$CONCLUSION" = "success" ]; then
            VERSION=$(node -e "console.log(require('fs').readFileSync('public/js/version.js','utf8').match(/APP_VERSION\s*=\s*\"([^\"]+)\"/)[1])")
            node scripts/write-system-status.js "$(node -e "console.log(JSON.stringify({deployBacklogTracker:{at:process.argv[1],conclusion:process.argv[2],runUrl:process.argv[3]},deployedAppVersion:process.argv[4],deployedTree:process.argv[5]}))" "$AT" "$CONCLUSION" "$RUN_URL" "$VERSION" "$TREE")"
          else
            node scripts/write-system-status.js "$(node -e "console.log(JSON.stringify({deployBacklogTracker:{at:process.argv[1],conclusion:process.argv[2],runUrl:process.argv[3]}}))" "$AT" "$CONCLUSION" "$RUN_URL")"
          fi

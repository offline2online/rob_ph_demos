name: Deploy backlog-tracker

on:
  push:
    branches: [main]
    paths:
      - 'backlog-tracker/**'
  workflow_dispatch: {}

# Several PRs merging within seconds of each other (a common shape for this
# repo — the Notify Claude Routine and its human reimplementations both
# tend to land a batch of small fixes back to back) used to fire one deploy
# run per push, all racing to update the same Cloud Functions at once and
# failing with GCP's "409 unable to queue the operation". Grouping runs by
# workflow+branch and cancelling a still-running/queued one when a newer
# push arrives means a burst of N merges now completes exactly one deploy —
# for the last commit, which already contains every change in the burst —
# instead of N racing runs where only one (not necessarily the last) wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backlog-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: backlog-tracker/functions
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/firebase-sa.json"

      # `functions:secrets:set` updates the secret version and both
      # functions successfully (visible in the run's own log output —
      # "Updated function ...") but then makes an internal trailing call
      # to list functions to verify propagation, and that specific call
      # has failed with GCP's generic "Failed to list functions for
      # backlog-tracker-e4ed2" twice in a row in production, always right
      # after the LAST secrets:set invocation in the job (i.e. after 2-3
      # rapid update+list cycles against the Cloud Functions API within a
      # few minutes) — consistent with a transient rate/propagation issue
      # on GCP's side rather than anything wrong with the secret or
      # function update itself, which had already succeeded by the time
      # the error surfaces. `bash -e` turns that one failing call into an
      # aborted job before the real "Deploy to Firebase" step below ever
      # runs, so retrying just this command (not the whole job) is enough
      # to ride out the flake.
      - name: Sync NOTIFY_WEBHOOK_URL into Firebase Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL repo secret not set, skipping"
            exit 0
          fi
          for attempt in 1 2 3; do
            if printf '%s' "$NOTIFY_WEBHOOK_URL" | npx firebase-tools@13 functions:secrets:set NOTIFY_WEBHOOK_URL --project backlog-tracker-e4ed2 --data-file - --force; then
              break
            fi
            [ "$attempt" = "3" ] && { echo "functions:secrets:set NOTIFY_WEBHOOK_URL failed after 3 attempts"; exit 1; }
            echo "functions:secrets:set NOTIFY_WEBHOOK_URL failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done

      - name: Sync CLAUDE_ROUTINE_FIRE_URL / CLAUDE_ROUTINE_TOKEN into Firebase Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          if [ -z "$CLAUDE_ROUTINE_FIRE_URL" ] || [ -z "$CLAUDE_ROUTINE_TOKEN" ]; then
            echo "CLAUDE_ROUTINE_FIRE_URL/CLAUDE_ROUTINE_TOKEN repo secrets not set, skipping"
            exit 0
          fi
          for attempt in 1 2 3; do
            if printf '%s' "$CLAUDE_ROUTINE_FIRE_URL" | npx firebase-tools@13 functions:secrets:set CLAUDE_ROUTINE_FIRE_URL --project backlog-tracker-e4ed2 --data-file - --force; then
              break
            fi
            [ "$attempt" = "3" ] && { echo "functions:secrets:set CLAUDE_ROUTINE_FIRE_URL failed after 3 attempts"; exit 1; }
            echo "functions:secrets:set CLAUDE_ROUTINE_FIRE_URL failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done
          for attempt in 1 2 3; do
            if printf '%s' "$CLAUDE_ROUTINE_TOKEN" | npx firebase-tools@13 functions:secrets:set CLAUDE_ROUTINE_TOKEN --project backlog-tracker-e4ed2 --data-file - --force; then
              break
            fi
            [ "$attempt" = "3" ] && { echo "functions:secrets:set CLAUDE_ROUTINE_TOKEN failed after 3 attempts"; exit 1; }
            echo "functions:secrets:set CLAUDE_ROUTINE_TOKEN failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done

      - name: Install migration script dependencies
        working-directory: backlog-tracker/scripts
        run: npm install

      - name: Seed historical backlog data from artifact export
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node migrate-artifact-data.js

      - name: Seed starting FAQ / Help Center content
        working-directory: backlog-tracker/scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node seed-faq-data.js

      # --force is required here, not optional: removing a Cloud Function
      # from source (as happened when notifyOnBacklogItemCreated was
      # deleted) makes the CLI stop and ask "delete this function too?" —
      # a prompt --non-interactive can't answer, so without --force this
      # step aborts outright ("Aborting because deletion cannot proceed in
      # non-interactive mode") on every deploy after a function removal,
      # taking every other change in the same push down with it. --force
      # skips that (and every other) confirmation prompt.
      - name: Deploy to Firebase (hosting, functions, firestore rules)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx firebase-tools@13 deploy --only hosting,functions,firestore:rules --project backlog-tracker-e4ed2 --non-interactive --force

      - name: Set Artifact Registry cleanup policy for gcf-artifacts
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json"
          cat > "$RUNNER_TEMP/cleanup-policy.json" <<'POLICY'
          [
            {
              "name": "delete-untagged-after-3-days",
              "action": {"type": "Delete"},
              "condition": {
                "tagState": "untagged",
                "olderThan": "259200s"
              }
            }
          ]
          POLICY
          gcloud artifacts repositories set-cleanup-policies gcf-artifacts \
            --project=backlog-tracker-e4ed2 \
            --location=us-central1 \
            --policy="$RUNNER_TEMP/cleanup-policy.json" \
            --quiet

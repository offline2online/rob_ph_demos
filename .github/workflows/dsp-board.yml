name: DSP integration — board docs and tickets

# The board is behind Google sign-in, so everything that writes to it needs
# BOARD_API_KEY — which lives here as a repository secret and deliberately
# not on anyone's laptop. That left two jobs that could only be done by
# hand: keeping the board's copy of REQUIREMENTS.md / README.md in step
# (root CLAUDE.md, "Keep the board's copies in step as you go"), and moving
# a card when work reached main outside the board's own Deploy to Main.
#
# Both are scripts in dsp-integration/scripts/. This runs them where the key
# already is. The docs sync runs itself whenever either file lands on main,
# or any file it mirrors to the console's project documents (the handover
# set, scripts/sync-board-docs.mjs → MIRRORS) or the script itself: until
# 19 Oct 2026 only the first two triggered it, so a merge that changed just
# API.md or a review left the board copy stale until the next README edit.
# The ticket moves are manual, because moving someone's card is not
# something a push should do on its own.
on:
  push:
    branches: [main]
    paths:
      - 'dsp-integration/docs/dsp-integration/**/*.md'
      - 'dsp-integration/README.md'
      - 'dsp-integration/deploy/kubernetes/README.md'
      - 'dsp-integration/scripts/sync-board-docs.mjs'
      - '.github/workflows/dsp-board.yml'
  workflow_dispatch:
    inputs:
      docs:
        description: 'The board copy of REQUIREMENTS.md / README.md'
        type: choice
        options: [sync, check, skip]
        default: sync
      deploy_branch:
        description: "Set the project's deployBranch (e.g. deploy/dsp-integration) — the project given in 'project', else Display Types. Blank = leave it."
        type: string
        default: ''
      tickets:
        description: "Several tickets in ONE run: 'id[:status][@sha]' separated by commas, e.g. 'abc:ready-for-testing@0f0c6c0, def:ready-to-publish'. Use this, not repeated single-ticket runs, when moving more than one card."
        required: false
        default: ''
      ticket:
        description: 'Ticket id to move (blank = move nothing)'
        type: string
        default: ''
      to:
        description: 'Status for that ticket'
        type: choice
        options: ['', backlog, ready-for-testing, ready-to-publish, published-live, archived]
        default: ''
      preview:
        description: 'Test link for that ticket'
        type: string
        default: ''
      deploy_commit:
        description: "That ticket's commit on the train branch (the board reads the train by this field)"
        type: string
        default: ''
      reason:
        description: "With to = backlog for a train card: what failed (recorded as its lastFailureReason; the card is reverted and rebuilt with it)"
        type: string
        default: ''
      project:
        description: "Board project id the ticket/train inputs act on (blank = Display Types & DSP Integration)"
        type: string
        default: ''
      train_ready:
        description: "Set the project's trainReady so the automation merges the train — only after the Deploy run's checks (ROUTINE_INSTRUCTIONS.md steps 1–3b) have been done by hand"
        type: boolean
        default: false
      notify:
        description: "Fire Notify Claude for the project (start a build): a Backlog ticket id, or 'all' for the whole column. Blank = don't."
        type: string
        default: ''

# One at a time: two runs writing the same fields would race, and the later
# writer would silently win. Note GitHub keeps only ONE pending run per
# concurrency group and cancels older pending ones (runs 74-76, 2 Oct 2026:
# the middle of three quick dispatches was dropped) — so move several cards
# with the `tickets` input in one run, never with a burst of dispatches.
concurrency:
  group: dsp-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each script signs in as the board automation user, writes, then
      # reads back and fails if what landed isn't what was sent.
      - name: Sync the docs
        if: inputs.docs != 'skip'
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: node scripts/sync-board-docs.mjs ${{ inputs.docs == 'check' && '--check' || '' }}

      - name: Point the project at its deploy branch
        if: inputs.deploy_branch != ''
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        # --project as in every other step: without it board-tickets.mjs defaults
        # to Display Types & DSP Integration and would overwrite that project's branch.
        run: node scripts/board-tickets.mjs ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} --deploy-branch "${{ inputs.deploy_branch }}" --yes

      - name: Move a ticket
        if: inputs.ticket != ''
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
          REASON: ${{ inputs.reason }}
        run: |
          node scripts/board-tickets.mjs \
            ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} \
            --ticket "${{ inputs.ticket }}" \
            ${{ inputs.to != '' && format('--to "{0}"', inputs.to) || '' }} \
            ${{ inputs.preview != '' && format('--preview "{0}"', inputs.preview) || '' }} \
            ${{ inputs.deploy_commit != '' && format('--deploy-commit "{0}"', inputs.deploy_commit) || '' }} \
            ${REASON:+--reason "$REASON"} \
            --yes

      - name: Move several tickets
        if: inputs.tickets != ''
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
          TICKETS: ${{ inputs.tickets }}
        run: |
          node scripts/board-tickets.mjs \
            ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} \
            --tickets "$TICKETS" --yes

      - name: Mark the train ready to merge
        if: inputs.train_ready == true
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: node scripts/board-tickets.mjs ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} --train-ready --yes

      # The same write the board's Ready for Dev / Notify Claude click makes,
      # from a runner — so an agent can start a build (and run a ticket
      # through the whole pipeline) without a person clicking for it.
      - name: Notify Claude (start a build)
        if: inputs.notify != ''
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: node scripts/board-tickets.mjs ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} --notify "${{ inputs.notify }}" --yes

      # Always say where things stand, so the run's log answers "is the
      # board current?" without anyone opening it.
      - name: Where the board stands
        if: always()
        working-directory: dsp-integration
        env:
          BOARD_API_KEY: ${{ secrets.BOARD_API_KEY }}
        run: node scripts/board-tickets.mjs ${{ inputs.project != '' && format('--project "{0}"', inputs.project) || '' }} --inspect

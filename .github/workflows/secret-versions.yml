name: Secret versions (report / destroy unused)

# Secret Manager bills every version of a secret that hasn't been destroyed
# ("Secret version replica storage" — A$39.55 of September's bill, rising
# daily). See backlog-tracker/scripts/prune-secret-versions.sh for exactly
# what is kept. `report` (the default) changes nothing; `destroy` needs the
# word DESTROY typed in `confirm`, because destroying a version can't be
# undone.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report (read-only) or destroy'
        type: choice
        options: [report, destroy]
        default: report
      confirm:
        description: 'Type DESTROY to allow mode=destroy'
        type: string
        default: ''

concurrency:
  group: secret-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse destroy without confirmation
        if: inputs.mode == 'destroy' && inputs.confirm != 'DESTROY'
        run: |
          echo "::error title=Not confirmed::mode=destroy needs confirm=DESTROY. Run with mode=report to see what would go."
          exit 1

      - name: Authenticate as the deploy service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet

      - name: ${{ inputs.mode }}
        run: bash backlog-tracker/scripts/prune-secret-versions.sh "${{ inputs.mode }}"

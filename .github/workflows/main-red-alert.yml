name: Main red alert

# Says out loud when a train test suite fails on main, and closes the alert
# when it passes again.
#
# On 21 Oct 2026 a workflow was pushed straight to main without its
# TRAIN_TEST_WORKFLOWS line (0db46cc). "Rules & MCP server tests" went red
# on main at 03:29 and stayed red for three hours with nobody told. Every
# train that took main inherited the failure: DSP's approved deploy was held,
# a Backlog Tracker ticket went red, and Staff Kanban's deploy was blamed.
# A red main affects every project, so it gets an issue (which emails the
# repo's watchers) rather than a line in a log nobody reads.
on:
  workflow_run:
    workflows: ["Rules & MCP server tests", "e2e-quick", "Retail Media Insights tests", "Staff Kanban tests"]
    types: [completed]
    branches: [main]

permissions:
  issues: write

concurrency:
  group: main-red-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  alert:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Main is red: $WF"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          case "$CONCLUSION" in
            failure|timed_out|startup_failure)
              body="**$WF** failed on \`main\` at ${SHA:0:7}: $URL

          Every deployment train that takes main now fails the same test, and an approved Deploy to Main is held until main is fixed. Fix it on main first. Once main is green, a held deploy takes main and re-tests by itself (\`heldDeployMainPlan\` in \`backlog-tracker/scripts/run-backlog-automation.js\`).

          This issue closes itself when $WF passes on main again."
              if [ -n "$open" ]; then
                gh issue comment "$open" --body "Still red at ${SHA:0:7}: $URL"
              else
                gh issue create --title "$title" --body "$body"
              fi ;;
            success)
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "Green again on main at ${SHA:0:7}: $URL"
              fi ;;
            *) echo "conclusion $CONCLUSION: nothing to do" ;;
          esac

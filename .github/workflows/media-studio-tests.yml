name: Media Studio tests

# Runs media-studio/'s own suite: every provider contract (Nano Banana Pro,
# Veo 3.1, LTX 2.5), the WordPress upload, the HTTP API and its security
# checks, all against scripted responses — no keys, no network, no credit.
#
# Like the other train suites it runs on a PR, on the project's train branch
# and when run-backlog-automation.js dispatches it (TRAIN_TEST_WORKFLOWS).
on:
  pull_request:
    paths:
      - 'media-studio/**'
      - '.github/workflows/media-studio-tests.yml'
  push:
    branches: [deploy/media-studio]
    paths:
      - 'media-studio/**'
  workflow_dispatch:

concurrency:
  group: media-studio-tests-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: media-studio-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is there a package to test?
        id: scope
        run: |
          if [ -f media-studio/package.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No media-studio/package.json on this ref: nothing to test."; fi

      - name: Provider, API and security tests
        if: steps.scope.outputs.run == 'true'
        working-directory: media-studio
        run: npm test

  # Same as the other train suites: a finished non-PR run starts the backlog
  # automation so a train verdict is read straight away. Its own job, so the
  # tests never hold a token that can start workflows.
  wake-automation:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the backlog automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backlog-automation.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::Couldn't start the backlog automation; its schedule picks this run up instead."

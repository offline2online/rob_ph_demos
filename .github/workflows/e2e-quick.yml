# E2E quick — every push to the DSP train and every PR to main (E2E Testing
# Strategy §3.6, ticket mY3f2jq9nml5yK3oLOjJ). Typecheck and the full suites,
# Runs 1–5 included (apps/api/test/e2e), then the Run 6 journey. Results JSON
# is uploaded as an artifact for report-e2e.
#
# "e2e-quick" is a required check on main (repository ruleset, PRs only), so
# it must report on EVERY pull request: a PR that doesn't touch
# dsp-integration/ or this file gets a passing no-op instead of a check that
# never starts. A path filter on the trigger would leave such PRs blocked.
name: e2e-quick

on:
  push:
    branches: [deploy/dsp-integration]
    paths: ['dsp-integration/**', '.github/workflows/e2e-quick.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run the backlog automation dispatches when a ticket lands on the train
# gets its own group (per commit), so the next ticket landing a minute later
# no longer cancels it: on 7 Oct 2026 two tickets' runs were cancelled that
# way and the failure that stuck PR #337 could not be pinned on either. Push
# and PR runs still cancel their superseded predecessors.
concurrency:
  group: e2e-quick-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-quick:
    name: e2e-quick
    runs-on: ubuntu-latest
    # 30, not 15 (11 Oct 2026): the full suites alone had grown to ~13 min,
    # green runs were finishing in 14m46s, and PR #363's train sat blocked
    # for two hours while run after run hit the 15-minute limit. GitHub
    # reports that limit as "cancelled", which the backlog automation reads
    # as "nothing tested this commit" and dispatches again, so every run
    # that hit the limit was retried and hit it again.
    # 45, not 30 (23 Oct 2026): the full suites alone took 25m45s on main
    # d570da38 and the run was cancelled installing Chromium after them.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read   # the scope step lists the PR's files
      actions: read         # ...and reads the e2e-quick runs on the head's parent
    defaults:
      run:
        working-directory: dsp-integration
    env:
      PH_SECRETS_KEY: ${{ secrets.PH_TEST_SECRETS_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
    steps:
      - name: Does this change touch dsp-integration?
        id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate -q '.[].filename')
          if ! echo "$files" | grep -qE '^(dsp-integration/|\.github/workflows/e2e-quick\.yml$)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No dsp-integration/ changes in this PR, so e2e-quick passes without running."
            exit 0
          fi
          # The DSP train PR's head is nearly always "Rebuild the hosted
          # prototype", pushed by dsp-prototype.yml on top of the commit the
          # train already tested. Running the whole suite again on it held
          # every DSP deploy for another ~27 minutes (PR #462, 23 Oct 2026)
          # for a commit that changes no code the suite runs. It passes
          # without running only when ALL of these hold, else it runs as usual:
          #   - the head has one parent and changes only generated build
          #     output (dsp-integration/prototype/, apps/admin/public/demo/);
          #   - the parent already contains this PR's base, so the merge
          #     being checked is the parent's tree plus that output;
          #   - e2e-quick passed on the parent in a push or dispatched run
          #     (those always run the full suite).
          R="${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          rebuild_of_tested_parent() {
            local parents parent changed count status passed
            parents=$(gh api "repos/$R/commits/$HEAD_SHA" -q '.parents | length') || return 1
            [ "$parents" = "1" ] || return 1
            parent=$(gh api "repos/$R/commits/$HEAD_SHA" -q '.parents[0].sha') || return 1
            changed=$(gh api "repos/$R/compare/$parent...$HEAD_SHA" -q '.files[].filename') || return 1
            count=$(echo "$changed" | grep -c . || true)
            # The compare API lists at most 300 files: a longer list can't be checked.
            [ "$count" -gt 0 ] && [ "$count" -lt 300 ] || return 1
            ! echo "$changed" | grep -qvE '^dsp-integration/(prototype/|apps/admin/public/demo/)' || return 1
            status=$(gh api "repos/$R/compare/$BASE_SHA...$parent" -q '.status') || return 1
            case "$status" in ahead|identical) ;; *) return 1 ;; esac
            passed=$(gh api "repos/$R/actions/workflows/e2e-quick.yml/runs?head_sha=$parent&status=success&per_page=20" \
              -q '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length') || return 1
            [ "${passed:-0}" -gt 0 ] || return 1
            echo "::notice::The head ${HEAD_SHA:0:7} only rebuilds the hosted prototype on ${parent:0:7}, which already passed e2e-quick and contains main, so this passes without running again."
          }
          if rebuild_of_tested_parent; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsp-integration/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --no-audit --no-fund --loglevel=error
      # The handover documents mirrored to the PH Agent Console: every part
      # under the board's 20,000-character cap, every marker heading present.
      # Before this (18 Oct 2026) three mirrors went over after a merge and
      # the board refused them in dsp-board's post-merge run instead.
      - name: Board mirrors fit the board
        if: steps.scope.outputs.run == 'true'
        run: npm run board:sync -- --check-cut
      - if: steps.scope.outputs.run == 'true'
        run: npm run typecheck
      - name: Full suites (api, admin, campaign-approval, dsp-mocks; Runs 1–5 included)
        if: steps.scope.outputs.run == 'true'
        run: npm test
      # Visual layout check (ticket A3QkqCjHRP58R0lSAtKM): every admin page at
      # tablet and desktop, alignment rules + (once baselines are enforced)
      # screenshots. Part of this required check, so a misalignment blocks
      # Deploy to Main like any other red test.
      - name: Install Chromium for the layout check
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Visual layout check (tablet + desktop)
        if: steps.scope.outputs.run == 'true'
        run: npm run test:layout
      - name: Runs 1–5 as JSON (results/e2e-quick.json)
        if: steps.scope.outputs.run == 'true'
        run: npm run e2e:quick
      # The journey used to run only in e2e-nightly, after a train had merged,
      # so four breaking changes shipped and came back as test-only tickets.
      - name: Run 6 — full journey (results/journey-*.json)
        if: steps.scope.outputs.run == 'true'
        run: npm run e2e:journey
      - name: it.fails markers reference a ticket
        if: steps.scope.outputs.run == 'true'
        run: npm run e2e:lint
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: e2e-quick-results-${{ github.sha }}
          path: |
            dsp-integration/results/
            dsp-integration/apps/admin/test-results/
          if-no-files-found: ignore

  # The backlog automation acts on this run's result: a train ticket's
  # verdict, a check on main before a ticket is sent back. GitHub runs the
  # automation's */2 schedule as rarely as once an hour when it is busy, so a
  # finished run starts it straight away (26 Oct 2026: a red ticket's verdict
  # sat unread for 25 minutes, and a passed one kept its ticket from being
  # approved). workflow_dispatch is the one event this run's GITHUB_TOKEN may
  # start. Pull request runs judge no ticket. Its own job, so the tests never
  # hold a token that can start workflows.
  wake-automation:
    needs: e2e-quick
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the backlog automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backlog-automation.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::Couldn't start the backlog automation; its schedule picks this run up instead."

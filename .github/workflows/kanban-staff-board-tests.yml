name: Staff Kanban tests

# Runs kanban-staff-board/test: the Playwright end-to-end suite (25 cases,
# kanban-staff-board/docs/E2E-TEST-PLAN.md) against the prototype. Triggered by
# pull requests that touch the folder (a train PR from deploy/kanban-staff-board
# included) and on demand. It is deliberately not branch-triggered: the train
# automation would have to dispatch it (TRAIN_TEST_WORKFLOWS in
# backlog-tracker/scripts/run-backlog-automation.js), which is a follow-up
# ticket on the Kanban Staff Board project.
on:
  pull_request:
    paths:
      - 'kanban-staff-board/**'
      - '.github/workflows/kanban-staff-board-tests.yml'
  workflow_dispatch:

# A run the backlog automation dispatches when a ticket lands on a train gets
# its own group (per commit), like e2e-quick, firestore-rules-test and the
# Retail Media Insights suite. Keyed on the branch alone (until 23 Oct 2026),
# the next ticket landing cancelled the previous ticket's run, and that card
# read "Staff Kanban tests: not run" for good: nothing re-runs a cancelled
# run, and approving it then needed acknowledgeTests.
concurrency:
  group: kanban-staff-board-tests-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: kanban-staff-board-tests
    runs-on: ubuntu-latest
    # 30, not 15 (23 Oct 2026): green runs take 10-12 minutes (setup plus six
    # Chromium profiles, four at a time) and a slow runner went past 15. GitHub
    # reports that limit as "cancelled", which the board reads as "not run".
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kanban-staff-board/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        # Pinned to the version in package.json; the folder has no lockfile.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm test

  # The backlog automation acts on this run's result: a train ticket's
  # verdict, a check on main before a ticket is sent back. GitHub runs the
  # automation's */2 schedule as rarely as once an hour when it is busy, so a
  # finished run starts it straight away (26 Oct 2026: a red ticket's verdict
  # sat unread for 25 minutes, and a passed one kept its ticket from being
  # approved). workflow_dispatch is the one event this run's GITHUB_TOKEN may
  # start. Pull request runs judge no ticket. Its own job, so the tests never
  # hold a token that can start workflows.
  wake-automation:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the backlog automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backlog-automation.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::Couldn't start the backlog automation; its schedule picks this run up instead."

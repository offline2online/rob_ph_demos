name: Rules & MCP server tests

# Runs backlog-tracker/firestore.rules — the real file — against the Firestore
# emulator and asserts what each principal may and may not write, and runs
# backlog-tracker/test/mcp-server.test.js and mcp-client.test.mjs, which drive
# the MCP server's OAuth and tool surface end to end — the first in-process
# against stubbed Firebase SDKs, the second with the real MCP client SDK over
# real HTTP. Same reasoning for all three: they are the access-control layer,
# and the rest of the pipeline's harness stubs the database in a way that
# permits everything.
#
# This exists because of a specific production failure. The deployment train
# shipped with a rules bug that took Deploy to Main out of service: every
# train field was guarded as "unchanged unless the writer bypasses rules", on
# the assumption that all train writes come from run-backlog-automation.js
# through the Firebase service account. But `trainReady` — the single signal
# that starts a deploy — is written by the Notify Claude Routine, which signs
# in as the board automation USER and IS subject to rules. It got
# PERMISSION_DENIED, nothing was dispatched, and cards sat in Approved for
# Deployment while the button spun and reverted.
#
# Nothing caught it: the pipeline's end-to-end harness stubs Firestore, so it
# validates every stage against a database that permits everything. Rules were
# the one part shipped on reasoning alone.
#
# On a pull request this is also the first real status check this repo has, so
# it is what run-backlog-automation.js's processDeployTrain now actually waits
# on before merging a train (see its rollupState) — broken rules fail the
# check and the train refuses to merge, instead of shipping and breaking the
# board.
on:
  pull_request:
    paths:
      - 'backlog-tracker/firestore.rules'
      - 'backlog-tracker/functions/mcp-server.js'
      - 'backlog-tracker/public/**'
      - 'backlog-tracker/test/**'
      - '.github/workflows/firestore-rules-test.yml'
  push:
    branches: [main]
    paths:
      - 'backlog-tracker/firestore.rules'
      - 'backlog-tracker/functions/mcp-server.js'
      - 'backlog-tracker/public/**'
      - 'backlog-tracker/test/**'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firestore-rules-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backlog-tracker/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backlog-tracker/test/package-lock.json

      # The Firestore emulator is a Java process; ubuntu-latest ships a JDK,
      # but pin one so a runner image change can't silently break this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      # Split out from `npm test` so a failure names which layer broke: the
      # MCP suite needs neither the emulator nor Java, so if it fails the
      # emulator setup above is not the suspect.
      - name: Run MCP server tests
        run: npm run test:mcp

      # The real @modelcontextprotocol/sdk client against the real server over
      # HTTP — this is what catches a discovery document or a transport detail
      # an in-process test would never exercise.
      - name: Run MCP client integration test
        run: npm run test:client

      # The console's own start-up: imports the real public/js/app.js under
      # a stub DOM and fails if module evaluation stops early, then clicks
      # every hamburger-menu item. Added after 25 Sep 2026, when one
      # top-level call placed above a const declaration threw at start-up,
      # skipped every handler registered after it, and left the menu dead on
      # every device while the board still rendered — nothing in the
      # pipeline had executed app.js. `backlog-tracker/public/**` is in the
      # paths above for this step, so a train PR carrying such a change goes
      # red here and processDeployTrain refuses to merge it. No emulator, no
      # network.
      - name: Run console start-up smoke test
        run: npm run test:app-boots

      - name: Run rules tests against the emulator
        run: npm run test:rules

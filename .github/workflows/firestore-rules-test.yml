name: Firestore rules tests

# Runs backlog-tracker/firestore.rules — the real file — against the Firestore
# emulator and asserts what each principal may and may not write.
#
# This exists because of a specific production failure. The deployment train
# shipped with a rules bug that took Deploy to Main out of service: every
# train field was guarded as "unchanged unless the writer bypasses rules", on
# the assumption that all train writes come from run-backlog-automation.js
# through the Firebase service account. But `trainReady` — the single signal
# that starts a deploy — is written by the Notify Claude Routine, which signs
# in as the board automation USER and IS subject to rules. It got
# PERMISSION_DENIED, nothing was dispatched, and cards sat in Approved for
# Deployment while the button spun and reverted.
#
# Nothing caught it: the pipeline's end-to-end harness stubs Firestore, so it
# validates every stage against a database that permits everything. Rules were
# the one part shipped on reasoning alone.
#
# On a pull request this is also the first real status check this repo has, so
# it is what run-backlog-automation.js's processDeployTrain now actually waits
# on before merging a train (see its rollupState) — broken rules fail the
# check and the train refuses to merge, instead of shipping and breaking the
# board.
on:
  pull_request:
    paths:
      - 'backlog-tracker/firestore.rules'
      - 'backlog-tracker/test/**'
      - '.github/workflows/firestore-rules-test.yml'
  push:
    branches: [main]
    paths:
      - 'backlog-tracker/firestore.rules'
      - 'backlog-tracker/test/**'
      - '.github/workflows/firestore-rules-test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firestore-rules-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backlog-tracker/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backlog-tracker/test/package-lock.json

      # The Firestore emulator is a Java process; ubuntu-latest ships a JDK,
      # but pin one so a runner image change can't silently break this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Run rules tests against the emulator
        run: npm test

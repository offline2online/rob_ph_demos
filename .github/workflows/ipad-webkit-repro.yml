name: iPad WebKit repro (Staff Kanban sidebar)
on:
  push:
    branches: [claude/ipad-webkit-repro]
jobs:
  webkit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backlog-tracker/test } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - name: iPad sidebar tap
        run: node ui/ipad-webkit.mjs
        env: { HARNESS_BROWSER: webkit }
        continue-on-error: true
      - name: Full Staff Kanban suite in WebKit
        run: node ui/staff-kanban.test.mjs
        env: { HARNESS_BROWSER: webkit }
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ipad-webkit-screens, path: backlog-tracker/test/ui/out/ }

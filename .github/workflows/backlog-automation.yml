name: Backlog automation (apply patches / merge approved PRs)

# Turns work the "Notify Claude" Routine has already finished into a real
# branch + PR (backlogItems.patchReady), and merges a PR the Routine has
# already confirmed is green (backlogItems.mergeReady) — see
# backlog-tracker/scripts/run-backlog-automation.js for the full story of
# why this exists as a separate, scheduled, non-AI job rather than having
# the Routine's own Claude Code session push/merge directly: that session
# is fired from data (backlogItems.desc) anyone can write to Firestore
# unauthenticated, so it never gets a real GitHub credential — this job,
# running on a normal trusted GitHub-hosted runner with its own per-run
# GITHUB_TOKEN, does the actual pushing/merging instead.
on:
  schedule:
    # Every 2 minutes, not every 10 — a patch-ready item previously sat in
    # Backlog for up to ~10 minutes (average ~5) after the Notify Claude
    # Routine had already finished and set patchReady:true, purely waiting
    # on this schedule to actually open its PR and flip status to
    # ready-for-testing; the Routine session itself was never the slow
    # part. This job is cheap when idle (a few seconds — "Found 0
    # patch-ready item(s)" and done), and the concurrency group below
    # already makes a busier run safe to overlap with the next tick, so
    # there's no real cost to polling this often.
    - cron: '*/2 * * * *'
  # Fired by backlog-tracker/functions/index.js's
  # onBacklogItemReadyForAutomation the moment an item's patchReady or
  # mergeReady flips to true, so a ready item waits seconds instead of
  # however long GitHub decides the schedule above should actually take
  # (measured: up to 12 minutes). The schedule stays as the safety net for
  # whenever that function's token is missing or its call fails — this is
  # strictly an earlier start, never a replacement. The job re-reads every
  # flagged item from Firestore itself, so the dispatch payload is
  # diagnostic only and can't aim this trusted job at an item that isn't
  # genuinely ready.
  repository_dispatch:
    types: [backlog-automation]
  workflow_dispatch: {}

# Without this, a run that takes longer than 2 minutes (several
# patch-ready items in one pass: git fetch/push, gh pr create, gh pr merge
# each has real network latency) overlaps with the next scheduled run, and
# both processes can query Firestore for the same patchReady/mergeReady
# item before either has cleared its flag — both see it as unprocessed and
# both act on it. This is the structural version of the duplicate-PR bug
# fixed in run-backlog-automation.js's findExistingPrForItem() guard: that
# guard closes the gap for a *single* run re-processing a stray flag left
# over from earlier, this closes the gap for *two runs racing each other*
# in the first place. `cancel-in-progress: false` queues an overlapping
# run instead of killing one mid-push/mid-merge, which could otherwise
# leave a branch pushed with no PR, or a merge half-done.
concurrency:
  group: backlog-automation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Needed so a merge done here can explicitly dispatch
  # deploy-backlog-tracker.yml — a push made with this workflow's own
  # GITHUB_TOKEN does not trigger other workflows' `on: push` (GitHub's
  # anti-recursion protection), so the deploy would otherwise silently
  # never run. See run-backlog-automation.js's processMergePr.
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # `secrets` can't be read in a step's `if`, so the presence check is
      # evaluated here (job-level env may reference secrets) and the mint
      # step below keys off it.
      WORKFLOW_APP_CONFIGURED: ${{ secrets.WORKFLOW_APP_ID != '' && secrets.WORKFLOW_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The board's Firestore rules require a signed-in editor, so the script
      # authenticates as the same service account the deploy workflow uses.
      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKLOG_TRACKER }}' > "$RUNNER_TEMP/firebase-sa.json"

      # Optional: a short-lived installation token from the workflow-push
      # GitHub App (see backlog-tracker/README.md → "The workflow-push
      # GitHub App"). The run's own GITHUB_TOKEN can never push a file
      # under .github/workflows/; this token can, and the script uses it
      # for nothing else (see WORKFLOW_PUSH_TOKEN in
      # run-backlog-automation.js for the guardrails). The App is installed
      # on this one repository only, and `repositories:` below pins the
      # minted token to it again regardless of how the App is installed.
      # Skipped entirely when the two secrets are absent, in which case
      # workflow-touching items are refused with a note, as before.
      - name: Mint workflow-push token (only if the App is configured)
        id: workflow-app
        if: env.WORKFLOW_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: offline2online
          repositories: rob_ph_demos
          permission-contents: write
          permission-workflows: write

      - name: Apply patch-ready items / merge merge-ready items
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PUSH_TOKEN: ${{ steps.workflow-app.outputs.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          # Read by recordPipelineHealth() in run-backlog-automation.js for
          # the board's own health strip (YeCj7sNpHXFUZQhmAmEb) — `secrets`
          # can't be referenced directly from Node, only from workflow YAML,
          # so its mere presence (not the token itself) is passed through.
          GH_DISPATCH_TOKEN_PRESENT: ${{ secrets.GH_DISPATCH_TOKEN != '' }}
        run: node backlog-tracker/scripts/run-backlog-automation.js

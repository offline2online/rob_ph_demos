<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Your Own RMN launch</title>
<style>
@font-face{font-family:"Kantumruy Pro";font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,{{K400}}) format("woff2")}
@font-face{font-family:"Kantumruy Pro";font-style:normal;font-weight:600;font-display:block;src:url(data:font/woff2;base64,{{K600}}) format("woff2")}
@font-face{font-family:"Kantumruy Pro";font-style:normal;font-weight:700;font-display:block;src:url(data:font/woff2;base64,{{K700}}) format("woff2")}

/* ph-brand dark surface tokens */
:root{
  --paper:#0F1424; --surface:#171E33; --ink:#E9EDF6; --muted:#A3ACC0; --line:#2A3350;
  --teal:#169BC2; --pink:#EF60A7; --green:#60D838; --orange:#FE9226;
  --font:"Kantumruy Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#070a14;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
body.render{background:var(--paper)}

/* Fixed 1080 x 1350 (4:5) design size */
#stage{position:relative;width:1080px;height:1350px;background:var(--paper);overflow:hidden;--a:var(--teal)}
.bar{position:absolute;left:0;top:0;width:100%;height:12px;background:var(--a)}
.logo{position:absolute;left:88px;top:92px;height:64px;width:auto}

/* One sentence per slide, every slide anchored to the same top */
.scene{position:absolute;left:88px;top:420px;width:904px;visibility:hidden}
.rule{width:128px;height:12px;border-radius:6px;background:var(--sa);transform-origin:left center;margin-bottom:56px}
.line{margin:0;font-size:140px;line-height:1.02;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.w{display:inline-block;will-change:transform,opacity}
.go{display:flex;align-items:center;justify-content:center;width:168px;height:168px;margin-top:72px;border-radius:50%;background:var(--orange);color:#0F1424}
.go svg.ic{display:block;width:104px;height:104px;fill:currentColor}

/* Preview player (not rendered into the video) */
.player{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px 32px}
.frame{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 30px 70px -40px rgba(0,0,0,.9)}
.frame #stage{transform-origin:top left}
.controls{display:flex;align-items:center;gap:12px;width:100%;max-width:540px;color:var(--muted);font-size:14px}
.controls button{font:inherit;font-weight:600;color:#0F1424;background:var(--ink);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.controls input{flex:1;accent-color:var(--teal)}
.controls output{min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
body.render .player{display:block;padding:0}
body.render .controls{display:none}
body.render .frame{border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div class="player">
<div class="frame" id="frame">
<div id="stage">
  <div class="bar"></div>
  <img class="logo" src="{{LOGO}}" alt="Personalisation Hub">

  <section class="scene" id="s1" style="--sa:var(--teal)"><div class="rule"></div><h1 class="line">Going out on your own?</h1></section>
  <section class="scene" id="s2" style="--sa:var(--pink)"><div class="rule"></div><h2 class="line">AI is your team now.</h2></section>
  <section class="scene" id="s3" style="--sa:var(--green)"><div class="rule"></div><h2 class="line">Run your own retail media network.</h2></section>
  <section class="scene" id="s4" style="--sa:var(--teal)"><div class="rule"></div><h2 class="line">Without the upfront cost.</h2></section>
  <section class="scene" id="s5" style="--sa:var(--orange)"><div class="rule"></div><h2 class="line">Link in comments.</h2><div class="go" id="go">{{icon:arrow_downward}}</div></section>
</div>
</div>
<div class="controls">
  <button type="button" id="play">Pause</button>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position">
  <output id="time">0.0s</output>
</div>
</div>

<script>
(function(){
  /* Slide timings in seconds. The last slide holds to the end. */
  var SCENES = [
    {id:'s1', start:0.0, a:'#169BC2'},
    {id:'s2', start:2.3, a:'#EF60A7'},
    {id:'s3', start:4.5, a:'#60D838'},
    {id:'s4', start:7.2, a:'#169BC2'},
    {id:'s5', start:9.4, a:'#FE9226'}
  ];
  var DURATION = 13.0, WORD_GAP = 0.08, WORD_IN = 0.42, OUT = 0.28;
  SCENES.forEach(function(s,i){ s.end = i < SCENES.length-1 ? SCENES[i+1].start : DURATION; });

  /* Split each sentence into words so they can punch in one after another */
  SCENES.forEach(function(s){
    s.el = document.getElementById(s.id);
    s.rule = s.el.querySelector('.rule');
    var line = s.el.querySelector('.line');
    var words = line.textContent.trim().split(/\s+/);
    line.innerHTML = words.map(function(w){ return '<span class="w">'+w+'</span>'; }).join(' ');
    s.words = Array.prototype.slice.call(line.querySelectorAll('.w'));
    s.go = s.el.querySelector('.go');
  });
  var stage = document.getElementById('stage');

  function clamp(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function eo(t){ return 1 - Math.pow(1-t,4); }
  function ei(t){ return t*t*t; }
  function rgb(h){ return [1,3,5].map(function(i){ return parseInt(h.substr(i,2),16); }); }
  function mix(a,b,t){ var A=rgb(a),B=rgb(b); return 'rgb('+A.map(function(v,i){ return Math.round(v+(B[i]-v)*t); }).join(',')+')'; }

  function renderAt(t){
    /* the top bar follows the slide's single accent, easing across each cut */
    var acc = SCENES[0].a;
    SCENES.forEach(function(s){ if (t >= s.start) acc = s.a; });
    for (var i=1;i<SCENES.length;i++){
      var b = SCENES[i].start;
      if (t > b-0.2 && t < b+0.2) acc = mix(SCENES[i-1].a, SCENES[i].a, eo(clamp((t-(b-0.2))/0.4)));
    }
    stage.style.setProperty('--a', acc);

    SCENES.forEach(function(s, idx){
      var last = idx === SCENES.length-1;
      var on = t >= s.start && (last || t < s.end);
      s.el.style.visibility = on ? 'visible' : 'hidden';
      if (!on) return;
      var local = t - s.start;
      var out = last ? 0 : ei(clamp((t-(s.end-OUT))/OUT));
      var shift = -out*48;
      /* accent rule draws first */
      var r = eo(clamp(local/0.3));
      s.rule.style.transform = 'translateY('+shift.toFixed(2)+'px) scaleX('+r.toFixed(4)+')';
      s.rule.style.opacity = (1-out).toFixed(4);
      /* then the words punch up, one after another */
      s.words.forEach(function(w,k){
        var p = eo(clamp((local-0.08-k*WORD_GAP)/WORD_IN));
        w.style.opacity = (p*(1-out)).toFixed(4);
        w.style.transform = 'translateY('+((1-p)*90 + shift).toFixed(2)+'px)';
      });
      /* the orange arrow on the last slide pops in, then nudges down towards the comments */
      if (s.go){
        var g = eo(clamp((local-0.55)/0.4)), bt = local - 1.0;
        var bob = bt > 0 ? 12*Math.max(0, Math.sin(2*Math.PI*bt/1.0)) : 0;
        s.go.style.opacity = g.toFixed(4);
        s.go.style.transform = 'translateY('+bob.toFixed(2)+'px) scale('+(0.8+0.2*g).toFixed(4)+')';
      }
    });
  }

  window.renderAt = renderAt;
  window.DURATION = DURATION;
  window.SCENES = SCENES.map(function(s){ return {id:s.id, start:s.start, end:s.end}; });

  /* Render mode: the capture script drives renderAt frame by frame */
  if (/[?&]render\b/.test(location.search)){ document.body.classList.add('render'); renderAt(0); return; }

  /* Preview mode: fit the stage to the window and play on a loop */
  var frame = document.getElementById('frame'), btn = document.getElementById('play'),
      scrub = document.getElementById('scrub'), out = document.getElementById('time');
  function fit(){
    var s = Math.min(1, (window.innerWidth-32)/1080, (window.innerHeight-120)/1350);
    stage.style.transform = 'scale('+s+')';
    frame.style.width = (1080*s)+'px'; frame.style.height = (1350*s)+'px';
  }
  fit(); window.addEventListener('resize', fit);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var playing = !reduce, t0 = performance.now(), pos = reduce ? 6.5 : 0;
  function show(t){ renderAt(t); scrub.value = Math.round(t/DURATION*1000); out.textContent = t.toFixed(1)+'s'; }
  function tick(now){
    if (playing){ pos = ((now - t0)/1000) % DURATION; show(pos); }
    requestAnimationFrame(tick);
  }
  btn.textContent = playing ? 'Pause' : 'Play';
  btn.addEventListener('click', function(){
    playing = !playing; btn.textContent = playing ? 'Pause' : 'Play';
    if (playing) t0 = performance.now() - pos*1000;
  });
  scrub.addEventListener('input', function(){
    pos = scrub.value/1000*DURATION; t0 = performance.now() - pos*1000; show(pos);
  });
  show(pos);
  document.fonts.ready.then(function(){ requestAnimationFrame(tick); });
})();
</script>
</body>
</html>

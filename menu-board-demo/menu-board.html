<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* These are pre-fetch defaults only — every real Offer Board template
       (menuboard/brands' own templates[].colors) already uses KFC's actual
       red/black/white scheme; applyColorScheme() overwrites these the
       moment brand data loads. Kept in KFC's own palette (not a generic
       placeholder colour) so the two screens that render before that fetch
       resolves — the initial "Loading…" state and the invalid-URL error
       screen below — are never off-brand, and so there's no colour flash
       once the real template data arrives. */
    :root {
      --green:            #e4002b;
      --green-dark:       #a3001a;
      --green-light:      #fbe1df;
      --cream:            #f9f4ec;
      --cream2:           #f0e9dc;
      --white:            #ffffff;
      --text:             #1a1a1a;
      --text2:            #444444;
      --border:           #d4c8b8;
      --border-lt:        #e8dfd3;
      --danger:           #c0392b;
      --board-header-bg:  #ffffff;
      --cat-bar-bg:       #e4002b;
      --price-color:      #e4002b;
      --item-color:       #1a1a1a;  /* item name text — set from colors.text */
      --item-text:        #1a1a1a;  /* hero item name text — set from colors.text */
      --item-bg:          #ffffff;  /* item card background */
      --item-desc:        #444444;  /* short description / secondary item text */
      --header-text:      #e4002b;
      --clock-text:       #1e293b;
      --clock-bg:         #f0f4f8;  /* clock bar background */
      --accent:           #e4002b;  /* explicit accent var (mirrors --green) */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── BOARD WRAPPER ─────────────────────── */
    .board {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--cream);
    }

    /* ── HEADER ────────────────────────────── */
    /* Fixed header bar height — uses vmin (the smaller of width/height) rather
       than vw, so a screen showing the same physical panel rotated between
       landscape and portrait renders an identical header height in both. This
       is set once here and intentionally NOT overridden per orientation or
       per template, so every menu board has a matching header height. */
    .board-header {
      background: var(--board-header-bg, #ffffff);
      border-bottom: 3px solid var(--green);
      height: 175px;
      padding: 0 clamp(20px, 4vw, 60px);
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Icon fills the full height of the header bar (between its top/bottom padding) */
    .header-logo-wrap {
      width: clamp(64px, 9vw, 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-logo-wrap img {
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      width: auto;
      object-fit: contain;
    }
    .header-logo-wrap.no-logo {
      width: clamp(64px, 9vw, 130px);
    }

    .header-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      color: var(--header-text);
    }
    .header-brand {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(20px, 4vw, 56px);
      font-weight: 700;
      letter-spacing: clamp(2px, 0.5vw, 8px);
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--header-text);
    }
    .board.portrait .header-brand {
      font-size: clamp(28px, 5vw, 72px);
    }
    .header-menu-type {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(14px, 2.5vw, 36px);
      font-weight: 500;
      letter-spacing: clamp(3px, 0.8vw, 12px);
      text-transform: uppercase;
      color: var(--header-text);
      margin-top: clamp(2px, 0.4vw, 6px);
    }
    .board.portrait .header-menu-type {
      font-size: clamp(18px, 3vw, 44px);
    }

    /* ── CLOCK BAR ─────────────────────────── */
    .clock-bar {
      background: var(--clock-bg, #f0f4f8);
      border-top: 1px solid var(--clock-bg, #dde5ee);
      border-bottom: 1px solid var(--clock-bg, #dde5ee);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(6px, 1vw, 12px) clamp(20px, 4vw, 60px);
      flex-shrink: 0;
    }
    .board.portrait .clock-bar {
      padding: clamp(10px, 1.5vw, 20px) clamp(24px, 4.5vw, 70px);
    }
    .board.landscape .clock-bar {
      padding: clamp(8px, 1vw, 14px) clamp(20px, 4vw, 60px);
    }
    .clock-bar .store-label {
      font-size: clamp(10px, 1.1vw, 14px);
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .clock-bar .time-display {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(15px, 1.8vw, 26px);
      color: var(--clock-text, #1e293b);
      letter-spacing: 1px;
    }
    .board.landscape .clock-bar .time-display {
      font-size: clamp(20px, 2.4vw, 38px);
      letter-spacing: 1.5px;
    }
    .clock-bar .greeting-text {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(18px, 2.1vw, 31px);
      font-weight: 700;
      color: var(--clock-text, #1e293b);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-right: auto; /* pushes .time-display to the far right */
    }
    .board.landscape .clock-bar .greeting-text {
      font-size: clamp(25px, 3.1vw, 48px);
    }
    /* Personalised greeting on Feature Hero Spotlight: no clock sharing the
       row, so the greeting is centred and spans the full bar width instead
       of being left-aligned against a right-aligned clock. */
    .clock-bar-personalised {
      justify-content: center;
    }
    .clock-bar-personalised .greeting-text {
      margin-right: 0;
      text-align: center;
    }
    /* Mock-mode badge — visible only when ?mockapi= is set in the URL */
    .mock-badge {
      font-family: 'Oswald', monospace;
      font-size: 11px;
      font-weight: 700;
      background: #f59e0b;
      color: #000;
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 10px;
      letter-spacing: 1px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ── ITEMS SECTION ─────────────────────── */
    .board-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--cream);
    }

    /* Category section label — kept for colour-scheme compatibility but hidden */
    .cat-header { display: none; }

    /* Category badge — floats over the top-left corner of each card's photo.
       Position/shape is fixed here; background/colour/font-size/border/
       text-case come from the 'category' Badge Template instead, applied
       inline (see catBadgeStyleAttr()) — previously this always matched
       the brand's own accent colour; now every brand uses the one fixed
       Category Badge style from Settings. */
    .item-cat-badge {
      position: absolute;
      top: clamp(8px, 1vw, 16px);
      left: clamp(8px, 1vw, 16px);
      z-index: 2;
      display: inline-block;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Card grid — column count/row tracks are set per-page from JS (dynStyle) */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(10px, 1.2vw, 22px);
      padding: clamp(10px, 1.2vw, 22px);
      height: 100%;
      overflow: hidden;
    }
    .board.portrait .items-grid { grid-template-columns: repeat(3, 1fr); }
    .board.landscape .items-grid { grid-template-columns: repeat(5, 1fr); }

    /* Card — hero photo on top, details below */
    .item-cell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--item-bg, var(--white));
      border-radius: clamp(8px, 1vw, 16px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    .item-cell.oos-cell { background: #fdf8f5; }

    /* Thumb takes all the flexible space and shrinks first — the text/price
       below it must never be pushed out, so it keeps its natural size. */
    .item-thumb {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #f5f0e8;
    }
    .item-thumb img, .item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .item-thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 3vw, 42px);
      color: var(--border);
    }

    /* Body — name, description, divider, footer (price + category badge) */
    /* Sized to its own content (never shrunk) so the name/price are always
       fully visible — .item-thumb above absorbs all the squeeze instead. */
    .item-body {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 1vw, 24px) clamp(10px, 1.3vw, 26px);
      overflow: hidden;
    }
    .item-name {
      font-size: clamp(11px, 1.5vw, 22px);
      font-weight: 800;
      color: var(--item-color);
      line-height: 1.25;
      margin-bottom: clamp(2px, 0.4vw, 7px);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .item-desc {
      font-size: clamp(9px, 1.05vw, 15px);
      color: var(--item-desc, var(--text2));
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      margin-bottom: clamp(4px, 0.9vw, 16px);
    }
    .item-divider {
      height: 1px;
      background: rgba(0,0,0,.08);
      margin-bottom: clamp(6px, 0.9vw, 16px);
      flex-shrink: 0;
    }
    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .item-price {
      font-size: clamp(16px, 2vw, 30px);
      font-weight: 800;
      color: var(--price-color, var(--green-dark));
      letter-spacing: -0.3px;
      line-height: 1;
    }

    /* Calorie/kilojoule info — required at point of choice by the UK
       Calorie Labelling (Out of Home Sector) Regulations 2021 for large
       businesses: kcal per portion as sold, shown clearly alongside the
       name/price, plus a "2000 kcal a day" reference statement somewhere
       on the board (see .kcal-disclaimer). kJ is derived from kcal at
       render time (buildNutrition()), never stored. A product with a
       Servings count above 1 (a shareable bucket/banquet) gets a second
       "Per person" line; everything else is just the one total line.
       Always right-aligned via margin-left:auto — every placement (the
       standard tile's footer, the hero/promo-tile bottom bar) is a wider
       flex row this block sits at the right-hand end of. */
    .nutrition-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      margin-left: auto;
    }
    .nutr-row-line {
      display: flex;
      align-items: baseline;
      gap: clamp(6px, 0.8vw, 12px);
      white-space: nowrap;
    }
    .nutr-label {
      font-size: clamp(8px, 0.75vw, 11px);
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .nutr-values {
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 800;
      color: var(--text);
    }

    /* Regulatory reference statement — required wherever calorie
       information is shown on the board, not per item. A slim, always-
       visible strip (the existing .board-footer above only shows on
       :hover, so it can't carry this) covers every screen/rotation. */
    .kcal-disclaimer {
      flex-shrink: 0;
      padding: clamp(3px, 0.4vw, 6px) clamp(20px, 4vw, 60px);
      font-size: clamp(7px, 0.65vw, 9.5px);
      color: var(--text2);
      opacity: 0.8;
      letter-spacing: 0.1px;
      background: var(--cream);
    }
    /* The struck-through-RRP-next-to-offer-price block (priceHtml()) —
       sized off the parent price element's own font-size so it scales in
       every context (item tile, promo hero, promo card) without a
       per-context rule. .price-line is the flex container whose direction
       Settings → Pricing's RRP-placement setting switches between a row
       (RRP left/right of the offer price) and a column (RRP above/below
       it); .price-rrp-block keeps the copy+RRP+copy together as one flex
       item so placement only ever reorders it against the offer price as
       a whole, never splits it apart. */
    .price-line {
      display: inline-flex;
      align-items: baseline;
      gap: 0.3em;
    }
    .price-line.price-place-right { flex-direction: row-reverse; }
    .price-line.price-place-above { flex-direction: column; align-items: flex-start; gap: 0; }
    .price-line.price-place-below { flex-direction: column-reverse; align-items: flex-start; gap: 0; }
    .price-rrp-block {
      display: inline-flex;
      align-items: baseline;
      gap: 0.15em;
    }
    .price-was {
      opacity: 0.55;
      font-weight: 600;
      font-size: 0.55em;
    }
    /* The actual line-through is its own modifier, toggled by Settings →
       Pricing's "Strike through RRP when an offer is active" — off just
       drops the strike, the RRP still shows secondary/dimmed either way. */
    .price-was.price-was-strike {
      text-decoration: line-through;
    }
    /* Optional "Copy before/after RRP" text (Settings → Pricing) — sits
       right next to the RRP, same secondary weight, never struck through
       itself even when the RRP next to it is. */
    .price-rrp-copy {
      opacity: 0.55;
      font-weight: 600;
      font-size: 0.55em;
    }
    /* Optional promo copy set on the product's Pricing tab ("Show on Menu
       Board") — a small highlighted strip near the price, distinct from
       the item's regular description so it reads as a call-out, not
       product info. */
    .menu-board-note {
      display: inline-block;
      /* Only takes effect where this sits inside a flex column (the
         Featured Item board's hero and promo-tile text blocks) — without
         it, those containers' default align-items:stretch would widen the
         pill's background to the full column instead of hugging its own
         text, the way it already does everywhere else. */
      align-self: flex-start;
      /* Symmetric and small — Menu Board Badge Templates' Position setting
         can place this either right before the price (needs space below,
         before the price row) or in its usual spot after it (needs space
         above, from whatever precedes it) — the badge should sit DIRECTLY
         against the price either way, not float off it. */
      margin-top: clamp(3px, 0.5vw, 8px);
      margin-bottom: clamp(3px, 0.5vw, 8px);
      padding: clamp(4px, 0.5vw, 8px) clamp(10px, 1.2vw, 18px);
      background: #fff7e6;
      color: #ad4e00;
      border-radius: clamp(4px, 0.45vw, 8px);
      font-size: clamp(13px, 1.3vw, 19.5px);
      font-weight: 700;
      line-height: 1.3;
    }
    /* .promo-hero-top and .promo-text are flex columns with their own
       `gap` already spacing every child consistently (title, price,
       notes) — gap and margin don't collapse into each other,
       so the note's own margin above was ADDING to that gap instead of
       being absorbed by it, on top of the flex-column's spacing every
       other child already gets "for free". Zero it out here so the badge
       sits exactly one `gap` from the price, matching every other
       child-to-child spacing in these two containers. The grid item tile
       (.item-body) has no such gap — its note keeps its own margin above. */
    .promo-hero-top .menu-board-note,
    .promo-text .menu-board-note {
      margin-top: 0;
      margin-bottom: 0;
    }

    /* ── OUT OF STOCK ───────────────────────── */
    .oos-overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.65);
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .item-cell.oos-cell .oos-overlay { display: flex; }

    /* Structural "stamp" look (rotation, box-shadow, inline-flex centering)
       stays fixed here — border/radius/background/padding and the text's
       colour/size/case come from the 'soldOut' Badge Template instead
       (applied inline, see _itemCell below), so .oos-stamp-text
       deliberately carries no colour/size/case of its own anymore: it
       inherits every one of those from the inline-styled .oos-stamp
       around it. */
    .oos-stamp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-12deg);
      box-shadow: 0 2px 10px rgba(192,57,43,0.25);
    }
    .oos-stamp-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      letter-spacing: clamp(1px, 0.3vw, 4px);
      line-height: 1.1;
    }

    /* ── FOOTER ────────────────────────────── */
    .board-footer {
      background: #f0f4f8;
      border-top: 1px solid #dde5ee;
      padding: clamp(8px, 1.2vw, 16px) clamp(20px, 4vw, 60px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .board:hover .board-footer {
      opacity: 1;
    }
    .board.landscape .board-footer {
      padding: clamp(5px, 0.8vw, 10px) clamp(20px, 4vw, 60px);
    }
    .footer-text {
      font-size: clamp(9px, 1vw, 13px);
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .footer-page-info {
      font-size: clamp(9px, 1vw, 13px);
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .footer-refresh {
      font-size: clamp(9px, 0.9vw, 12px);
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── ROTATION PROGRESS BAR ──────────────── */
    .rotation-bar-wrap {
      height: 3px;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
      flex-shrink: 0;
    }
    .rotation-bar {
      height: 100%;
      background: var(--green, #006241);
      width: 0%;
      transition: none;
    }

    /* ── EMPTY / ERROR STATES ──────────────── */
    .board-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      text-align: center;
      background: var(--cream);
    }
    .board-empty .icon { font-size: 56px; margin-bottom: 20px; opacity: 0.35; }
    .board-empty h2 { font-family: 'Oswald',sans-serif; font-size: 28px; color: var(--green); margin-bottom: 10px; }
    .board-empty p  { font-size: 15px; color: var(--text2); line-height: 1.7; }

    .error-board {
      min-height: 100vh;
      background: var(--green);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: white;
    }
    .error-board .icon { font-size: 60px; margin-bottom: 20px; }
    .error-board h2 { font-family: 'Oswald',sans-serif; font-size: 32px; margin-bottom: 12px; letter-spacing: 2px; }
    .error-board p  { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.7; max-width: 440px; }
    .error-board code {
      background: rgba(255,255,255,0.15); border-radius: 6px;
      padding: 3px 10px; font-size: 13px; font-family: monospace;
      color: #fff; display: inline-block; margin-top: 6px; word-break: break-all;
    }
    .error-board a {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 24px; background: white; color: var(--green);
      font-weight: 700; padding: 10px 24px; border-radius: 8px;
      text-decoration: none; font-size: 14px;
    }

    /* ── FEATURE HERO SPOTLIGHT LAYOUT ─────────────── */
    /* A full-bleed image panel (no overlay copy) alongside a stack of
       equally-weighted promo cards — not one dominant item with a small
       supporting grid. Portrait: image on top, promos below. Landscape:
       image on the left, promos stacked down the right. */
    .board.portrait .promo-board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .board.portrait .promo-hero {
      flex: 0 0 var(--hero-flex-basis, 42%);
      overflow: hidden;
      border-bottom: 3px solid var(--accent, #f6ad55);
      position: relative;
    }
    .board.landscape .promo-board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .board.landscape .promo-hero {
      flex: 0 0 var(--hero-flex-basis, 42%);
      overflow: hidden;
      border-right: 3px solid var(--accent, #f6ad55);
      position: relative;
    }
    .promo-hero img, .promo-hero video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .promo-hero-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(48px, 8vw, 120px);
      background: rgba(0,0,0,0.05);
    }
    /* Product info + pricing sit top-left over the primary image. No box or
       card behind them — even a translucent padded rectangle reads as "a
       white background" once text is a single line (no wrap to clone a
       highlight across). Instead a soft white glow hugs the glyphs
       themselves via stacked text-shadows, so there's no rectangular edge
       at any line count. */
    .promo-hero-top {
      position: absolute;
      top: 0; left: 0;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(4px, 0.6vw, 10px);
      padding: clamp(14px, 2vw, 30px);
    }
    .promo-hero-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      color: #000;
      text-shadow:
        0 0 3px rgba(255,255,255,0.95), 0 0 3px rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.9),
        0 0 16px rgba(255,255,255,0.75), 0 0 16px rgba(255,255,255,0.75);
      font-size: clamp(26px, 4.1vw, 65px);
      line-height: 1.15;
    }
    .promo-hero-price {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      color: var(--price-color, var(--accent));
      text-shadow:
        0 0 3px rgba(255,255,255,0.95), 0 0 3px rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.9),
        0 0 16px rgba(255,255,255,0.75), 0 0 16px rgba(255,255,255,0.75);
      font-size: clamp(31px, 4.8vw, 74px);
    }
    /* Bottom bar splits left (description, ≤50% width) from right (calorie/
       kilojoule info) — nutrition-block's own margin-left:auto hugs it to
       the right edge regardless of whether the description column exists. */
    .promo-hero-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: clamp(12px, 1.8vw, 26px);
      background: linear-gradient(to top, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.7) 65%, rgba(255,255,255,0) 100%);
      display: flex;
      align-items: flex-end;
      gap: clamp(10px, 1.5vw, 24px);
    }
    .promo-hero-desc-col {
      max-width: 68%;
    }
    .promo-hero-desc {
      font-style: italic;
      color: #000000;
      /* +30% over the original clamp(11px, 1.2vw, 18px) */
      font-size: clamp(14px, 1.56vw, 23px);
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    /* Promo card stack */
    .promo-list {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: clamp(10px, 1.4vw, 24px);
      padding: clamp(10px, 1.4vw, 24px);
    }
    .promo-tile {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 0;
      background: var(--item-bg, #fff);
      border-radius: clamp(8px, 1vw, 16px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      overflow: hidden;
    }
    /* Angled candy-stripe accent bar, in the brand's own accent colour —
       the recurring "promo flag" motif from QSR value-menu signage. */
    .promo-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: clamp(6px, 0.6vw, 10px);
      background: repeating-linear-gradient(-45deg, var(--accent, #e4002b) 0 14px, #fff 14px 28px);
      z-index: 1;
    }
    .promo-text {
      flex: 1 1 55%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 6px);
      padding: clamp(14px, 1.6vw, 30px) clamp(14px, 1.6vw, 30px) clamp(10px, 1.2vw, 22px);
    }
    /* Background/colour/font-size/border-radius/text-transform come from
       the 'category' Badge Template inline (see badgeStyleForTemplateId
       call sites) — previously this always matched the brand's own accent
       colour; every brand now uses the one fixed Category Badge style. */
    .promo-cat {
      display: inline-block;
      align-self: flex-start;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      letter-spacing: .05em;
      margin-bottom: clamp(4px, 0.6vw, 10px);
    }
    .promo-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      color: #000;
      font-size: clamp(19px, 2.64vw, 38px);
      line-height: 1.08;
    }
    .promo-price {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      color: var(--price-color, var(--accent));
      font-size: clamp(24px, 3.36vw, 48px);
      margin-top: clamp(2px, 0.5vw, 8px);
    }
    .promo-img-wrap {
      flex: 0 0 42%;
      min-width: 0;
      overflow: hidden;
    }
    .promo-img-wrap img, .promo-img-wrap video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .promo-img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(28px, 4vw, 56px);
      opacity: .3;
    }
    /* Bottom bar runs the full width of the tile, overlaid across both the
       text column and the photo — description on the left (≤50% width),
       calorie/kilojoule info hugging the right edge (nutrition-block's own
       margin-left:auto), same split as the hero panel's own bottom bar. */
    .promo-tile-desc {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: clamp(10px, 1.4vw, 22px);
      background: linear-gradient(to top, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.6) 70%, rgba(255,255,255,0) 100%);
      display: flex;
      align-items: flex-end;
      gap: clamp(8px, 1.2vw, 18px);
    }
    .promo-desc-col {
      max-width: 68%;
    }
    .promo-tile-desc .promo-desc {
      font-style: italic;
      color: #000000;
      /* +30% over the original clamp(11px, 1.2vw, 18px) */
      font-size: clamp(14px, 1.56vw, 23px);
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    /* "Attributes" — only reachable via a Tile Layout, never shown on any
       board before it existed, so kept deliberately plain rather than
       inventing a look nobody's asked for. */
    .promo-attributes {
      font-size: clamp(11px, 1.1vw, 16px);
      color: rgba(0,0,0,.65);
      line-height: 1.4;
    }

    /* ── API ERROR BADGE ───────────────────────────── */
    #apiErrorBadge {
      position: fixed; bottom: 16px; right: 16px; z-index: 9999;
      background: rgba(192,57,43,0.92); color: #fff;
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
      line-height: 1.4; padding: 8px 12px; border-radius: 6px;
      max-width: 320px; word-break: break-all;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      display: none; pointer-events: none;
    }
    #apiErrorBadge.visible { display: block; }

    /* ── DEBUG PANEL (visible only with ?debug=1) ──── */
    #debugPanel {
      position: fixed; bottom: 12px; left: 12px; z-index: 9999;
      background: rgba(0,0,0,0.88); color: #ccc;
      font-family: 'Courier New', monospace; font-size: 11.5px; font-weight: 500;
      line-height: 1.8; padding: 10px 14px; border-radius: 8px;
      max-width: 420px; word-break: break-all;
      box-shadow: 0 2px 20px rgba(0,0,0,0.6);
      display: none;
    }
    #debugPanel.visible { display: block; }
    #debugPanel b       { color: #fff; font-size: 12px; }
    #debugPanel .ok     { color: #2ecc71; }
    #debugPanel .warn   { color: #f39c12; }
    #debugPanel .err    { color: #e74c3c; }
    #debugPanel button.env-btn {
      display: inline-block; margin: 4px 6px 4px 0;
      padding: 8px 14px; border-radius: 6px; border: 1px solid #555;
      background: #222; color: #aaa; font-family: 'Courier New', monospace;
      font-size: 13px; cursor: pointer; line-height: 1.4;
    }
    #debugPanel button.env-btn:hover  { border-color: #888; color: #fff; }
    #debugPanel button.env-btn.active { background: #1a4a2a; border-color: #2ecc71; color: #2ecc71; }
  </style>
</head>
<body>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

// ===== FIREBASE INIT =====
const firebaseConfig = {
  apiKey: "AIzaSyDrUKPNep2uxbZjYJ4i0vImdG7Xn_UuSXo",
  authDomain: "rob-ph-demos.firebaseapp.com",
  projectId: "rob-ph-demos",
  storageBucket: "rob-ph-demos.firebasestorage.app",
  messagingSenderId: "199417645406",
  appId: "1:199417645406:web:0e7a54d00083b41ea9e7cf"
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db  = getFirestore(app);
const MB         = 'menuboard';
const ITEMS_COLL = 'items';
const STOCK_COLL = 'stock';
const LOCAL_FEATURED_COLL = 'localFeatured';
const STORE_PRICING_COLL = 'storePricing';

// ── URL PARAMS ──────────────────────────────────────────────────────────────
const urlParams   = new URLSearchParams(window.location.search);
const STORE_CODE  = (urlParams.get('store')   || '').trim().toUpperCase();
// Menu type(s): comma-separated e.g. "drinks,specials". MENU_TYPE is the primary (first) type.
const MENU_TYPES_RAW = (urlParams.get('menu') || '').trim().toLowerCase();
const MENU_TYPES     = MENU_TYPES_RAW ? MENU_TYPES_RAW.split(',').map(s => s.trim()).filter(Boolean) : [];
const MENU_TYPE      = MENU_TYPES[0] || ''; // primary type — used for MENU_META label/emoji
const TEMPLATE_TYPE  = (urlParams.get('template') || '').trim(); // offer board template type id
const SCREEN_LOCK = urlParams.get('screen') ? parseInt(urlParams.get('screen'), 10) : null;
// Device UDID — passed by the PWA Player to enable personalised campaign mode
// Example URL: menu-board.html?store=STORE001&menu=breakfast&device=6cfd0049-40ce-4ac3-9eba-353337b48427
const DEVICE_UDID = (urlParams.get('device')  || '').trim();
const ORIENTATION = urlParams.get('orientation') || 'portrait';
const BRAND_ID    = (urlParams.get('brand')    || '').trim();
const MOCK_API_FILE = urlParams.get('mockapi') || null;
const DEBUG_MODE    = urlParams.get('debug') === '1';
// Test SKUs — inject campaign SKUs via URL without needing the live PH API
// e.g. ?testSkus=LS0873NBRONCOS,LS0873NBULLDOGS
const TEST_SKUS = (urlParams.get('testSkus') || '').split(',').map(s => s.trim()).filter(Boolean);
// Test Device Type — same idea as testSkus above, for Visitor targeting's
// Device Type field: visitor_customer.device_type, confirmed live against
// demo.personalisationhub.com's real /location-api/.../campaign_data
// response (30 Aug 2026) and now parsed for real in pollCampaign() below.
// This URL param is only an initial seed for boards that never poll (no
// ?device= UDID) or before their first poll resolves — same as testSkus,
// a real poll's result always wins once one comes in, even if that means
// overwriting this with an empty value.
// e.g. ?testDeviceType=android
const TEST_DEVICE_TYPE = (urlParams.get('testDeviceType') || '').trim();

// Shared parser for the two generic test-override params below: comma-
// separated field:value pairs, semicolon for a field that itself takes
// multiple values (Audience/Segments, Product Type(s), etc. are all
// multi-value in the real API).
function _parseTestFieldPairs(paramName) {
  const map = {};
  (urlParams.get(paramName) || '').split(',').map((s) => s.trim()).filter(Boolean).forEach((pair) => {
    const i = pair.indexOf(':');
    if (i === -1) return;
    const key = pair.slice(0, i).trim();
    const val = pair.slice(i + 1).trim();
    map[key] = val.includes(';') ? val.split(';').map((v) => v.trim()).filter(Boolean) : val;
  });
  return map;
}
function _testFieldStr(map, key) {
  const v = map[key];
  return (Array.isArray(v) ? v[0] : v) || null;
}
function _testFieldArr(map, key) {
  const v = map[key];
  return v ? (Array.isArray(v) ? v : [v]) : [];
}

// Test override for the rest of Visitor / Customer Data (every
// visitor_customer field besides First Name/SKU(s)/Device Type, which get
// their own dedicated ?test*= params above for historical reasons — those
// three were wired and verified one at a time). One generic param instead
// of 14 near-identical ones.
// e.g. ?testVisitor=companyName:Acme,age:34,gender:Male,productTypes:Broadband;Mobile
const TEST_VISITOR = _parseTestFieldPairs('testVisitor');
function _testVisitorStr(key) { return _testFieldStr(TEST_VISITOR, key); }
function _testVisitorArr(key) { return _testFieldArr(TEST_VISITOR, key); }

// Test override for Queueing / Aggregate Visitor Data — same idea, its
// own param since it's a genuinely separate data source (aggregate queue
// stats, not the one individual visitor_customer describes).
// e.g. ?testQueue=queueNumberOfVisitors:4,queueDeviceTypes:android;ios
const TEST_QUEUE = _parseTestFieldPairs('testQueue');
function _testQueueStr(key) { return _testFieldStr(TEST_QUEUE, key); }
function _testQueueArr(key) { return _testFieldArr(TEST_QUEUE, key); }

const DEFAULT_ROTATION_SECONDS = 5; // fallback when the active template has no Rotation Speed set

// ── BOARD ACTIVITY HEARTBEAT ─────────────────────────────────────────────────
// Unique key per brand+menuType+store combination — one doc per board instance
const _boardKey = [BRAND_ID || 'all', MENU_TYPE || 'all', STORE_CODE || 'unknown']
  .join('__').toLowerCase().replace(/[^a-z0-9_]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

let _boardPinged = false;
function _pingBoardActivity(brand) {
  if (_boardPinged) return; // only ping once per page load
  _boardPinged = true;
  const templateType = urlParams.get('template') || '';
  setDoc(doc(db, 'mbactivity', _boardKey), {
    boardKey:     _boardKey,
    brandId:      BRAND_ID || '',
    brandName:    (brand && brand.name) || BRAND_ID || '',
    brandLogo:    (brand && brand.logo) || '',
    menuType:     MENU_TYPE || '',
    storeCode:    STORE_CODE || '',
    deviceUdid:   DEVICE_UDID || '',
    templateType: templateType,
    orientation:  urlParams.get('orientation') || 'portrait',
    pageUrl:      window.location.pathname + window.location.search,
    lastSeen:     new Date().toISOString()
  }, { merge: true }).catch(() => {/* silent — non-critical */});
}

// ── IN-MEMORY CACHE ──────────────────────────────────────────────────────────
let _items       = [];
let _settings    = { brandName: 'Our Brand', currency: '$', logo: '', logoRight: '' };
let _brands      = [];
let _stock       = {};
let _localFeatured = {}; // per-store Featured override, set from Retail Admin — see LOCAL_FEATURED_COLL
let _storePricing  = {}; // per-store price override (by sku), set from Retail Admin — see STORE_PRICING_COLL
// This store's Fixed/Variable Store Segment membership — sourced from the
// PH API's own campaign_data response (data.store_location, same place
// store_name and store_timezone already come from), never managed locally.
// Populated in pollCampaign() below; stays empty until the first
// successful poll (Device UDID boards only — Store Code boards have no PH
// API session and so never receive segments, same as they never receive a
// personalised first name today).
let _storeProfile  = { storeName: null, fixedSegments: [], variableSegments: [], suburb: '', state: '', storeCountry: '', displayTags: [], displayId: '', displayType: '', displayName: '', languagesSpokenByStaff: [] };
// Campaign SKUs: null = default menu; string[] = personalised override from Personalisation Hub API
let _campaignSkus      = TEST_SKUS.length > 0 ? TEST_SKUS : null;
let _campaignFirstName = null; // null = no greeting; string = show personalised greeting in clock bar
// Device Type: null = no data; string = visitor_customer.device_type from
// the PH API (or ?testDeviceType= before the first poll — see its
// comment above). Reassigned for real in pollCampaign() below, same as
// _campaignFirstName.
let _campaignDeviceType = TEST_DEVICE_TYPE || null;
let _storeName         = null; // null = no store label; string = show store name in clock bar when no firstName
// The rest of Visitor / Customer Data (ph-designer skill components.md
// §16's 17-field list, minus First Name/SKU(s)/Device Type above, which
// keep their own dedicated globals) — same shape/role as _storeProfile,
// just for the individual visitor instead of the store. Every field here
// is a real visitor_customer field, confirmed live against
// demo.personalisationhub.com's own campaign_data response 30 Aug 2026.
// Reassigned for real in pollCampaign() below; seeded here from
// TEST_VISITOR for boards that never poll or haven't polled yet.
let _visitorProfile = {
  companyName: _testVisitorStr('companyName'),
  purchaseIntent: _testVisitorStr('purchaseIntent'),
  visitorType: _testVisitorStr('visitorType'),
  reasonForVisit: _testVisitorStr('reasonForVisit'),
  age: _testVisitorStr('age'),
  gender: _testVisitorStr('gender'),
  audienceSegments: _testVisitorArr('audienceSegments'),
  productTypes: _testVisitorArr('productTypes'),
  planTypes: _testVisitorArr('planTypes'),
  planValues: _testVisitorArr('planValues'),
  pageViews: _testVisitorArr('pageViews'),
  events: _testVisitorArr('events'),
  productHoldings: _testVisitorArr('productHoldings'),
  purchaseHistory: _testVisitorArr('purchaseHistory'),
};
// Queueing / Aggregate Visitor Data — the real queueing_appointment
// object, aggregate stats about everyone currently waiting in the store's
// queue right now (confirmed live against demo.personalisationhub.com's
// campaign_data response 30 Aug 2026), not the one individual
// _visitorProfile above describes. Same role/shape/seeding pattern as
// _visitorProfile; reassigned for real in pollCampaign() below.
let _queueProfile = {
  estimatedWaitingTime: _testQueueStr('queueEstimatedWaitingTime'),
  numberOfVisitors: _testQueueStr('queueNumberOfVisitors'),
  visitorTypes: _testQueueArr('queueVisitorTypes'),
  reasonForVisit: _testQueueArr('queueReasonForVisit'),
  deviceTypes: _testQueueArr('queueDeviceTypes'),
};

const MENU_META_STATIC = {
  breakfast: { label: 'Breakfast Menu',        emoji: '🌅' },
  lunch:     { label: 'Lunch Menu',             emoji: '☀️' },
  dinner:    { label: 'Dinner Menu',            emoji: '🌙' },
  drinks:    { label: 'Drinks Menu',            emoji: '🥤' },
  specials:  { label: "Today's Specials Menu",  emoji: '⭐' },
};
// Dynamic fallback — any custom menu type (e.g. supplements, vitamins) gets a generic entry
const MENU_META = new Proxy(MENU_META_STATIC, {
  get(target, key) {
    if (key in target) return target[key];
    if (typeof key === 'string' && key.length > 0 && key !== '__esModule') {
      const label = key.charAt(0).toUpperCase() + key.slice(1).replace(/-/g, ' ') + ' Menu';
      return { label, emoji: '🏷️' };
    }
    return undefined;
  },
  has(target, key) { return true; }  // all string keys are "valid"
});

// ── HELPERS ─────────────────────────────────────────────────────────────────
// Merges in this store's own price override (if any) for each item — set
// via Retail Admin's Pricing tab, and scoped to this store's own
// storePricing/{STORE_CODE} doc only, never touching the shared item or
// any other store. Every caller reads through here so price/offer/menu-
// board-copy display is correct everywhere without each call site having
// to know about store overrides.
// Store-targeted offers: an offer's `targeting` is an AND-of-ORs, same
// rule as Campaign Targeting's condition-tree builder (ph-designer skill
// components.md §16) — each entry in the array is one AND-group, and the
// conditions listed inside a group are OR'd together. No targeting at all
// means the offer applies at every store.
// Category-aware — an offer's targeting can now be Store / Location Data,
// Visitor / Customer Data, or (30 Aug 2026) Queueing / Aggregate Visitor
// Data (ph-designer skill components.md §16, verified live against
// demo.personalisationhub.com 24 Aug 2026).
// Visitor fields read _campaignFirstName/_campaignSkus/_campaignDeviceType
// plus _visitorProfile for the rest — all populated by pollCampaign() from
// the PH API's real campaign_data response (visitor_customer.*), never
// sourced or managed locally. All 17 Visitor / Customer Data fields
// (ph-designer skill components.md §16) are wired as of 30 Aug 2026 —
// confirmed live against demo.personalisationhub.com's own response.
// Audience / Segments is one field in the targeting UI but two separate
// fields in the real API (segments[] and audience string) — combined here
// per the skill's own note to treat the dropdown, not the API shape, as
// authoritative.
// Queueing fields read _queueProfile — real queueing_appointment.* data,
// aggregate stats about everyone currently in the store's queue, NOT the
// one individual _visitorProfile/_campaign* above describe. Deliberately
// a separate `have` source even though a couple of these fields share a
// concept with an "(Individual)" Visitor field of a similar name (Visitor
// Type, Reason for Visit, Device Type) — the aggregate array already
// matches with the same "any element" semantics every other array-valued
// field here uses (fixedSegment, displayTag, ...), so no new matching
// logic was needed, just a new data source.
function _offerConditionMatches(cond, store) {
  const category = cond.category || 'store';
  const have = (
    category === 'visitor'
      ? (
          cond.field === 'firstName' ? (_campaignFirstName ? [_campaignFirstName] : []) :
          cond.field === 'skus' ? (_campaignSkus || []) :
          cond.field === 'deviceType' ? (_campaignDeviceType ? [_campaignDeviceType] : []) :
          cond.field === 'companyName' ? (_visitorProfile.companyName ? [_visitorProfile.companyName] : []) :
          cond.field === 'purchaseIntent' ? (_visitorProfile.purchaseIntent ? [_visitorProfile.purchaseIntent] : []) :
          cond.field === 'visitorType' ? (_visitorProfile.visitorType ? [_visitorProfile.visitorType] : []) :
          cond.field === 'reasonForVisit' ? (_visitorProfile.reasonForVisit ? [_visitorProfile.reasonForVisit] : []) :
          cond.field === 'age' ? (_visitorProfile.age ? [_visitorProfile.age] : []) :
          cond.field === 'gender' ? (_visitorProfile.gender ? [_visitorProfile.gender] : []) :
          cond.field === 'audienceSegments' ? (_visitorProfile.audienceSegments || []) :
          cond.field === 'productTypes' ? (_visitorProfile.productTypes || []) :
          cond.field === 'planTypes' ? (_visitorProfile.planTypes || []) :
          cond.field === 'planValues' ? (_visitorProfile.planValues || []) :
          cond.field === 'pageViews' ? (_visitorProfile.pageViews || []) :
          cond.field === 'events' ? (_visitorProfile.events || []) :
          cond.field === 'productHoldings' ? (_visitorProfile.productHoldings || []) :
          cond.field === 'purchaseHistory' ? (_visitorProfile.purchaseHistory || []) :
          []
        )
      : category === 'queueing'
      ? (
          cond.field === 'queueEstimatedWaitingTime' ? (_queueProfile.estimatedWaitingTime ? [_queueProfile.estimatedWaitingTime] : []) :
          cond.field === 'queueNumberOfVisitors' ? (_queueProfile.numberOfVisitors ? [_queueProfile.numberOfVisitors] : []) :
          cond.field === 'queueVisitorTypes' ? (_queueProfile.visitorTypes || []) :
          cond.field === 'queueReasonForVisit' ? (_queueProfile.reasonForVisit || []) :
          cond.field === 'queueDeviceTypes' ? (_queueProfile.deviceTypes || []) :
          []
        )
      : (
          cond.field === 'storeCode' ? [STORE_CODE] :
          cond.field === 'storeName' ? (store.storeName ? [store.storeName] : []) :
          cond.field === 'fixedSegment' ? (store.fixedSegments || []) :
          cond.field === 'variableSegment' ? (store.variableSegments || []) :
          cond.field === 'storeSegmentConsolidated' ? [...(store.fixedSegments || []), ...(store.variableSegments || [])] :
          cond.field === 'storeState' ? (store.state ? [store.state] : []) :
          cond.field === 'storeSuburb' ? (store.suburb ? [store.suburb] : []) :
          cond.field === 'storeCountry' ? (store.storeCountry ? [store.storeCountry] : []) :
          cond.field === 'displayTag' ? (store.displayTags || []) :
          cond.field === 'displayId' ? (store.displayId ? [store.displayId] : []) :

// and only renders in roomier contexts (the Feature Hero Spotlight panel)
// to avoid squeezing the product photo down to nothing.
function buildNutrition(item) {
  if (item.calories == null) return '';
  const kcalTotal = Math.round(item.calories);
  // kJ isn't captured directly — UK packaging derives it from kcal via the
  // standard kcal-to-kJ conversion factor (4.184) whenever only kcal is
  // measured, so this does the same rather than storing a second figure
  // that would just have to be kept in sync with the first.
  const kjTotal = Math.round(kcalTotal * 4.184);
  const servings = parseFloat(item.servings);

  if (servings > 1) {
    const kcalPerson = Math.round(kcalTotal / servings);
    const kjPerson = Math.round(kcalPerson * 4.184);
    return `<div class="nutrition-block">
      <div class="nutr-row-line"><span class="nutr-label">Serves ${servings}</span><span class="nutr-values">${kjTotal}kJ&nbsp;/&nbsp;${kcalTotal}kcal</span></div>
      <div class="nutr-row-line"><span class="nutr-label">Per person</span><span class="nutr-values">${kjPerson}kJ&nbsp;/&nbsp;${kcalPerson}kcal</span></div>
    </div>`;
  }
  return `<div class="nutrition-block">
    <div class="nutr-row-line"><span class="nutr-values">${kjTotal}kJ&nbsp;/&nbsp;${kcalTotal}kcal</span></div>
  </div>`;
}

// ── TILE LAYOUT — data-driven Hero/Promo tile rendering (Local Feature Highlight) ──
// Only used when a template carries an explicit heroLayout/promoLayout
// (authored via hq-admin.html's Settings → Offer Boards → Tile Layout editor,
// Local Feature Highlight only). When a template has neither, the
// feature-hero-board branch below keeps building heroTopHtml/heroBottomHtml/
// promo tiles exactly as it always has — every existing brand's board stays
// pixel-identical until an admin actively opts into a Tile Layout.
//
// "attributes" is the only element with no existing single-purpose renderer
// to call into (every other key already had one — priceHtml, buildNutrition,
// etc.) since ingredients/Additional Attributes have never been shown on any
// board before this.
function _tileAttributesHtml(item) {
  const parts = [];
  if (Array.isArray(item.ingredients) && item.ingredients.length) {
    parts.push(esc(item.ingredients.join(', ')));
  }
  if (Array.isArray(item.attributes)) {
    item.attributes.filter(a => a.show && a.label).forEach(a => {
      parts.push(`${esc(a.label)}${a.value ? ': ' + esc(a.value) : ''}${a.unit ? ' ' + esc(a.unit) : ''}`);
    });
  }
  return parts.length ? `<div class="promo-attributes">${parts.join(' &middot; ')}</div>` : '';
}

function _tileElementHtml(key, item, ctx) {
  switch (key) {
    case 'category':
      return item.category ? `<div class="promo-cat" style="${badgeStyleForTemplateId('category')}">${esc(item.category)}</div>` : '';
    case 'name':
      return `<div class="${ctx.titleClass}">${esc(item.name)}</div>`;
    case 'shortDescription': {
      const text = item.shortDescription || item.description || '';
      return text ? `<div class="${ctx.descColClass}"><div class="${ctx.descClass}">${esc(text)}</div></div>` : '';
    }
    case 'longDescription': {
      const text = item.longDescription || '';
      return text ? `<div class="${ctx.descColClass}"><div class="${ctx.descClass}">${esc(text)}</div></div>` : '';
    }
    case 'price':
      return `<div class="${ctx.priceClass}">${priceHtml(item, ctx.currency, 'price-was')}</div>`;
    case 'menuBoardNote':
      return shouldShowMenuNote(item) ? `<div class="menu-board-note" style="${menuNoteStyleAttr(item)}">${esc(item.showOnMenuBoard)}</div>` : '';
    case 'locationBadge':
      return locationBadgeHtml(item);
    case 'nutrition':
      return buildNutrition(item);
    case 'attributes':
      return _tileAttributesHtml(item);
    default:
      return '';
  }
}

// Each zone entry is { key, align } — align is 'left'|'center'|'right', set
// via hq-admin.html's Tile Layout editor (a per-element icon toggle, not
// free-form CSS). 'left' is left unwrapped so every existing configured
// layout's default alignment renders exactly as before this existed — the
// wrapping div's own width:100% only ever gets introduced for center/right,
// where it's required for text-align to have anything to align within.
function renderTileZone(entries, item, ctx) {
  return (entries || []).map(entry => {
    const key = typeof entry === 'string' ? entry : entry.key;
    const align = (typeof entry === 'object' && entry.align) || 'left';
    const html = _tileElementHtml(key, item, ctx);
    if (!html) return '';
    return align === 'left' ? html : `<div style="width:100%;text-align:${align};">${html}</div>`;
  }).join('');
}

// Every render() call replaces boardRoot's whole innerHTML (see the
// bottom of _renderUnsafe) — including, each time the hero rotates onto a
// video, a brand new <video> element. An already-in-memory base64 data
// URI (every other asset in this app) is instant either way, but Generate
// Video's asset is the provider's own hosted https:// URL (see
// _isVideoSrc's comment) — that <video> only starts actually downloading
// the instant it's inserted, and confirmed live, a several-second real
// network fetch at that exact moment reads as a stuck white screen. This
// starts that download one full rotation interval early, in a hidden
// element appended straight to document.body — not boardRoot — so it
// survives the innerHTML replace above and has time to buffer before it's
// needed. Declared at module scope (not inside _renderUnsafe, which reruns
// this whole file's render-time code fresh on every rotation tick) so the
// in-flight preload element itself persists — and can be found and
// deduped or torn down — across renders instead of being forgotten the
// moment the render that started it ends.
let _nextHeroPreload = null;
function _preloadNextHeroVideo(src, isVideo) {
  if (!isVideo || !src || /^data:/.test(src)) { // data URIs need no head start
    if (_nextHeroPreload) { _nextHeroPreload.remove(); _nextHeroPreload = null; }
    return;
  }
  if (_nextHeroPreload && _nextHeroPreload.dataset.src === src) return; // already warming this one
  if (_nextHeroPreload) _nextHeroPreload.remove();
  const v = document.createElement('video');
  v.preload = 'auto';
  v.muted = true;
  v.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
  v.dataset.src = src;
  v.src = src;
  document.body.appendChild(v);
  _nextHeroPreload = v;
}

function startRotation(totalPages, intervalMs) {
  if (SCREEN_LOCK || totalPages <= 1) return;
  clearTimeout(rotationTimer);
  intervalMs = intervalMs || DEFAULT_ROTATION_SECONDS * 1000;

  // Animate progress bar from 0 → 100%
  const bar = document.getElementById('rotationBar');
  if (bar) {
    bar.style.transition = 'none';
    bar.style.width = '0%';
    setTimeout(() => {
      bar.style.transition = `width ${intervalMs}ms linear`;
      bar.style.width = '100%';
    }, 50);
  }

  rotationTimer = setTimeout(() => {
    currentPage = currentPage >= totalPages ? 1 : currentPage + 1;
    render();

// ── PERSONALISATION HUB API — DECRYPTION + CAMPAIGN POLLING ─────────────────
const _ENC_PASS = 'rob-ph-demos-phapi-v1';
const _ENC_SALT = new TextEncoder().encode('ph-menuboard-salt-2024');

// Cache the key derivation (PBKDF2 is intentionally slow — only do it once)
let _derivedKeyPromise = null;
async function _deriveKey() {
  if (!_derivedKeyPromise) {
    _derivedKeyPromise = (async () => {
      const mat = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(_ENC_PASS), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: _ENC_SALT, iterations: 100000, hash: 'SHA-256' },
        mat, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    })();
  }
  return _derivedKeyPromise;
}

// Map-based decrypt cache — handles N endpoints without thrashing
const _tokenCache = new Map(); // encrypted b64 → plaintext
async function decryptToken(b64) {
  if (_tokenCache.has(b64)) return _tokenCache.get(b64);
  const key   = await _deriveKey();
  const buf   = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pt    = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  const plain = new TextDecoder().decode(pt);
  _tokenCache.set(b64, plain);
  return plain;
}

// ── ACTIVE ENDPOINT + LOCALSTORAGE PREFERENCE ────────────────────────────────
let _activeEndpoint = null; // { baseUrl: string, token: string } — current working endpoint

function _epPrefKey()            { return `ph-ep-${DEVICE_UDID}`; }
function _loadPreferredBaseUrl() {
  try { return localStorage.getItem(_epPrefKey()) || null; } catch (_) { return null; }
}
function _savePreferredBaseUrl(url) {
  try { url ? localStorage.setItem(_epPrefKey(), url) : localStorage.removeItem(_epPrefKey()); }
  catch (_) {}
}

// True while a poll is in flight. Without this, a single stalled fetch
// (a real risk on a store's own network, with no timeout on any of the
// fetch calls below) never blocked the next setInterval(pollCampaign, 5000)
// tick from firing — so a hung connection just accumulated a new pending
// request every 5 seconds indefinitely instead of the board waiting for
// one poll to finish before starting the next.
let _pollInFlight = false;

async function pollCampaign() {
  if (!DEVICE_UDID || _pollInFlight) return;
  _pollInFlight = true;
  try {
    let json = null;

    if (MOCK_API_FILE) {
      // ── MOCK MODE: bypass real API — load local JSON file instead ──────────
      const mockPath = MOCK_API_FILE === '1' ? './mock-ph-api.json' : `./${MOCK_API_FILE}`;
      console.log('[Campaign] \uD83E\uDDEA MOCK MODE — loading', mockPath);
      const resp = await fetch(mockPath);
      if (!resp.ok) { console.warn('[Campaign] Mock file not found:', mockPath); return; }
      json = await resp.json();

    } else {
      // ── REAL API MODE — multi-endpoint probe ─────────────────────────────────
      const endpoints = _settings.phApi?.endpoints;

      // Backwards compat: old single-token format or no config — wait until admin saves
      if (!Array.isArray(endpoints) || endpoints.length === 0) return;

      // Phase 1: try the cached active endpoint (avoids re-probing on every poll)
      if (_activeEndpoint) {
        const { baseUrl, token } = _activeEndpoint;
        try {
          const resp = await fetch(
            `${baseUrl}/location-api/device/${DEVICE_UDID}/campaign_data`,
            { headers: { accept: 'application/json', 'x-api-key': token } }
          );
          if (resp.ok) {
            _setApiError(null);
            json = await resp.json();
          } else {
            console.warn(`[Campaign] Active endpoint HTTP ${resp.status} \u2014 re-probing`);
            _activeEndpoint = null;
          }
        } catch (activeErr) {
          console.warn('[Campaign] Active endpoint unreachable:', activeErr.message, '\u2014 re-probing');
          _activeEndpoint = null;
        }
      }

      // Phase 2: probe all endpoints in preference order
      if (!json) {
        // Build probe order: localStorage-preferred first, then remaining in array order
        const preferred  = _loadPreferredBaseUrl();
        const probeOrder = [];
        if (preferred) {
          const prefEp = endpoints.find(e => e.baseUrl === preferred);
          if (prefEp) probeOrder.push(prefEp);
        }
        for (const ep of endpoints) {
          if (!probeOrder.some(p => p.baseUrl === ep.baseUrl)) probeOrder.push(ep);
        }

        let lastTriedUrl = '';
        for (const ep of probeOrder) {
          if (!ep.baseUrl || !ep.authToken) continue;
          let token;
          try { token = await decryptToken(ep.authToken); }
          catch (_) { console.warn('[Campaign] Decrypt failed for', ep.baseUrl); continue; }

          const url = `${ep.baseUrl}/location-api/device/${DEVICE_UDID}/campaign_data`;
          lastTriedUrl = ep.baseUrl;
          try {
            const resp = await fetch(url, { headers: { accept: 'application/json', 'x-api-key': token } });
            if (resp.ok) {
              _activeEndpoint = { baseUrl: ep.baseUrl, token };
              _savePreferredBaseUrl(ep.baseUrl);
              _setApiError(null);
              json = await resp.json();
              console.log('[Campaign] Using endpoint:', ep.baseUrl);
              break;
            } else {
              console.warn(`[Campaign] ${ep.baseUrl} \u2014 HTTP ${resp.status}`);
            }
          } catch (fetchErr) {
            console.warn(`[Campaign] ${ep.baseUrl} \u2014 ${fetchErr.message}`);
          }
        }

        if (!json) {
          _setApiError(`All configured API endpoints failed. Last tried: ${lastTriedUrl || 'none'}`);
          return;
        }
      }
    }

    // ── Parse visitor_customer — handle both store-level and display-level responses ──
    // Store-level pushes populate json.data.visitor_customer directly.
    // Display-level pushes (display_ids) may return the same structure, but as a
    // safeguard we also check json.data directly as a fallback path.
    const d  = json?.data;
    const vc = d?.visitor_customer;

    // Resolve first_name: try visitor_customer first, then data root
    // String(...) guards against the real PH API returning a non-string
    // (e.g. a number) for any of these fields — (x || '').trim() throws
    // "trim is not a function" if x is truthy but not a string.
    const firstName = String(vc?.first_name || d?.first_name || '').trim() || null;

    // Device Type — confirmed live against demo.personalisationhub.com's
    // real /location-api/.../campaign_data response (30 Aug 2026):
    // visitor_customer.device_type is a real, present field (empty string
    // when no visitor is currently detected) — not a guess. Previously
    // had no live data source at all, so `deviceType` targeting could
    // never match anything; see TEST_DEVICE_TYPE's comment for the local-
    // simulation fallback this still keeps for boards that never poll.
    const deviceType = String(vc?.device_type || '').trim() || null;

    // The rest of Visitor / Customer Data (ph-designer skill
    // components.md §16's 17-field list) — all real visitor_customer
    // fields, confirmed live against demo.personalisationhub.com's own
    // campaign_data response 30 Aug 2026, same as device_type above.
    // age=0 is the API's "no visitor detected" sentinel here, the same
    // role an empty string plays for the string fields — not a real age.
    const companyName = String(vc?.company_name || '').trim() || null;
    const purchaseIntent = String(vc?.purchase_intent || '').trim() || null;
    const visitorType = String(vc?.visitor_type || '').trim() || null;
    const reasonForVisit = String(vc?.reason_for_visit || '').trim() || null;
    const age = (typeof vc?.age === 'number' && vc.age > 0) ? String(vc.age) : null;
    const gender = String(vc?.gender || '').trim() || null;
    // Audience / Segments is one field in the targeting UI but two
    // separate fields in the real API response (segments[] and a
    // standalone audience string) — combined here per the skill's own
    // note (components.md §16) to treat the dropdown, not the API shape,
    // as authoritative.
    const audienceSegments = [
      ...(Array.isArray(vc?.segments) ? vc.segments.filter(Boolean) : []),
      ...(vc?.audience ? [String(vc.audience).trim()].filter(Boolean) : []),
    ];
    const productTypes = Array.isArray(vc?.product_types) ? vc.product_types.filter(Boolean) : [];
    const planTypes = Array.isArray(vc?.plan_types) ? vc.plan_types.filter(Boolean) : [];
    const planValues = Array.isArray(vc?.plan_values) ? vc.plan_values.filter(Boolean) : [];
    const pageViews = Array.isArray(vc?.page_views) ? vc.page_views.filter(Boolean) : [];
    const events = Array.isArray(vc?.events) ? vc.events.filter(Boolean) : [];
    const productHoldings = Array.isArray(vc?.product_holdings) ? vc.product_holdings.filter(Boolean) : [];
    const purchaseHistory = Array.isArray(vc?.purchase_history) ? vc.purchase_history.filter(Boolean) : [];

    // Queueing / Aggregate Visitor Data — real queueing_appointment
    // fields, confirmed live against demo.personalisationhub.com's own
    // campaign_data response 30 Aug 2026. Aggregate stats about everyone
    // currently in the store's queue, not the one individual
    // visitor_customer describes above — a separate object in the same
    // response, never conflated with it.
    const qa = d?.queueing_appointment;
    const estimatedWaitingTime = (typeof qa?.estimated_waiting_time === 'number' && qa.estimated_waiting_time > 0) ? String(qa.estimated_waiting_time) : null;
    const numberOfVisitors = (typeof qa?.number_of_visitors === 'number' && qa.number_of_visitors > 0) ? String(qa.number_of_visitors) : null;
    const queueVisitorTypes = Array.isArray(qa?.visitor_type) ? qa.visitor_type.filter(Boolean) : [];
    const queueReasonForVisit = Array.isArray(qa?.reason_for_visit) ? qa.reason_for_visit.filter(Boolean) : [];
    const queueDeviceTypes = Array.isArray(qa?.device_type) ? qa.device_type.filter(Boolean) : [];

    // Resolve store_name from store_location
    const storeName = String(d?.store_location?.store_name || '').trim() || null;

    // Resolve this store's Fixed/Variable Store Segment membership from
    // store_location, same place store_name/store_timezone already come
    // from — used by _resolveItemOffersForStore() in getItems() above to
    // decide which of an item's several offers (if any) apply here. Never
    // sourced or managed locally; whatever the PH API returns is authoritative.
    const fixedSegments = Array.isArray(d?.store_location?.fixed_store_segments) ? d.store_location.fixed_store_segments : [];
    const variableSegments = Array.isArray(d?.store_location?.variable_store_segments) ? d.store_location.variable_store_segments : [];
    // Store Suburb / Store State targeting fields — sourced from
    // store_info.address_info, same PH API response as opening_hours.
    const suburb = String(d?.store_info?.address_info?.suburb || '').trim();
    const state = String(d?.store_info?.address_info?.state || '').trim();
    // Remaining Store/Location targeting fields (components.md §16) — all
    // sourced from the same store_location object as store_name/segments
    // above, confirmed live against a real campaign_data sample
    // (mock-languages.json) rather than guessed. Previously offered for
    // authoring only with no live data behind them at all.
    const storeCountry = String(d?.store_location?.store_country || '').trim();
    const displayTags = Array.isArray(d?.store_location?.display_tags) ? d.store_location.display_tags : [];
    const displayId = String(d?.store_location?.display_id || '').trim();
    const displayType = String(d?.store_location?.display_type || '').trim();
    const displayName = String(d?.store_location?.display_name || '').trim();
    const languagesSpokenByStaff = Array.isArray(d?.store_location?.languages) ? d.store_location.languages : [];

    // Resolve SKUs: try visitor_customer first, then data root
    // Filter out empty/blank strings that can appear in sparse API payloads
    // API may return field as "SKUs" (prompt schema) or "skus" (actual response) — handle both
    // Record the raw key/value for the debug panel
    if      (Array.isArray(vc?.SKUs)) { _dbgRawSkuKey = 'vc.SKUs'; _dbgRawSkuVal = vc.SKUs; }
    else if (Array.isArray(vc?.skus)) { _dbgRawSkuKey = 'vc.skus'; _dbgRawSkuVal = vc.skus; }
    else if (Array.isArray(d?.SKUs))  { _dbgRawSkuKey = 'd.SKUs';  _dbgRawSkuVal = d.SKUs;  }
    else if (Array.isArray(d?.skus))  { _dbgRawSkuKey = 'd.skus';  _dbgRawSkuVal = d.skus;  }
    else                              { _dbgRawSkuKey = null;       _dbgRawSkuVal = null;     }

    const rawSkus = _dbgRawSkuVal;
    const validSkus = rawSkus
      ? rawSkus.filter(e => typeof e === 'string' && e.trim() !== '')
      : null;
    const newSkus = (validSkus && validSkus.length > 0) ? validSkus : null;

    // Debug logging — visible in browser console; helps diagnose display-level issues
    console.log('[Campaign] visitor_customer:', JSON.stringify(vc));
    console.log('[Campaign] resolved \u2192 firstName:', firstName, '| SKUs:', newSkus, '| storeName:', storeName);

    const skusChanged       = JSON.stringify(newSkus) !== JSON.stringify(_campaignSkus);
    const nameChanged       = firstName !== _campaignFirstName;
    const deviceTypeChanged = deviceType !== _campaignDeviceType;
    const storeNameChanged  = storeName !== _storeName;
    const nextStoreProfile = { storeName, fixedSegments, variableSegments, suburb, state, storeCountry, displayTags, displayId, displayType, displayName, languagesSpokenByStaff };
    const segmentsChanged  = JSON.stringify(nextStoreProfile) !== JSON.stringify(_storeProfile);
    const nextVisitorProfile = { companyName, purchaseIntent, visitorType, reasonForVisit, age, gender, audienceSegments, productTypes, planTypes, planValues, pageViews, events, productHoldings, purchaseHistory };
    const visitorProfileChanged = JSON.stringify(nextVisitorProfile) !== JSON.stringify(_visitorProfile);
    const nextQueueProfile = { estimatedWaitingTime, numberOfVisitors, visitorTypes: queueVisitorTypes, reasonForVisit: queueReasonForVisit, deviceTypes: queueDeviceTypes };
    const queueProfileChanged = JSON.stringify(nextQueueProfile) !== JSON.stringify(_queueProfile);

    _dbgLastPoll = Date.now();
    if (skusChanged || nameChanged || deviceTypeChanged || storeNameChanged || segmentsChanged || visitorProfileChanged || queueProfileChanged) {
      _campaignSkus       = newSkus;
      _campaignFirstName  = firstName;
      _campaignDeviceType = deviceType;
      _storeName          = storeName;
      _storeProfile       = nextStoreProfile;
      _visitorProfile     = nextVisitorProfile;
      _queueProfile       = nextQueueProfile;
      render();
    } else {
      _updateDebugPanel();   // refresh Last poll time even when nothing changed
    }
  } catch (e) {
    console.warn('[Campaign] poll failed:', e);
    _setApiError(`Poll error \u2014 ${e.message}`);
  } finally {
    _pollInFlight = false;
  }
}

// ── FIRESTORE LISTENERS ──────────────────────────────────────────────────────
// None of the listeners below had an error callback before — a
// permission-denied (e.g. after a rules change) or a persistent connection
// error meant that one data source just silently stopped updating forever,
// with nothing visible to explain why an unattended board went stale.
// Reuses the same visible #apiErrorBadge the PH API path already has,
// rather than failing quietly.
function _onFirestoreError(label) {
  return err => _setApiError(`Firestore (${label}): ` + (err.message || err));
}

onSnapshot(collection(db, ITEMS_COLL), snap => {
  const newItems = snap.docs.map(d => d.data()).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  const h = _itemsFp(newItems);
  if (h === _itemsHash) return;   // data unchanged — skip render to preserve rotation timer
  _itemsHash = h;
  _items = newItems;
  render();
}, _onFirestoreError('items'));

onSnapshot(doc(db, MB, 'brands'), snap => {
  const newBrands = snap.exists() ? (snap.data().data || []) : [];
  const h = _fp(newBrands);
  if (h === _brandsHash) return;  // data unchanged — skip render
  _brandsHash = h;
  _brands = newBrands;
  const brand = getActiveBrand();
  const _titleBrand = brand || getBrands()[0];
  if (MENU_TYPE && MENU_META[MENU_TYPE]) {
    document.title = MENU_META[MENU_TYPE].label + (_titleBrand ? ' \u2014 ' + _titleBrand.name : ' \u2014 ' + STORE_CODE);
  }
  render();
  _pingBoardActivity(brand || _titleBrand);
}, _onFirestoreError('brands'));

onSnapshot(doc(db, MB, 'badgeTemplates'), snap => {
  const newTemplates = snap.exists() ? (snap.data().data || []) : [];
  const h = _fp(newTemplates);
  if (h === _badgeTemplatesHash) return;  // data unchanged — skip render
  _badgeTemplatesHash = h;
  _badgeTemplates = newTemplates;
  render();
}, _onFirestoreError('badge templates'));

onSnapshot(doc(db, MB, 'settings'), snap => {
  const newSettings = snap.exists() ? snap.data() : { brandName: 'Our Brand', currency: '$', logo: '', logoRight: '' };
  // Fix 1: only reset active endpoint when the endpoint list itself changes (preserves manual env selection)
  const endpointsChanged = JSON.stringify(_settings?.phApi?.endpoints)
                        !== JSON.stringify(newSettings?.phApi?.endpoints);
  const h = _fp(newSettings);
  _settings = newSettings;
  // Fix 2: only re-render when settings data actually changed
  if (h !== _settingsHash) {
    _settingsHash = h;
    render();
  }
  // Only force re-probe when endpoint config genuinely changed — not on every snapshot
  if (DEVICE_UDID && endpointsChanged) {
    _activeEndpoint = null;
    pollCampaign();
  }
}, _onFirestoreError('settings'));

// Per-store listeners — registered at top level like the ones above (not
// deferred behind DOMContentLoaded, which module scripts can otherwise
// race: it may already have fired by the time this script runs, leaving
// these listeners never attached and stock/local-featured/store-pricing
// permanently empty for the life of the page).
if (STORE_CODE) {
  onSnapshot(doc(db, STOCK_COLL, STORE_CODE), snap => {
    const newStock = snap.exists() ? snap.data() : {};
    const h = _fp(newStock);
    if (h === _stockHash) return;   // data unchanged — skip render
    _stockHash = h;
    _stock = newStock;
    render();
  }, _onFirestoreError('stock'));
  // Per-store Local Feature Highlight override, set from Retail Admin —
  // once a store has starred 3+ items, this replaces HQ's Featured list
  // for that store (see getEffectiveFeaturedSkus() in render()).
  onSnapshot(doc(db, LOCAL_FEATURED_COLL, STORE_CODE), snap => {
    const newLocalFeatured = snap.exists() ? snap.data() : {};
    const h = _fp(newLocalFeatured);
    if (h === _localFeaturedHash) return;
    _localFeaturedHash = h;
    _localFeatured = newLocalFeatured;
    render();
  }, _onFirestoreError('local featured'));
  // Per-store price override, set from Retail Admin's Pricing tab (only
  // shown there when HQ Admin has switched it on for the item's brand) —
  // a store's own price/offer/menu-board-copy for a sku, never affecting
  // any other store or HQ's own default. See getItems() below.
  onSnapshot(doc(db, STORE_PRICING_COLL, STORE_CODE), snap => {
    const newStorePricing = snap.exists() ? snap.data() : {};
    const h = _fp(newStorePricing);
    if (h === _storePricingHash) return;
    _storePricingHash = h;
    _storePricing = newStorePricing;
    render();
  }, _onFirestoreError('store pricing'));
}

// ── RENDER ───────────────────────────────────────────────────────────────────
// A thin, deliberately dumb wrapper around the real renderer. This board
// runs unattended for hours/days with no one to notice or refresh it — a
// single bad document (e.g. a product missing a field the sort/render path
// assumes exists) used to throw uncaught partway through _renderUnsafe(),
// which meant it never reached startRotation() at the bottom, permanently
// freezing the display on stale content with nothing visible to explain
// why. This catches that, logs it, and keeps retrying on a fixed interval
// so the board recovers on its own the moment the bad data is fixed or a
// fresh snapshot arrives, instead of staying stuck until someone manually
// reloads the screen.
function render() {
  try {
    _renderUnsafe();
  } catch (err) {
    console.error('[Board] render() failed — will retry in 10s:', err);
    setTimeout(render, 10000);
  }
}

function _renderUnsafe() {
  if (!STORE_CODE && !DEVICE_UDID) return;

  // brand = null means "no ?brand= param — show all brands"
  // themeSource is always a valid brand object used for colours, logos, layout
  const brand       = getActiveBrand();
  const themeSource = brand || getBrands()[0] || (() => {
    const s = getSettings();
    return { name: s.brandName || 'Our Brand', currency: s.currency || '$', logo: s.logo || '', logoRight: s.logoRight || '', colors: s.colors || {}, showClock: true, timeFormat: 'british', display: { portrait: { cols: 3, rows: 5, maxItems: 15 }, landscape: { cols: 5, rows: 3, maxItems: 15 } } };
  })();

  // ── TEMPLATE RESOLUTION ──────────────────────────────────────────────────────
  // Resolve the active Offer Board template and derive effective settings.
  // Template values always win over top-level brand defaults.
  let tpl = getActiveTemplate(brand || themeSource);

  // A visitor's own PH-API recommendations always drive the Feature Hero
  // Spotlight template when present — overriding whatever HQ Admin's
  // isDefault/?template= URL param would otherwise pick, AND (via the
  // eligibility bypass in the hero-layout branch further down) whatever
  // Retail Admin's Local Featured override or HQ's own Featured flag would
  // otherwise pick within that template. Personalisation outranks both.
  const isPersonalised = !!(_campaignSkus && _campaignSkus.length > 0 && _campaignFirstName);
  if (isPersonalised) {
    const heroTpl = (brand || themeSource).templates?.find(t => t.templateType === 'feature-hero-board');
    if (heroTpl) tpl = heroTpl;
  }

  // Local Feature Highlight needs >=3 qualifying Featured items (HQ, or a
  // store's own override once it has 3+) before it activates — below that,
  // the board falls back to rendering the brand's default template instead.
  // This re-resolution runs on every render (i.e. every data change), so a
  // store crossing the 3-item threshold flips the board automatically. If no
  // template has isDefault set, tpl is left as-is rather than showing blank.
  // Skipped while personalised — the Featured-flag eligibility check this
  // guards doesn't apply once the hero/promo pool is driven by campaign SKUs
  // instead (see the hero-layout branch below), so there's nothing threshold
  // to fall back from; even a single recommended item should still show.
  if (!isPersonalised && tpl && tpl.templateType === 'feature-hero-board') {
    const featuredSkus = getEffectiveFeaturedSkus(brand || themeSource);
    if (featuredSkus.size < 3) {
      const fallbackTpl = (brand || themeSource).templates?.find(t => t.isDefault);
      if (fallbackTpl) tpl = fallbackTpl;
    }
  }

  // Effective menu-type filter: the template's own "Item Type Filter" wins when
  // configured (this board always shows only those types, regardless of the
  // ?menu= URL param) — otherwise fall back to the URL, as before.
  const effectiveMenuTypes = (tpl && Array.isArray(tpl.menuTypes) && tpl.menuTypes.length > 0)
    ? tpl.menuTypes : MENU_TYPES;
  const effectiveMenuType  = effectiveMenuTypes[0] || '';
  if (!effectiveMenuType) return;
  const meta = MENU_META[effectiveMenuType];

  const effectiveColors       = (tpl && tpl.colors)      || themeSource.colors      || {};
  const effectiveDisplay      = (tpl && tpl.display)     || themeSource.display     || {};
  const effectiveShowHeader   = tpl ? (tpl.showHeader    !== false) : (themeSource.showHeader !== false);
  const effectiveShowClock    = tpl ? (tpl.showClock     !== false) : (themeSource.showClock  !== false);
  const effectiveCampaignMode = (tpl && tpl.campaignMode)    || themeSource.campaignMode    || 'override';
  const effectiveTimeFormat   = (tpl && tpl.timeFormat)      || themeSource.timeFormat      || 'british';
  const effectiveShowStoreName    = tpl ? (tpl.showStoreName    !== false) : true;
  const effectivePersonalGreeting = tpl ? (tpl.personalGreeting !== false) : true;
  const effectiveHeaderTitle      = (tpl && tpl.headerTitle)   || themeSource.name || ''; // main heading; falls back to brand name
  const effectiveHeaderCopy       = (tpl && tpl.headerCopy)   || '';         // sub-header; falls back to menu type label
  const effectiveIconPosition     = (tpl && tpl.iconPosition)  || 'left';
  const effectiveHeaderLogoType   = (tpl && tpl.headerLogoType)|| 'logo';
  const effectiveTemplateType     = (tpl && tpl.templateType)  || TEMPLATE_TYPE || '';
  const effectiveGridCategories   = (tpl && Array.isArray(tpl.categoriesToPresent) && tpl.categoriesToPresent.length > 0)
    ? tpl.categoriesToPresent : [];
  const effectiveHeroSize          = (tpl && tpl.heroSize)          || 'balanced';

  // Persist time format for updateClock() which runs outside render()
  _effectiveTimeFormat = effectiveTimeFormat;

  applyColorScheme({ colors: effectiveColors });

  // Apply orientation class to boardRoot
  const boardRoot = document.getElementById('boardRoot');
  boardRoot.className = 'board ' + ORIENTATION;

  // Dynamic CSS element
  let dynStyle = document.getElementById('dynamic-grid-css');
  if (!dynStyle) {
    dynStyle = document.createElement('style');
    dynStyle.id = 'dynamic-grid-css';
    document.head.appendChild(dynStyle);
  }

  const items = getItems();

  // ── LOGO RESOLUTION ────────────────────────────────────────────────────────
  // Determine which brand asset to use based on template's headerLogoType setting
  const _headerAsset = effectiveHeaderLogoType === 'icon'  ? (themeSource.icon || themeSource.logo || '')
                     : effectiveHeaderLogoType === 'none'  ? ''
                     : /* 'logo' default */                  (themeSource.logo || '');
  let logoLeft = '', logoRight = '';
  if      (effectiveIconPosition === 'left')   { logoLeft  = _headerAsset; }
  else if (effectiveIconPosition === 'right')  { logoRight = _headerAsset; }
  else if (effectiveIconPosition === 'both')   { logoLeft  = logoRight = _headerAsset; }
  // 'center' and 'none': both sides empty; center logo rendered inside header-center below

  const brandName = esc(themeSource.name     || 'Our Brand');
  const currency  = esc(themeSource.currency || '$');

  // Tab title reflects the effective menu type (template filter or URL), not the raw URL alone
  if (meta) document.title = meta.label + (themeSource ? ' — ' + themeSource.name : ' — ' + STORE_CODE);

  // ── STEP 1: Filter first so totalItems drives layout ────────────────────────
  // brand === null means no brand filter — show all active items for this menu type
  const allFiltered = items.filter(i =>
    i.active &&
    (effectiveMenuTypes.length === 0 || (i.menuTypes || []).some(t => effectiveMenuTypes.includes(t))) &&
    (brand === null || !i.brand || i.brand === brand.id)
  );

  // Apply hideOutOfStock — from template setting (wins) or brand default
  const displayFiltered = (effectiveDisplay && effectiveDisplay.hideOutOfStock)
    ? allFiltered.filter(i => !isOos(i.sku))
    : allFiltered;

  // ── STEP 1b: Apply campaign SKU filter (Personalisation Hub) ────────────────
  // When a Device UDID is in the URL and the API returns SKUs, override the display.
  // When brand === null (show-all mode), campaign SKU filtering is skipped entirely —
  // only a board with a defined brand applies personalised SKU filtering.
  let campaignFiltered = displayFiltered;
  if (_campaignSkus && _campaignSkus.length > 0 && brand !== null) {
    // effectiveCampaignMode always resolves to at least 'override' (its own
    // fallback chain, above), so there's no case where a Settings-level
    // default would ever be consulted — Campaign Mode is only ever set on
    // a Brand or a Board Template (see settingsSection-phApi's now-removed
    // dropdown, which never actually had any effect for that reason).
    const mode = effectiveCampaignMode;
    // Case-insensitive SKU set — handles mismatches between API and Firestore casing
    const skuSetLower = new Set(_campaignSkus.map(s => (s || '').trim().toLowerCase()));
    const skuMatch = i => skuSetLower.has((i.sku || '').trim().toLowerCase());
    if (mode === 'override') {
      // Ignore menu type — show any active item matching campaign SKUs (brand-constrained)
      campaignFiltered = items.filter(i =>
        i.active &&
        (!i.brand || i.brand === brand.id) &&
        skuMatch(i)
      );
      // Also apply hideOutOfStock if template/brand requires it
      if (effectiveDisplay && effectiveDisplay.hideOutOfStock) {
        campaignFiltered = campaignFiltered.filter(i => !isOos(i.sku));
      }
    } else {
      // 'filter' mode — campaign SKUs narrowed to current menu type
      campaignFiltered = displayFiltered.filter(i => skuMatch(i));
    }
    console.log('[Render] Campaign SKUs:', _campaignSkus, '| Matched', campaignFiltered.length, 'of', items.length, 'items');
    _dbgMatchCount = `${campaignFiltered.length} of ${items.length} items`;
  } else {
    _dbgMatchCount = null;
  }
  _updateDebugPanel();

  // ── STEP 1c: Apply "Categories to Present in Grid" (standard flat-grid boards) ──
  // Feature Hero Spotlight applies this separately, scoped to its supporting grid
  // (excluding the hero slot) — see the hero-layout branch further down.
  if (effectiveGridCategories.length > 0 && effectiveTemplateType !== 'feature-hero-board') {
    campaignFiltered = campaignFiltered.filter(i => effectiveGridCategories.includes(i.category || ''));
  }

  // ── STEP 1d: Menu-type-agnostic candidate pool for Local Feature Highlight ──
  // The Item Type Filter / ?menu= constraint baked into campaignFiltered above
  // is a "which menu is this" concept that doesn't apply to a curated Featured
  // selection — a store manager featuring a drinks item shouldn't have it
  // silently excluded because the board happens to be configured for lunch.
  // Recomputed without the menu-type clause, otherwise mirroring the same
  // active/brand/stock/personalisation rules as campaignFiltered.
  let featuredCandidates = campaignFiltered;
  if (effectiveTemplateType === 'feature-hero-board') {
    const allAnyMenuType = items.filter(i =>
      i.active && (brand === null || !i.brand || i.brand === brand.id)
    );
    const displayAnyMenuType = (effectiveDisplay && effectiveDisplay.hideOutOfStock)
      ? allAnyMenuType.filter(i => !isOos(i.sku))
      : allAnyMenuType;
    featuredCandidates = displayAnyMenuType;
    if (_campaignSkus && _campaignSkus.length > 0 && brand !== null) {
      // Same reasoning as the other campaignFiltered branch above —
      // effectiveCampaignMode already always resolves to a real value.
      const mode = effectiveCampaignMode;
      const skuSetLower = new Set(_campaignSkus.map(s => (s || '').trim().toLowerCase()));
      const skuMatch = i => skuSetLower.has((i.sku || '').trim().toLowerCase());
      if (mode === 'override') {
        featuredCandidates = items.filter(i => i.active && (!i.brand || i.brand === brand.id) && skuMatch(i));
        if (effectiveDisplay && effectiveDisplay.hideOutOfStock) {
          featuredCandidates = featuredCandidates.filter(i => !isOos(i.sku));
        }
      } else {
        featuredCandidates = displayAnyMenuType.filter(i => skuMatch(i));
      }
    }
  }

  // Sort: in-stock first, then by category, then name
  campaignFiltered.sort((a, b) => {
    const ao = isOos(a.sku), bo = isOos(b.sku);
    if (ao !== bo) return ao ? 1 : -1;
    if ((a.category || '') !== (b.category || '')) return (a.category || '').localeCompare(b.category || '');
    return (a.name || '').localeCompare(b.name || '');
  });

  const totalItems = campaignFiltered.length;

  // ── STEP 2: Compute layout from the brand/template's configured display settings ──
  // Always honoured — no automatic override based on how many items happen to be
  // on the page — so Cols / Rows / Max Items configured in the template editor
  // are reflected on every board, whether it's showing 2 items or 80.
  const dispCfg   = (effectiveDisplay && effectiveDisplay[ORIENTATION]) || {};
  const COLS      = Math.max(1, parseInt(dispCfg.cols)  || (ORIENTATION === 'portrait' ? 2 : 3));
  const ROWS      = Math.max(1, parseInt(dispCfg.rows)  || (ORIENTATION === 'portrait' ? 3 : 2));
  const PAGE_SIZE = Math.min(
    Math.max(1, parseInt(dispCfg.maxItems) || (COLS * ROWS)),
    COLS * ROWS
  );

  // Larger source photo once cards are spacious (1–2 columns); compact thumbnail
  // once the grid gets denser — driven by the actual configured column count,
  // not by how many items happen to be on the page.
  const isLargeTileLayout = COLS <= 2;

  // A targeted asset always overrides the default the instant its own
  // targeting rule matches this store/visitor — Product Assets
  // (ProductAssetsTab.jsx) enforces the two as mutually exclusive (an
  // asset can't be both default and targeted), so there's no ambiguity to
  // resolve here: the first targeted asset whose rule matches wins over
  // whatever's marked default. Reuses the same category-aware condition
  // matcher as offer targeting (_offerTargetingMatches above) since asset
  // targeting is built from the identical TargetingBuilder.jsx shape.
  // imagesRich is index-aligned with images/imagesLarge (src stripped out
  // — see migration.js toItemDoc()'s comment), so the matched index reads
  // straight across to the actual src arrays. `allowVideo` false excludes
  // video-type assets from matching at all — every panel except the
  // Feature Hero Spotlight's own primary panel must never end up showing
  // a targeted video, only a targeted photo.
  // Scheduling now lives on each individual targeting GROUP (see
  // _inSchedule/_offerTargetingMatches, top-level, above) rather than on
  // the asset as a flat field — a schedule-only group (Product Assets:
  // delete a group's conditions down to nothing, leaving just its
  // schedule) is still "conditioned" in the sense that matters here: it's
  // a real rule that can override the default, just one with no value
  // check attached, only a time window.
  function _isConditionedAsset(r) {
    return !!(r && Array.isArray(r.targeting) && r.targeting.length);
  }

  function _pickTargetedAssetIndex(item, allowVideo) {
    const rich = item.imagesRich;
    if (!Array.isArray(rich)) return -1;
    // _offerTargetingMatches itself now checks each group's own schedule
    // window as part of matching — no separate asset-level schedule check
    // needed here any more.
    return rich.findIndex(r => r && _isConditionedAsset(r) && (allowVideo || r.type !== 'video') && _offerTargetingMatches(r.targeting, _storeProfile));
  }

  // A product can carry a default *image* and a default *video* at once
  // (ProductAssetsTab.jsx's setDefault() scopes "one default" to each type
  // independently) — migration.js's toItemDoc() always moves the default
  // image (never a default video) to index 0, so images[0]/imagesRich[0]
  // is normally already the right answer here. Still walks the array to
  // find the first non-video entry as a defensive fallback for any legacy
  // item saved before that reordering rule existed — and, now, to skip
  // past a default that's marked default but outside its own Schedule
  // from/until window, the same way a stale-but-still-marked-default asset
  // was already being defended against.
  function _defaultImageIndex(item) {
    const rich = item.imagesRich;
    if (!Array.isArray(rich) || !rich.length) return (item.images && item.images.length) ? 0 : -1;
    // _inSchedule(rich[0]) is a defensive check, not an expected case: the
    // default can no longer carry its own schedule at all (Product Assets
    // hides that whole section for it) — this only still matters for
    // legacy data saved before that rule existed.
    if (rich[0] && rich[0].type !== 'video' && _inSchedule(rich[0])) return 0;
    return rich.findIndex(r => r && r.type !== 'video' && _inSchedule(r));
  }

  // The default *video*, if one is set (and currently in schedule) — only
  // ever looked up by the Feature Hero Spotlight's primary panel
  // (_pickHeroSrc below).
  function _defaultVideoIndex(item) {
    const rich = item.imagesRich;
    if (!Array.isArray(rich)) return -1;
    return rich.findIndex(r => r && r.type === 'video' && r.isDefault && _inSchedule(r));
  }

  function _srcAt(item, idx, preferLarge) {
    if (idx == null || idx < 0) return '';
    const small = item.images      && item.images[idx];
    const large = item.imagesLarge && item.imagesLarge[idx];
    return (preferLarge ? (large || small) : (small || large)) || '';
  }

  // Picks the best image URL for an item given the current layout size —
  // used by every panel EXCEPT the Feature Hero Spotlight's primary panel
  // (grid cells, promo tiles, and anywhere else an item's photo shows).
  // Video is never eligible here, whether it's the default or a matching
  // targeted asset — video only ever appears in the one primary panel.
  function _pickImage(item) {
    const targetedIdx = _pickTargetedAssetIndex(item, false);
    if (targetedIdx !== -1) {
      const picked = _srcAt(item, targetedIdx, isLargeTileLayout);
      if (picked) return picked;
    }
    return _srcAt(item, _defaultImageIndex(item), isLargeTileLayout);
  }

  // Picks the source for the Feature Hero Spotlight's primary panel only
  // — the one place a default video is actually used. A matching targeted
  // asset (image or video) still wins first, same as every other panel;
  // failing that, the default video takes priority over the default image
  // here specifically, which is the whole point of having both.
  function _pickHeroSrc(item) {
    const rich = item.imagesRich;
    const targetedIdx = _pickTargetedAssetIndex(item, true);
    if (targetedIdx !== -1) {
      const picked = _srcAt(item, targetedIdx, true);
      if (picked) return { src: picked, isVideo: !!(Array.isArray(rich) && rich[targetedIdx] && rich[targetedIdx].type === 'video') };
    }
    const videoIdx = _defaultVideoIndex(item);
    if (videoIdx !== -1) {
      const picked = _srcAt(item, videoIdx, true);
      if (picked) return { src: picked, isVideo: true };
    }
    return { src: _srcAt(item, _defaultImageIndex(item), true), isVideo: false };
  }

  // A product's default asset can be a video, not just a photo. Used to be
  // detected purely off the src string itself (a `data:video/` prefix,
  // since Product Assets stored every asset — image or video — as a base64
  // data URI). Generate Video (ProductAssetsTab.jsx's confirmGenerateVideo)
  // broke that assumption: it stores the video provider's own hosted
  // `https://` result URL as-is, which has no `data:video/` prefix and no
  // reliable file extension to sniff either — confirmed live, that made a
  // generated video's hero panel render as a broken `<img>` instead of a
  // `<video>`. `_isVideoSrc` is kept as a fallback for the two call sites
  // that never handle video (the grid cell and promo tile — always
  // `_pickImage`'s result, real image data URIs, so the sniff still gives
  // the right answer there); the hero panel — the only place a video can
  // actually appear — now passes its already-known type straight from
  // `_pickHeroSrc` instead of re-guessing it from the URL shape.
  function _isVideoSrc(src) {
    return typeof src === 'string' && /^data:video\//.test(src);
  }

  // Renders whichever media the item's picked src actually is — muted/
  // autoplay/loop so it behaves like ambient signage, not something a
  // customer has to press play on. Falls back to the same onerror swap
  // <img> already used per call site, so a corrupt/oversized asset
  // degrades to that site's own placeholder instead of a dead player.
  // `isVideo`, when passed explicitly (the hero panel), overrides the
  // src-sniffing fallback described in _isVideoSrc's comment above.
  function _mediaTag(src, alt, placeholderClass, placeholderEmoji, isVideo) {
    const onerror = `this.replaceWith(Object.assign(document.createElement('div'),{className:'${placeholderClass}',textContent:'${placeholderEmoji}'}))`;
    const video = isVideo !== undefined ? isVideo : _isVideoSrc(src);
    if (video) {
      return `<video src="${esc(src)}" preload="auto" autoplay muted loop playsinline disablepictureinpicture onerror="${onerror}"></video>`;
    }
    return `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="${onerror}">`;
  }

  // Mutable: the Feature Hero Spotlight layout recomputes this below from its own
  // hero-rotation + secondary-grid-overflow page count, so the footer and the
  // shared rotation clock reflect what's actually rotating on screen.
  let totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));

  // Clamp currentPage — skipped for Feature Hero Spotlight, which recomputes
  // totalPages from its own hero-rotation + grid-overflow page count further
  // down and clamps there instead; clamping here first (against this flat-grid
  // totalPages, which is irrelevant to that layout) would stomp a valid
  // rotated/locked page back down to 1 before the hero branch ever sees it.
  if (effectiveTemplateType !== 'feature-hero-board') {
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
  }

  // Slice page
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageItems = campaignFiltered.slice(pageStart, pageStart + PAGE_SIZE);

  // ── STEP 3: Inject this page's grid track sizing ─────────────────────────────
  const gridRows = Math.max(1, Math.ceil(pageItems.length / COLS));
  dynStyle.textContent = `
    .items-grid {
      grid-template-columns: repeat(${COLS}, 1fr) !important;
      grid-template-rows: repeat(${gridRows}, 1fr) !important;
    }
  `;

  // ── HEADER ──────────────────────────────────────────────────────────────────
  const logoSlot = (src, side) => src
    ? `<div class="header-logo-wrap"><img src="${esc(src)}" alt="${esc(side)} logo"></div>`
    : `<div class="header-logo-wrap no-logo"></div>`;

  const showHeader = effectiveShowHeader;
  const showClock  = effectiveShowClock;
  // The greeting/store-name row is independently useful from the clock — templates
  // like Feature Hero Spotlight hide the clock by default (dark, immersive layout)
  // but should still surface a personalised "Recommended for you" message when the
  // Personalisation Hub API has pushed a First Name for this device. So the bar
  // renders whenever either the clock is on, or personalisation has something to show.
  // Once personalisation is actively driving the board onto Feature Hero
  // Spotlight (isPersonalised, TEMPLATE RESOLUTION section above — this
  // template was forced BECAUSE this visitor has recommendations), showing
  // who it's for is the whole point: a template's own Personal Greeting
  // toggle (meant for a non-personalised, generic "Featured Items" board)
  // doesn't get a vote in that case. Outside personalised-hero, the toggle
  // still governs exactly as before.
  const showPersonalised = !!_campaignFirstName
    && (effectivePersonalGreeting || (isPersonalised && effectiveTemplateType === 'feature-hero-board'));
  const showStoreNameRow = effectiveShowStoreName && !!_storeName;
  const showInfoBar = showClock || showPersonalised || showStoreNameRow;
  // Personalisation takes the whole top bar for itself on the Feature Hero
  // Spotlight template specifically — no clock sharing the row — so the
  // greeting reads as its own dedicated banner spanning the full board
  // width, not one flex child fighting the clock for space off to the side.
  const isPersonalisedHero = showPersonalised && effectiveTemplateType === 'feature-hero-board';
  const showClockInBar = showClock && !isPersonalisedHero;
  const headerHtml = `
    ${showHeader ? `
    <div class="board-header">
      ${logoSlot(logoLeft, 'Left')}
      <div class="header-center">
        ${effectiveIconPosition === 'center' && _headerAsset
          ? `<img src="${esc(_headerAsset)}" alt="${brandName} logo" style="height:2.4em;max-width:180px;object-fit:contain;margin-bottom:4px;">`
          : ''}
        <div class="header-brand">${esc(effectiveHeaderTitle)}</div>
        <div class="header-menu-type">${esc(effectiveHeaderCopy || meta.label)}</div>
      </div>
      ${logoSlot(logoRight, 'Right')}
    </div>
    ` : ''}
    ${showInfoBar ? `
      <div class="clock-bar${isPersonalisedHero ? ' clock-bar-personalised' : ''}">
        ${MOCK_API_FILE ? `<span class="mock-badge">🧪 MOCK</span>` : ''}
        ${showPersonalised
          ? `<div class="greeting-text">${esc(_campaignFirstName).toUpperCase()}, THIS IS WHAT WE RECOMMEND FOR YOU</div>`
          : (showStoreNameRow ? `<div class="greeting-text">${esc(_storeName)}</div>` : '')}
        ${showClockInBar ? `<div class="time-display" id="clockDisplay"></div>` : ''}
      </div>
    ` : ''}
  `;

  // ── BODY ────────────────────────────────────────────────────────────────────
  let bodyHtml = '';

  // Helper to render a standard item card — full-width hero photo on top
  // with the category badge floating over its top-right corner, then name
  // + description below, divider, then a footer with price on the left and
  // calorie/kilojoule info on the right.
  function _itemCell(item) {
    const oos = isOos(item.sku);
    const cat = item.category || '';
    const cellImg = _pickImage(item);
    const thumbInner = cellImg
      ? _mediaTag(cellImg, item.name, 'item-thumb-placeholder', '🍽️')
      : `<div class="item-thumb-placeholder">🍽️</div>`;
    const desc = item.description ? `<div class="item-desc">${esc(item.description)}</div>` : '';
    const menuNote = shouldShowMenuNote(item) ? `<div class="menu-board-note" style="${menuNoteStyleAttr()}">${esc(item.showOnMenuBoard)}</div>` : '';
    const locationNote = locationBadgeHtml(item);
    const notes = menuNote + locationNote;
    return `
      <div class="item-cell${oos ? ' oos-cell' : ''}">
        <div class="item-thumb">
          ${thumbInner}
          ${cat ? `<span class="item-cat-badge" style="${badgeStyleForTemplateId('category')}">${esc(cat)}</span>` : ''}
        </div>
        <div class="item-body">
          <div class="item-name">${esc(item.name)}</div>
          ${desc}
          <div class="item-divider"></div>
          <div class="item-footer">
            <span class="item-price">${priceHtml(item, currency, 'price-was')}</span>
            ${buildNutrition(item)}
          </div>
          ${notes}
        </div>
        <div class="oos-overlay"><div class="oos-stamp" style="${badgeStyleForTemplateId('soldOut')}"><div class="oos-stamp-text">SOLD OUT</div></div></div>
      </div>`;
  }

  if (!totalItems) {
    const campaignActive = _campaignSkus && _campaignSkus.length > 0;
    bodyHtml = `
      <div class="board-empty">
        <div class="icon">${meta.emoji}</div>
        <h2>${campaignActive ? 'No Recommended Items' : 'No Items Available'}</h2>
        <p>${campaignActive
          ? 'No menu items match your personalised selection.'
          : `There are currently no active ${esc(meta.label)} items for this location.`
        }</p>
      </div>
    `;
  } else if (effectiveTemplateType === 'feature-hero-board') {
    // ── LOCAL FEATURE HIGHLIGHT LAYOUT ────────────────────────────────────────
    // A full-bleed image (no overlay copy) beside/above a stack of equally-
    // weighted promo cards — "just show promotions", not one dominant item
    // with a small supporting grid. Item selection is normally driven
    // entirely by the Featured flag (HQ Admin), overridable per store from
    // Retail Admin — see getEffectiveFeaturedSkus() — UNLESS this visitor
    // has personalised PH-API recommendations, in which case those always
    // win instead (see isPersonalised below): the campaign SKU list IS
    // the featured list for a personalised visitor, bypassing both the
    // Featured flag and its own store-level override entirely, not just
    // supplementing them. By the time render() reaches here, tpl has
    // already been re-resolved to the brand's default template if fewer
    // than 3 qualifying (non-personalised) Featured items exist, so
    // featuredPool below is expected to have >=3 items in that normal case
    // (it can still be smaller for this specific menu type/screen if some
    // Featured items belong to others) — personalised mode has no such
    // minimum; even a single recommendation still plays.
    // isPersonalised (not isPersonalisedHero) gates this — isPersonalisedHero
    // is greeting-driven and can be true from _campaignFirstName alone with
    // no SKUs at all, which would make the .map() below blow up on a null
    // _campaignSkus. isPersonalised guarantees _campaignSkus is a non-empty
    // array (see its own definition, TEMPLATE RESOLUTION section above).
    let featuredPool;
    if (isPersonalised) {
      // Order IS the PH API's own recommendation rank — featuredCandidates
      // is already scoped to this visitor's campaign SKUs (STEP 1d above),
      // so this just reorders that set to match _campaignSkus, discarding
      // whatever incidental order .filter() left it in. featurePriority
      // (below, non-personalised branch) never applies here.
      const bySku = new Map(featuredCandidates.map(i => [(i.sku || '').trim().toLowerCase(), i]));
      featuredPool = _campaignSkus
        .map(sku => bySku.get((sku || '').trim().toLowerCase()))
        .filter(Boolean);
    } else {
      const featuredSkus = getEffectiveFeaturedSkus(brand || themeSource);
      // Feature priority (HQ Admin, Product Details — 1 = highest) decides
      // which item leads: sorted ascending, with unset/blank priority sinking
      // to the end (stable sort keeps their relative order otherwise).
      featuredPool = featuredCandidates.filter(i => featuredSkus.has(i.sku)).slice().sort((a, b) => {
        const pa = parseInt(a.featurePriority, 10);
        const pb = parseInt(b.featurePriority, 10);
        const va = isNaN(pa) ? Infinity : pa;
        const vb = isNaN(pb) ? Infinity : pb;
        return va - vb;
      });
    }

    if (featuredPool.length === 0) {
      bodyHtml = isPersonalised ? `
        <div class="board-empty">
          <div class="icon">${meta.emoji}</div>
          <h2>No Recommended Items</h2>
          <p>None of ${esc(_campaignFirstName)}'s recommended items are currently available on this menu.</p>
        </div>
      ` : `
        <div class="board-empty">
          <div class="icon">${meta.emoji}</div>
          <h2>No Featured Items</h2>
          <p>No Featured items are configured for this menu. Feature at least 3 products from the product table (HQ Admin, or a store's own picks in Retail Admin) to activate this board.</p>
        </div>
      `;
    } else {
      // Promo card count from template settings — defaults to 2 stacked cards.
      const promoCols = ORIENTATION === 'portrait'
        ? (parseInt((effectiveDisplay.portrait || {}).cols) || 1)
        : (parseInt((effectiveDisplay.landscape || {}).cols) || 1);
      const promoRows = ORIENTATION === 'portrait'
        ? (parseInt((effectiveDisplay.portrait || {}).rows) || 2)
        : (parseInt((effectiveDisplay.landscape || {}).rows) || 2);
      const promoMax = promoCols * promoRows;

      // Rotation is a sliding window around the Featured pool, treated as a
      // ring: each page's hero is the next item in sequence, and the promo
      // cards are simply the promoMax items that immediately follow it in
      // that same ring (wrapping back to the start past the end). Advancing
      // one page slides the whole window forward by one, so every item gets
      // a turn as hero and every promo slot is filled on every page — no
      // separate "promo pages vs hero pages" pagination to keep in sync,
      // which is what let some pages fall out of step and land on a
      // partially-filled or duplicated promo row once there were enough
      // Featured items (5+) that the two paginations' cycle lengths no
      // longer lined up. Total pages is just the pool size — one full lap
      // shows every item as hero exactly once.
      totalPages = featuredPool.length;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const heroIndex = (currentPage - 1) % featuredPool.length;
      const heroItem = featuredPool[heroIndex];
      const promoSlots = Math.min(promoMax, featuredPool.length - 1);
      const promoPage = [];
      for (let k = 1; k <= promoSlots; k++) {
        promoPage.push(featuredPool[(heroIndex + k) % featuredPool.length]);
      }

      // Start warming whatever the hero rotates to NEXT — see
      // _preloadNextHeroVideo's comment — using the rest of this
      // rotation's own interval as the head start. A pool of 1 never
      // rotates (startRotation no-ops below totalPages<=1), so there's
      // deliberately no "next" to warm in that case.
      if (featuredPool.length > 1) {
        const nextHero = _pickHeroSrc(featuredPool[(heroIndex + 1) % featuredPool.length]);
        _preloadNextHeroVideo(nextHero.src, nextHero.isVideo);
      }

      // Hero image panel size — fine-tunes how much of the screen the image
      // takes versus the promo cards (compact 32% / balanced 42% / dominant 55%).
      const heroFlexBasis = effectiveHeroSize === 'compact' ? '32%'
        : effectiveHeroSize === 'dominant' ? '55%'
        : '42%';

      dynStyle.textContent += `
        .promo-hero { --hero-flex-basis: ${heroFlexBasis}; }
        .promo-list {
          grid-template-columns: repeat(${promoCols}, 1fr) !important;
          grid-template-rows: repeat(${promoRows}, 1fr) !important;
        }
      `;

      // Centre/right alignment (Tile Layout editor) needs somewhere to sit
      // — a box that already shrink-wraps to its own text has no spare
      // room to align into. .promo-hero-top normally does exactly that
      // (align-items:flex-start, max-width:80%), same as the description
      // column inside each bottom bar (max-width:68%). Both are widened to
      // a real, full-width box only when this template actually has a
      // saved layout to align — every other board's identical-looking
      // elements keep shrink-wrapping exactly as before. .promo-cat and
      // .menu-board-note already carry their own align-self:flex-start, so
      // switching the parent to align-items:stretch doesn't turn either
      // into a full-width bar — only genuine text/description elements
      // (which have no such override) actually gain the extra width.
      if (tpl && tpl.heroLayout) {
        dynStyle.textContent += `
          .promo-hero-top { right: 0; max-width: none; align-items: stretch; }
          .promo-hero-bottom .promo-hero-desc-col { flex: 0 1 68%; max-width: 68%; }
        `;
      }
      if (tpl && tpl.promoLayout) {
        dynStyle.textContent += `
          .promo-tile-desc .promo-desc-col { flex: 0 1 68%; max-width: 68%; }
        `;
      }

      // Build hero image panel — full-bleed photo with product info/pricing in
      // a top-left card (black text) and the description in its own card at
      // the bottom (grey text), the same fields shown on each promo card.
      // The one place a default video is used at all — see _pickHeroSrc.
      const heroSrc = _pickHeroSrc(heroItem);
      const heroImgHtml = heroSrc.src
        ? _mediaTag(heroSrc.src, heroItem.name, 'promo-hero-placeholder', '🏷️', heroSrc.isVideo)
        : `<div class="promo-hero-placeholder">🏷️</div>`;
      // Tile Layout (hq-admin.html ▸ Settings ▸ Offer Boards ▸ this template's
      // Tile Layout editor) takes over entirely once a brand has configured
      // one — including badge placement/order, which otherwise always
      // sits directly after the price below. Left unset, every existing
      // brand's hero panel renders exactly as it always has.
      const heroCtx = { currency, titleClass: 'promo-hero-title', priceClass: 'promo-hero-price', descColClass: 'promo-hero-desc-col', descClass: 'promo-hero-desc' };
      let heroTopHtml, heroBottomHtml;
      if (tpl && tpl.heroLayout) {
        heroTopHtml = `<div class="promo-hero-top">${renderTileZone(tpl.heroLayout.top, heroItem, heroCtx)}</div>`;
        const heroBottomInner = renderTileZone(tpl.heroLayout.bottomLeft, heroItem, heroCtx) + renderTileZone(tpl.heroLayout.bottomRight, heroItem, heroCtx);
        heroBottomHtml = heroBottomInner ? `<div class="promo-hero-bottom">${heroBottomInner}</div>` : '';
      } else {
        const heroCat = heroItem.category ? `<div class="promo-cat" style="${badgeStyleForTemplateId('category')}">${esc(heroItem.category)}</div>` : '';
        const heroMenuNote = shouldShowMenuNote(heroItem) ? `<div class="menu-board-note" style="${menuNoteStyleAttr()}">${esc(heroItem.showOnMenuBoard)}</div>` : '';
        const heroLocationNote = locationBadgeHtml(heroItem);
        heroTopHtml = `
          <div class="promo-hero-top">
            ${heroCat}
            <div class="promo-hero-title">${esc(heroItem.name)}</div>
            <div class="promo-hero-price">${priceHtml(heroItem, currency, 'price-was')}</div>
            ${heroMenuNote}${heroLocationNote}
          </div>`;
        // Bottom bar: description on the left (≤50% width via CSS),
        // calorie/kilojoule info hugging the right edge — nutrition-block's
        // own margin-left:auto positions it regardless of whether the
        // description column is present.
        const heroDescHtml = heroItem.description
          ? `<div class="promo-hero-desc-col"><div class="promo-hero-desc">${esc(heroItem.description)}</div></div>` : '';
        const heroNutrHtml = buildNutrition(heroItem);
        heroBottomHtml = (heroDescHtml || heroNutrHtml)
          ? `<div class="promo-hero-bottom">${heroDescHtml}${heroNutrHtml}</div>`
          : '';
      }

      // Build promo tiles — striped accent bar, category/title/price in the
      // text column, then a bottom bar overlaid across the full width of
      // the tile (text column + photo) with description on the left
      // (≤50% width) and calorie/kilojoule info hugging the right edge.
      const promoCtx = { currency, titleClass: 'promo-title', priceClass: 'promo-price', descColClass: 'promo-desc-col', descClass: 'promo-desc' };
      const promoTilesHtml = promoPage.map(item => {
        // The "small panel" — always the image, never the video, even if
        // this item's default/targeted video would otherwise apply.
        const src = _pickImage(item);
        const img = src
          ? _mediaTag(src, item.name, 'promo-img-placeholder', '🍽️')
          : `<div class="promo-img-placeholder">🍽️</div>`;

        if (tpl && tpl.promoLayout) {
          const textHtml = renderTileZone(tpl.promoLayout.textColumn, item, promoCtx);
          const bottomInner = renderTileZone(tpl.promoLayout.bottomLeft, item, promoCtx) + renderTileZone(tpl.promoLayout.bottomRight, item, promoCtx);
          const bottomHtml = bottomInner ? `<div class="promo-tile-desc">${bottomInner}</div>` : '';
          return `
            <div class="promo-tile">
              <div class="promo-text">${textHtml}</div>
              <div class="promo-img-wrap">${img}</div>
              ${bottomHtml}
            </div>`;
        }

        const descHtml = item.description
          ? `<div class="promo-desc-col"><div class="promo-desc">${esc(item.description)}</div></div>` : '';
        const nutrHtml = buildNutrition(item);
        const bottomHtml = (descHtml || nutrHtml)
          ? `<div class="promo-tile-desc">${descHtml}${nutrHtml}</div>` : '';
        const cat = item.category ? `<div class="promo-cat" style="${badgeStyleForTemplateId('category')}">${esc(item.category)}</div>` : '';
        const menuNote = shouldShowMenuNote(item) ? `<div class="menu-board-note" style="${menuNoteStyleAttr()}">${esc(item.showOnMenuBoard)}</div>` : '';
        const locationNote = locationBadgeHtml(item);
        return `
          <div class="promo-tile">
            <div class="promo-text">
              ${cat}
              <div class="promo-title">${esc(item.name)}</div>
              <div class="promo-price">${priceHtml(item, currency, 'price-was')}</div>
              ${menuNote}${locationNote}
            </div>
            <div class="promo-img-wrap">${img}</div>
            ${bottomHtml}
          </div>`;
      }).join('');

      bodyHtml = `
        <div class="promo-board">
          <div class="promo-hero">${heroImgHtml}${heroTopHtml}${heroBottomHtml}</div>
          <div class="promo-list">${promoTilesHtml}</div>
        </div>`;
    }
  } else {
    // Standard flat grid — all items on this page
    const cells = pageItems.map(_itemCell).join('');
    bodyHtml = `<div class="board-body"><div class="items-grid">${cells}</div></div>`;
  }

  // ── FOOTER ──────────────────────────────────────────────────────────────────
  let pageInfoText = '';
  if (totalPages > 1) {
    pageInfoText = SCREEN_LOCK
      ? `Screen ${currentPage} of ${totalPages} (locked)`
      : `Screen ${currentPage} of ${totalPages}`;
  }

  const showProgressBar = !SCREEN_LOCK && totalPages > 1;

  // Feature Hero Spotlight has no footer — the promo tiles run edge to edge
  // to the bottom of the screen instead of leaving room for a status bar.
  const footerHtml = effectiveTemplateType === 'feature-hero-board' ? '' : `
    <div class="board-footer">
      <div class="footer-text">${brandName} — ${esc(meta.label)}</div>
      <div class="footer-page-info">${esc(pageInfoText)}</div>
      <div class="footer-refresh">
        <span class="refresh-dot"></span> Live sync enabled
      </div>
    </div>
    ${showProgressBar ? '<div class="rotation-bar-wrap"><div class="rotation-bar" id="rotationBar"></div></div>' : ''}
  `;

  // UK Calorie Labelling (Out of Home Sector) Regulations 2021 require this
  // reference statement wherever calorie information is displayed — shown
  // once per screen (not per item), and only on a screen that's actually
  // showing calories at all. Positioned absolutely so it survives on every
  // template, including Feature Hero Spotlight's footer-less layout.
  const kcalDisclaimerHtml = pageItems.some(i => i.calories != null)
    ? `<div class="kcal-disclaimer">Adults need around 2000 kcal a day</div>` : '';

  // ── INJECT ──────────────────────────────────────────────────────────────────
  boardRoot.innerHTML = headerHtml + bodyHtml + footerHtml + kcalDisclaimerHtml;

  updateClock();

  if (!SCREEN_LOCK && totalPages > 1) {
    const effectiveRotationSeconds = (tpl && parseInt(tpl.rotationSeconds)) || DEFAULT_ROTATION_SECONDS;
    startRotation(totalPages, effectiveRotationSeconds * 1000);
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (!MENU_TYPE || (!STORE_CODE && !DEVICE_UDID)) {
    const missing = !MENU_TYPE
      ? 'a Menu Type (<code>?menu=supplements</code>)'
      : 'a Store Code (<code>?store=STORE001</code>) or Device UDID (<code>?device=…</code>)';
    document.getElementById('boardRoot').innerHTML = `
      <div class="error-board">
        <svg width="72" height="72" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KFC" style="margin-bottom:20px;">
          <circle cx="150" cy="150" r="150" fill="#ffffff"/>
          <text x="150" y="128" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#e4002b">KFC</text>
          <text x="150" y="190" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e4002b" letter-spacing="1">KENTUCKY FRIED</text>
          <text x="150" y="212" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e4002b" letter-spacing="1">CHICKEN</text>
        </svg>
        <h2>Invalid Offer Board URL</h2>
        <p>This offer board requires ${missing}.</p>
        <br>
        <p>Example URLs:</p>
        <code>menu-board.html?store=STORE001&amp;menu=supplements</code><br>
        <code>menu-board.html?device=&lt;UDID&gt;&amp;menu=vitamins</code>
        <a href="index.html">← Back to Portal</a>
      </div>
    `;
    return;
  }

  updateClock();
  setInterval(updateClock, 1000);

  // Campaign polling — only active when a Device UDID is provided in the URL.
  // Key derivation is cached so only the first call pays the PBKDF2 cost (~100ms);
  // subsequent polls reuse the cached token and complete in network time only.
  if (DEVICE_UDID) {
    // Kick off key derivation immediately so it is ready before the first poll
    _deriveKey();
    pollCampaign();                   // immediate first call
    setInterval(pollCampaign, 5000);  // then every 5 s for near-instant updates
  }
});
</script>

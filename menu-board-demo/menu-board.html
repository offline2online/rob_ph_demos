<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:            #006241;
      --green-dark:       #004d33;
      --green-light:      #d4edda;
      --cream:            #f9f4ec;
      --cream2:           #f0e9dc;
      --white:            #ffffff;
      --text:             #1a1a1a;
      --text2:            #444444;
      --border:           #d4c8b8;
      --border-lt:        #e8dfd3;
      --danger:           #c0392b;
      --board-header-bg:  #ffffff;
      --cat-bar-bg:       #006241;
      --price-color:      #004d33;
      --item-color:       #004d33;  /* item name text — set from colors.text */
      --item-text:        #1a1a1a;  /* hero item name text — set from colors.text */
      --item-bg:          #ffffff;  /* item card background */
      --item-desc:        #444444;  /* short description / secondary item text */
      --header-text:      #006241;
      --clock-text:       #1e293b;
      --clock-bg:         #f0f4f8;  /* clock bar background */
      --accent:           #006241;  /* explicit accent var (mirrors --green) */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── BOARD WRAPPER ─────────────────────── */
    .board {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--cream);
    }

    /* ── HEADER ────────────────────────────── */
    /* Fixed header bar height — uses vmin (the smaller of width/height) rather
       than vw, so a screen showing the same physical panel rotated between
       landscape and portrait renders an identical header height in both. This
       is set once here and intentionally NOT overridden per orientation or
       per template, so every menu board has a matching header height. */
    .board-header {
      background: var(--board-header-bg, #ffffff);
      border-bottom: 3px solid var(--green);
      height: 175px;
      padding: 0 clamp(20px, 4vw, 60px);
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    /* Icon fills the full height of the header bar (between its top/bottom padding) */
    .header-logo-wrap {
      width: clamp(64px, 9vw, 130px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-logo-wrap img {
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      width: auto;
      object-fit: contain;
    }
    .header-logo-wrap.no-logo {
      width: clamp(64px, 9vw, 130px);
    }

    .header-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      color: var(--header-text);
    }
    .header-brand {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(20px, 4vw, 56px);
      font-weight: 700;
      letter-spacing: clamp(2px, 0.5vw, 8px);
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--header-text);
    }
    .board.portrait .header-brand {
      font-size: clamp(28px, 5vw, 72px);
    }
    .header-menu-type {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(14px, 2.5vw, 36px);
      font-weight: 500;
      letter-spacing: clamp(3px, 0.8vw, 12px);
      text-transform: uppercase;
      color: var(--header-text);
      margin-top: clamp(2px, 0.4vw, 6px);
    }
    .board.portrait .header-menu-type {
      font-size: clamp(18px, 3vw, 44px);
    }

    /* ── CLOCK BAR ─────────────────────────── */
    .clock-bar {
      background: var(--clock-bg, #f0f4f8);
      border-top: 1px solid var(--clock-bg, #dde5ee);
      border-bottom: 1px solid var(--clock-bg, #dde5ee);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(6px, 1vw, 12px) clamp(20px, 4vw, 60px);
      flex-shrink: 0;
    }
    .board.portrait .clock-bar {
      padding: clamp(10px, 1.5vw, 20px) clamp(24px, 4.5vw, 70px);
    }
    .board.landscape .clock-bar {
      padding: clamp(8px, 1vw, 14px) clamp(20px, 4vw, 60px);
    }
    .clock-bar .store-label {
      font-size: clamp(10px, 1.1vw, 14px);
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .clock-bar .time-display {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(15px, 1.8vw, 26px);
      color: var(--clock-text, #1e293b);
      letter-spacing: 1px;
    }
    .board.landscape .clock-bar .time-display {
      font-size: clamp(20px, 2.4vw, 38px);
      letter-spacing: 1.5px;
    }
    .clock-bar .greeting-text {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(18px, 2.1vw, 31px);
      font-weight: 700;
      color: var(--clock-text, #1e293b);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-right: auto; /* pushes .time-display to the far right */
    }
    .board.landscape .clock-bar .greeting-text {
      font-size: clamp(25px, 3.1vw, 48px);
    }
    /* Mock-mode badge — visible only when ?mockapi= is set in the URL */
    .mock-badge {
      font-family: 'Oswald', monospace;
      font-size: 11px;
      font-weight: 700;
      background: #f59e0b;
      color: #000;
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 10px;
      letter-spacing: 1px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* ── ITEMS SECTION ─────────────────────── */
    .board-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--cream);
    }

    /* Category section label — kept for colour-scheme compatibility but hidden */
    .cat-header { display: none; }

    /* Category badge — bottom-right of each card */
    .item-cat-badge {
      display: inline-block;
      background: var(--accent, var(--green));
      color: #fff;
      font-size: clamp(9px, 0.85vw, 13px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: clamp(6px, 0.7vw, 11px) clamp(12px, 1.4vw, 22px);
      border-radius: clamp(4px, 0.4vw, 7px);
      white-space: nowrap;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* Card grid — column count/row tracks are set per-page from JS (dynStyle) */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(10px, 1.2vw, 22px);
      padding: clamp(10px, 1.2vw, 22px);
      height: 100%;
      overflow: hidden;
    }
    .board.portrait .items-grid { grid-template-columns: repeat(3, 1fr); }
    .board.landscape .items-grid { grid-template-columns: repeat(5, 1fr); }

    /* Card — hero photo on top, details below */
    .item-cell {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--item-bg, var(--white));
      border-radius: clamp(8px, 1vw, 16px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    .item-cell.oos-cell { background: #fdf8f5; }

    /* Thumb takes all the flexible space and shrinks first — the text/price
       below it must never be pushed out, so it keeps its natural size. */
    .item-thumb {
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #f5f0e8;
    }
    .item-thumb img, .item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .item-thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 3vw, 42px);
      color: var(--border);
    }

    /* Body — name, description, divider, footer (price + category badge) */
    /* Sized to its own content (never shrunk) so the name/price are always
       fully visible — .item-thumb above absorbs all the squeeze instead. */
    .item-body {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 1vw, 24px) clamp(10px, 1.3vw, 26px);
      overflow: hidden;
    }
    .item-name {
      font-size: clamp(11px, 1.5vw, 22px);
      font-weight: 800;
      color: var(--item-color);
      line-height: 1.25;
      margin-bottom: clamp(2px, 0.4vw, 7px);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .item-desc {
      font-size: clamp(9px, 1.05vw, 15px);
      color: var(--item-desc, var(--text2));
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      margin-bottom: clamp(4px, 0.9vw, 16px);
    }
    .item-divider {
      height: 1px;
      background: rgba(0,0,0,.08);
      margin-bottom: clamp(6px, 0.9vw, 16px);
      flex-shrink: 0;
    }
    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .item-price {
      font-size: clamp(16px, 2vw, 30px);
      font-weight: 800;
      color: var(--price-color, var(--green-dark));
      letter-spacing: -0.3px;
      line-height: 1;
    }
    /* Struck-through RRP shown ahead of a live offer price — sized off the
       parent price element's own font-size so it scales in every context
       (item tile, promo hero, promo card) without a per-context rule. */
    .price-was {
      text-decoration: line-through;
      opacity: 0.55;
      font-weight: 600;
      font-size: 0.55em;
      margin-right: 0.3em;
    }
    /* Optional promo copy set on the product's Pricing tab ("Show on Menu
       Board") — a small highlighted strip near the price, distinct from
       the item's regular description so it reads as a call-out, not
       product info. */
    .menu-board-note {
      display: inline-block;
      /* Only takes effect where this sits inside a flex column (the
         Featured Item board's hero and promo-tile text blocks) — without
         it, those containers' default align-items:stretch would widen the
         pill's background to the full column instead of hugging its own
         text, the way it already does everywhere else. */
      align-self: flex-start;
      margin-top: clamp(5px, 0.65vw, 10px);
      padding: clamp(4px, 0.5vw, 8px) clamp(10px, 1.2vw, 18px);
      background: #fff7e6;
      color: #ad4e00;
      border-radius: clamp(4px, 0.45vw, 8px);
      font-size: clamp(13px, 1.3vw, 19.5px);
      font-weight: 700;
      line-height: 1.3;
    }

    /* ── OUT OF STOCK ───────────────────────── */
    .oos-overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.65);
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .item-cell.oos-cell .oos-overlay { display: flex; }

    .oos-stamp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: clamp(2px, 0.3vw, 3px) solid var(--danger);
      border-radius: 4px;
      padding: clamp(4px, 0.5vw, 8px) clamp(8px, 1.2vw, 18px);
      transform: rotate(-12deg);
      background: rgba(255,255,255,0.9);
      box-shadow: 0 2px 10px rgba(192,57,43,0.25);
    }
    .oos-stamp-text {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(9px, 1.1vw, 14px);
      font-weight: 700;
      color: var(--danger);
      letter-spacing: clamp(1px, 0.3vw, 4px);
      text-transform: uppercase;
      line-height: 1.1;
    }

    /* ── FOOTER ────────────────────────────── */
    .board-footer {
      background: #f0f4f8;
      border-top: 1px solid #dde5ee;
      padding: clamp(8px, 1.2vw, 16px) clamp(20px, 4vw, 60px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .board:hover .board-footer {
      opacity: 1;
    }
    .board.landscape .board-footer {
      padding: clamp(5px, 0.8vw, 10px) clamp(20px, 4vw, 60px);
    }
    .footer-text {
      font-size: clamp(9px, 1vw, 13px);
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .footer-page-info {
      font-size: clamp(9px, 1vw, 13px);
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .footer-refresh {
      font-size: clamp(9px, 0.9vw, 12px);
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── ROTATION PROGRESS BAR ──────────────── */
    .rotation-bar-wrap {
      height: 3px;
      background: rgba(0,0,0,0.06);
      overflow: hidden;
      flex-shrink: 0;
    }
    .rotation-bar {
      height: 100%;
      background: var(--green, #006241);
      width: 0%;
      transition: none;
    }

    /* ── EMPTY / ERROR STATES ──────────────── */
    .board-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      text-align: center;
      background: var(--cream);
    }
    .board-empty .icon { font-size: 56px; margin-bottom: 20px; opacity: 0.35; }
    .board-empty h2 { font-family: 'Oswald',sans-serif; font-size: 28px; color: var(--green); margin-bottom: 10px; }
    .board-empty p  { font-size: 15px; color: var(--text2); line-height: 1.7; }

    .error-board {
      min-height: 100vh;
      background: var(--green);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: white;
    }
    .error-board .icon { font-size: 60px; margin-bottom: 20px; }
    .error-board h2 { font-family: 'Oswald',sans-serif; font-size: 32px; margin-bottom: 12px; letter-spacing: 2px; }
    .error-board p  { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.7; max-width: 440px; }
    .error-board code {
      background: rgba(255,255,255,0.15); border-radius: 6px;
      padding: 3px 10px; font-size: 13px; font-family: monospace;
      color: #fff; display: inline-block; margin-top: 6px; word-break: break-all;
    }
    .error-board a {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 24px; background: white; color: var(--green);
      font-weight: 700; padding: 10px 24px; border-radius: 8px;
      text-decoration: none; font-size: 14px;
    }

    /* ── FEATURE HERO SPOTLIGHT LAYOUT ─────────────── */
    /* A full-bleed image panel (no overlay copy) alongside a stack of
       equally-weighted promo cards — not one dominant item with a small
       supporting grid. Portrait: image on top, promos below. Landscape:
       image on the left, promos stacked down the right. */
    .board.portrait .promo-board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .board.portrait .promo-hero {
      flex: 0 0 var(--hero-flex-basis, 42%);
      overflow: hidden;
      border-bottom: 3px solid var(--accent, #f6ad55);
      position: relative;
    }
    .board.landscape .promo-board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .board.landscape .promo-hero {
      flex: 0 0 var(--hero-flex-basis, 42%);
      overflow: hidden;
      border-right: 3px solid var(--accent, #f6ad55);
      position: relative;
    }
    .promo-hero img, .promo-hero video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .promo-hero-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(48px, 8vw, 120px);
      background: rgba(0,0,0,0.05);
    }
    /* Product info + pricing sit top-left over the primary image. No box or
       card behind them — even a translucent padded rectangle reads as "a
       white background" once text is a single line (no wrap to clone a
       highlight across). Instead a soft white glow hugs the glyphs
       themselves via stacked text-shadows, so there's no rectangular edge
       at any line count. */
    .promo-hero-top {
      position: absolute;
      top: 0; left: 0;
      max-width: 80%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(4px, 0.6vw, 10px);
      padding: clamp(14px, 2vw, 30px);
    }
    .promo-hero-top .promo-cat {
      background: var(--cat-bar-bg, var(--accent));
    }
    .promo-hero-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      color: #000;
      text-shadow:
        0 0 3px rgba(255,255,255,0.95), 0 0 3px rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.9),
        0 0 16px rgba(255,255,255,0.75), 0 0 16px rgba(255,255,255,0.75);
      font-size: clamp(26px, 4.1vw, 65px);
      line-height: 1.15;
    }
    .promo-hero-price {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      color: var(--price-color, var(--accent));
      text-shadow:
        0 0 3px rgba(255,255,255,0.95), 0 0 3px rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.9), 0 0 8px rgba(255,255,255,0.9),
        0 0 16px rgba(255,255,255,0.75), 0 0 16px rgba(255,255,255,0.75);
      font-size: clamp(31px, 4.8vw, 74px);
    }
    .promo-hero-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: clamp(12px, 1.8vw, 26px);
      background: linear-gradient(to top, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.7) 65%, rgba(255,255,255,0) 100%);
      text-align: center;
    }
    .promo-hero-desc {
      font-style: italic;
      color: #666666;
      /* +30% over the original clamp(11px, 1.2vw, 18px) */
      font-size: clamp(14px, 1.56vw, 23px);
      line-height: 1.4;
    }
    /* Promo card stack */
    .promo-list {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: clamp(10px, 1.4vw, 24px);
      padding: clamp(10px, 1.4vw, 24px);
    }
    .promo-tile {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 0;
      background: var(--item-bg, #fff);
      border-radius: clamp(8px, 1vw, 16px);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      overflow: hidden;
    }
    /* Angled candy-stripe accent bar, in the brand's own accent colour —
       the recurring "promo flag" motif from QSR value-menu signage. */
    .promo-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: clamp(6px, 0.6vw, 10px);
      background: repeating-linear-gradient(-45deg, var(--accent, #e4002b) 0 14px, #fff 14px 28px);
      z-index: 1;
    }
    .promo-text {
      flex: 1 1 55%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(2px, 0.4vw, 6px);
      padding: clamp(14px, 1.6vw, 30px) clamp(14px, 1.6vw, 30px) clamp(10px, 1.2vw, 22px);
    }
    .promo-cat {
      display: inline-block;
      align-self: flex-start;
      background: var(--cat-bar-bg, var(--accent));
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      /* +30% over the original clamp(11px, 1.02vw, 16px) */
      font-size: clamp(14px, 1.33vw, 21px);
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: clamp(3px, 0.46vw, 7px) clamp(10px, 1.17vw, 18px);
      border-radius: clamp(4px, 0.46vw, 8px);
      margin-bottom: clamp(4px, 0.6vw, 10px);
    }
    .promo-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      color: #000;
      font-size: clamp(19px, 2.64vw, 38px);
      line-height: 1.08;
    }
    .promo-price {
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
      color: var(--price-color, var(--accent));
      font-size: clamp(24px, 3.36vw, 48px);
      margin-top: clamp(2px, 0.5vw, 8px);
    }
    .promo-img-wrap {
      flex: 0 0 42%;
      min-width: 0;
      overflow: hidden;
    }
    .promo-img-wrap img, .promo-img-wrap video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .promo-img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(28px, 4vw, 56px);
      opacity: .3;
    }
    /* Description runs the full width of the tile, overlaid across both the

// ── HELPERS ─────────────────────────────────────────────────────────────────
// Merges in this store's own price override (if any) for each item — set
// via Retail Admin's Pricing tab, and scoped to this store's own
// storePricing/{STORE_CODE} doc only, never touching the shared item or
// any other store. Every caller reads through here so price/offer/menu-
// board-copy display is correct everywhere without each call site having
// to know about store overrides.
// Store-targeted offers: an offer's `targeting` is an AND-of-ORs, same
// rule as Campaign Targeting's condition-tree builder (ph-designer skill
// components.md §16) — each entry in the array is one AND-group, and the
// conditions listed inside a group are OR'd together. No targeting at all
// means the offer applies at every store.
// Category-aware — an offer's targeting can now be Store / Location Data
// OR Visitor / Customer Data (ph-designer skill components.md §16,
// verified live against demo.personalisationhub.com 24 Aug 2026).
// Visitor fields read the same _campaignFirstName/_campaignSkus globals
// pollCampaign() already populates from the PH API's campaign_data
// response — never sourced or managed locally. Fields with no live data
// source in this repo yet (Display Tag(s), Store Country, Age, Gender,
// etc.) resolve to an empty `have` array — offered for authoring, but
// inert until real PH API data for them exists.
function _offerConditionMatches(cond, store) {
  const category = cond.category || 'store';
  const have = (
    category === 'visitor'
      ? (
          cond.field === 'firstName' ? (_campaignFirstName ? [_campaignFirstName] : []) :
          cond.field === 'skus' ? (_campaignSkus || []) :
          []
        )
      : (
          cond.field === 'storeCode' ? [STORE_CODE] :
          cond.field === 'storeName' ? (store.storeName ? [store.storeName] : []) :
          cond.field === 'fixedSegment' ? (store.fixedSegments || []) :
          cond.field === 'variableSegment' ? (store.variableSegments || []) :
          cond.field === 'storeSegmentConsolidated' ? [...(store.fixedSegments || []), ...(store.variableSegments || [])] :
          cond.field === 'storeState' ? (store.state ? [store.state] : []) :
          cond.field === 'storeSuburb' ? (store.suburb ? [store.suburb] : []) :
          []
        )
  ).map(v => String(v).trim().toLowerCase());
  const want = (cond.values || []).map(v => String(v).trim().toLowerCase());
  if (!want.length) return true; // an empty value list restricts nothing
  const anyOverlap = want.some(w => have.includes(w));
  const allPresent = want.every(w => have.includes(w));
  switch (cond.operator) {
    case 'matches':    return allPresent && have.length === want.length;
    case 'excludesOr':  return !anyOverlap;
    case 'excludesAnd': return !allPresent;
    case 'includes':
    default:            return anyOverlap;

}
function _offerTargetingMatches(targeting, store) {
  if (!Array.isArray(targeting) || !targeting.length) return true;
  return targeting.every(group => (group.conditions || []).some(c => _offerConditionMatches(c, store)));
}

// Recurring day-part schedules for offers — duplicated from
// product-app/src/lib/recurrence.js (same convention as
// _offerConditionMatches above: kept in sync by hand rather than shared
// as a module). Only what this file needs: whether an offer's window,
// including any recurring day-part pattern, is open right now.
function _recurWeekday(d) { return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]; }
function _recurStartOfDay(d) { const r = new Date(d); r.setHours(0,0,0,0); return r; }
function _recurEndOfDay(d) { const r = new Date(d); r.setHours(23,59,59,999); return r; }
function _recurAddDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function _recurNthWeekdayOfMonth(d) { return Math.ceil(d.getDate()/7); }
function _recurMatchesCadence(rule, startDate, testDate) {
  const start = _recurStartOfDay(startDate), test = _recurStartOfDay(testDate);
  if (test < start) return false;
  const interval = Math.max(1, Number(rule.interval) || 1);
  if (rule.unit === 'day') {
    return Math.round((test - start) / 86400000) % interval === 0;
  }
  if (rule.unit === 'week') {
    const days = (rule.byDay && rule.byDay.length) ? rule.byDay : [_recurWeekday(start)];
    if (!days.includes(_recurWeekday(test))) return false;
    const startSunday = _recurAddDays(start, -start.getDay());
    const testSunday = _recurAddDays(test, -test.getDay());
    return Math.round((testSunday - startSunday) / (7 * 86400000)) % interval === 0;
  }
  if (rule.unit === 'month') {
    if (rule.monthlyMode === 'dayOfMonth') {
      if (test.getDate() !== start.getDate()) return false;
    } else {
      if (test.getDay() !== start.getDay()) return false;
      if (_recurNthWeekdayOfMonth(test) !== _recurNthWeekdayOfMonth(start)) return false;
    }
    const diffMonths = (test.getFullYear() - start.getFullYear()) * 12 + (test.getMonth() - start.getMonth());
    return diffMonths >= 0 && diffMonths % interval === 0;
  }
  if (rule.unit === 'year') {
    if (test.getMonth() !== start.getMonth() || test.getDate() !== start.getDate()) return false;
    const diffYears = test.getFullYear() - start.getFullYear();
    return diffYears >= 0 && diffYears % interval === 0;
  }

}

  const start = _recurStartOfDay(startDate), test = _recurStartOfDay(testDate);
  const cap = _recurAddDays(start, 3660);
  let count = 0, cursor = start;
  while (cursor <= test && cursor <= cap) {
    if (_recurMatchesCadence(rule, start, cursor)) {
      count += 1;
      if (cursor.getTime() === test.getTime()) return count;
    }
    cursor = _recurAddDays(cursor, 1);

}

    if (_recurStartOfDay(testDate) > _recurEndOfDay(new Date(rule.ends.date))) return false;
  }
  if (!_recurMatchesCadence(rule, startDate, testDate)) return false;
  if (rule.ends && rule.ends.type === 'after' && rule.ends.count) {

}
// Combines the recurring date pattern with the daily time-of-day window
// offerFrom/offerUntil define; offerUntil earlier in the day than
// offerFrom means the window crosses midnight.
function _isOfferWindowLiveNow(offerFrom, offerUntil, recurrence, now) {
  now = now || new Date();
  if (!offerFrom) return true;
  const from = new Date(offerFrom);
  const until = offerUntil ? new Date(offerUntil) : null;
  if (!recurrence || recurrence.freq === 'none') {
    if (from > now) return false;
    if (until && until < now) return false;
    return true;
  }

  const untilMinutes = until ? (until.getHours() * 60 + until.getMinutes()) : 24 * 60;

    if (!crossesMidnight) { if (nowMinutes >= fromMinutes && nowMinutes < untilMinutes) return true; }

}

// live beats scheduled, same precedence as pickEffectiveOffer() in the
// product-app's OfferBanner.jsx, but evaluated per-store instead of once
// at save time, since which offer wins can differ store to store. Items
// saved before multi-offer support (no `offers` array) fall through
// untouched — their flat offerPrice/offerFrom/offerUntil/showOnMenuBoard
// are already correct and were never store-targeted to begin with.
function _resolveItemOffersForStore(item, store) {
  if (!Array.isArray(item.offers) || !item.offers.length) return item;
  const eligible = item.offers.filter(o => o.enabled !== false && _offerTargetingMatches(o.targeting, store));
  const now = new Date();
  const isPriced = (o) => parseFloat(o.offerPrice) > 0;
  const isLive = (o) => isPriced(o) && _isOfferWindowLiveNow(o.offerFrom, o.offerUntil, o.recurrence, now);

  // offer is off right now (e.g. a lunch day-part checked at 9pm) — a
  // better fallback than one that hasn't started at all yet.
  const hasStarted = (o) => isPriced(o) && o.offerFrom && new Date(o.offerFrom) <= now;
  const live = eligible.find(isLive);
  const effective = live
    || eligible.filter(hasStarted).sort((a, b) => new Date(a.offerFrom) - new Date(b.offerFrom))[0]
    || eligible
      .filter((o) => isPriced(o) && o.offerFrom && new Date(o.offerFrom) > now)
      .sort((a, b) => new Date(a.offerFrom) - new Date(b.offerFrom))[0];

  // by a *store-targeted* offer's own note — an untargeted offer applies
  // everywhere anyway, so the default stays the source of truth for it.
  const isTargeted = !!(effective && Array.isArray(effective.targeting) && effective.targeting.length);

    ...item,
    offerPrice: effective ? effective.offerPrice : null,
    offerFrom: effective ? effective.offerFrom : '',
    offerUntil: effective ? effective.offerUntil : '',

}

  return withOffers.map(i => {
    const o = _storePricing[i.sku];
    if (!o) return i;
    // Retail Admin's own store-price override is a single flat price/
    // window, no recurrence concept — never let an HQ-resolved offer's
    // recurrence rule bleed through onto a store's simple override.
    return { ...i, price: o.price, offerPrice: o.offerPrice, offerFrom: o.offerFrom, offerUntil: o.offerUntil, offerRecurrence: null, showOnMenuBoard: o.showOnMenuBoard };

}

function getStock()    { return _stock; }
function isOos(sku)    { return !!(_stock[sku] && _stock[sku].outOfStock); }

function fmtDate(d)    { return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }

// An offer is "live" under the same rule as HQ Admin's Products table and
// the Pricing tab's own offer banner — offerPrice set, and within
// offerFrom/offerUntil (and any recurring day-part window) if set — so
// all three surfaces never disagree about whether an offer is currently on.
function isOfferLive(item) {
  const offerNum = parseFloat(item.offerPrice);
  if (!(offerNum > 0)) return false;
  return _isOfferWindowLiveNow(item.offerFrom, item.offerUntil, item.offerRecurrence);
}
// Renders the price for a board item — struck-through RRP + offer price
// when a live offer is on, plain RRP otherwise. `wasClass` sizes the
// struck-through RRP relative to the caller's own price font-size via em.
function priceHtml(item, currency, wasClass) {
  const rrp = parseFloat(item.price || 0).toFixed(2);
  if (!isOfferLive(item)) return `${currency}${rrp}`;

// the same way the struck-through price already does, rather than staying
// up until a backend job gets around to clearing the field (that clears it
// on a schedule for tidiness/audit-log purposes, but this board shouldn't
// need to wait on it to stop showing stale promo copy). An item with no
// offer configured at all still shows its note unconditionally — there's
// nothing time-boxed for it to have expired against.
function shouldShowMenuNote(item) {
  if (!item.showOnMenuBoard) return false;
  if (!(parseFloat(item.offerPrice) > 0)) return true;
  return isOfferLive(item);
}

// ── BRAND SUPPORT ────────────────────────────────────────────────────────────
let _debugPanelVisible = DEBUG_MODE; // toggled by long-press on bottom-left corner

function getBrands() { return _brands; }

// Effective time format — updated each render() so updateClock() can use template's setting
let _effectiveTimeFormat = 'british';

// Returns the active brand object for filtering, or null when no ?brand= param is set
// (null = "show all brands" mode). A separate themeSource is used for UI styling.
// If no brands in Firestore, returns a legacy compat object built from mb_settings.
function getActiveBrand() {
  const brands = getBrands();

  // No brands at all — legacy fallback from mb_settings
  if (!brands.length) {
    const s = getSettings();
    return {
      id: 'default',
      name:      s.brandName || 'Our Brand',
      currency:  s.currency       || '$',
      logo:      s.logo           || '',
      logoRight: s.logoRight      || s.logo || '',
      colors:    s.colors         || {},
      showClock: true,
      timeFormat: 'british',
      display: {
        portrait:  { cols: 3, rows: 5, maxItems: 15 },
        landscape: { cols: 5, rows: 3, maxItems: 15 }
      }
    };
  }

  // If a brand name was supplied in the URL, match it case-insensitively
  if (BRAND_ID) {
    const found = brands.find(b => b.name.toLowerCase() === BRAND_ID.toLowerCase());
    return found || brands[0]; // found brand, or first brand if name didn't match
  }

  // No ?brand= param — return null to signal "show all brands, no filter"
  return null;

// Returns the active Offer Board template for the given brand.
// Matches TEMPLATE_TYPE URL param against brand.templates[].templateType.
// Falls back to the isDefault template, then first template, then null.
function getActiveTemplate(brand) {
  if (!brand) return null;
  const templates = brand.templates;
  if (!Array.isArray(templates) || !templates.length) return null;
  if (TEMPLATE_TYPE) {
    const match = templates.find(t => t.templateType === TEMPLATE_TYPE);
    if (match) return match;
  }
  return templates.find(t => t.isDefault) || templates[0];
}

// Local Feature Highlight's item selection — a store's own Featured picks
// (Retail Admin) override HQ's Featured list (HQ Admin) once the store has
// starred 3 or more; below that, HQ's list is used as normal. Returns the
// Set of qualifying SKUs, which may have fewer than 3 entries (or be empty)
// — callers check .size to decide whether the template activates at all.
function getEffectiveFeaturedSkus(brand) {
  if (!brand) return new Set();
  const brandItems = getItems().filter(i => i.active && (!i.brand || i.brand === brand.id));
  const localSkus = Object.keys(_localFeatured || {}).filter(sku => _localFeatured[sku]);
  if (localSkus.length >= 3) return new Set(localSkus);
  return new Set(brandItems.filter(i => i.featured).map(i => i.sku));
}

// ── COLOR SCHEME ─────────────────────────────────────────────────────────────
function applyColorScheme(brand) {
  const colors = (brand && brand.colors) || {};
  const root = document.documentElement.style;
  // Header
  if (colors.header)      root.setProperty('--board-header-bg', colors.header);
  if (colors.headerText)  root.setProperty('--header-text',     colors.headerText);
  // Accent (mirrors --green for legacy compatibility + explicit --accent var)
  if (colors.accent) {
    root.setProperty('--green',   colors.accent);
    root.setProperty('--accent', colors.accent);
  }
  // Category badge background
  if (colors.catBar)      root.setProperty('--cat-bar-bg',   colors.catBar);
  // Page / body background
  if (colors.body)        root.setProperty('--cream',         colors.body);
  // Item text — drives item name color, hero name, and nutrition values (was wrongly linked to header)
  if (colors.text)        {
    root.setProperty('--text',       colors.text);
    root.setProperty('--item-color', colors.text);   // item name text
    root.setProperty('--item-text',  colors.text);   // hero slot item name text
  }
  // Price text
  if (colors.price)       root.setProperty('--price-color',   colors.price);
  // Clock bar
  if (colors.clockText)   root.setProperty('--clock-text',    colors.clockText);
  if (colors.clockBg)     root.setProperty('--clock-bg',      colors.clockBg);
  // Item card background
  if (colors.itemBg)      root.setProperty('--item-bg',       colors.itemBg);
  // Short description / secondary item text
  if (colors.description) root.setProperty('--item-desc',     colors.description);
}

// ── CLOCK ────────────────────────────────────────────────────────────────────
function updateClock() {
  const el = document.getElementById('clockDisplay');
  if (!el) return;
  const fmt = _effectiveTimeFormat;
  const n      = new Date();

  let timeStr, dateStr;
  if (fmt === 'us') {
    timeStr = n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    dateStr = n.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } else if (fmt === 'british') {
    timeStr = n.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
    dateStr = n.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  } else {
    // Default: use original system-locale formatting (no seconds — same as before)
    timeStr = fmtTime(n);
    dateStr = fmtDate(n);
  }
  el.textContent = timeStr + '  ·  ' + dateStr;
}

// ── BUILD NUTRITION HTML ─────────────────────────────────────────────────────
function buildNutrition(item) {
  const hasCal  = item.calories != null;
  const hasFat  = item.fat      != null;
  const hasCarb = item.carbs    != null;
  const hasProt = item.protein  != null;

  if (!hasCal && !hasFat && !hasCarb && !hasProt) return '';

  let html = '<div class="nutrition-block">';

  if (hasCal) {
    html += `<div class="nutr-calories">
      <span class="nutr-val">${item.calories}</span>
      <span class="nutr-unit">&nbsp;Calories</span>
    </div>`;
  }

  const macros = [];
  if (hasFat)  macros.push(`<span class="nutr-val">${item.fat}</span><span class="nutr-unit">g&nbsp;Fat</span>`);
  if (hasCarb) macros.push(`<span class="nutr-val">${item.carbs}</span><span class="nutr-unit">g&nbsp;Carbs</span>`);
  if (hasProt) macros.push(`<span class="nutr-val">${item.protein}</span><span class="nutr-unit">g&nbsp;Prot</span>`);

  if (macros.length) {
    html += `<div class="nutr-macros-row">${macros.map(m => `<div class="nutr-row">${m}</div>`).join('')}</div>`;
  }

  html += '</div>';
  return html;
}

function startRotation(totalPages, intervalMs) {
  if (SCREEN_LOCK || totalPages <= 1) return;
  clearTimeout(rotationTimer);
  intervalMs = intervalMs || DEFAULT_ROTATION_SECONDS * 1000;

  // Animate progress bar from 0 → 100%
  const bar = document.getElementById('rotationBar');
  if (bar) {
    bar.style.transition = 'none';
    bar.style.width = '0%';
    setTimeout(() => {
      bar.style.transition = `width ${intervalMs}ms linear`;
      bar.style.width = '100%';
    }, 50);
  }

  rotationTimer = setTimeout(() => {
    currentPage = currentPage >= totalPages ? 1 : currentPage + 1;
    render();

// ── PERSONALISATION HUB API — DECRYPTION + CAMPAIGN POLLING ─────────────────
const _ENC_PASS = 'rob-ph-demos-phapi-v1';
const _ENC_SALT = new TextEncoder().encode('ph-menuboard-salt-2024');

// Cache the key derivation (PBKDF2 is intentionally slow — only do it once)
let _derivedKeyPromise = null;
async function _deriveKey() {
  if (!_derivedKeyPromise) {
    _derivedKeyPromise = (async () => {
      const mat = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(_ENC_PASS), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: _ENC_SALT, iterations: 100000, hash: 'SHA-256' },
        mat, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    })();
  }
  return _derivedKeyPromise;
}

// Map-based decrypt cache — handles N endpoints without thrashing
const _tokenCache = new Map(); // encrypted b64 → plaintext
async function decryptToken(b64) {
  if (_tokenCache.has(b64)) return _tokenCache.get(b64);
  const key   = await _deriveKey();
  const buf   = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pt    = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  const plain = new TextDecoder().decode(pt);
  _tokenCache.set(b64, plain);
  return plain;
}

// ── ACTIVE ENDPOINT + LOCALSTORAGE PREFERENCE ────────────────────────────────
let _activeEndpoint = null; // { baseUrl: string, token: string } — current working endpoint

function _epPrefKey()            { return `ph-ep-${DEVICE_UDID}`; }
function _loadPreferredBaseUrl() {
  try { return localStorage.getItem(_epPrefKey()) || null; } catch (_) { return null; }
}
function _savePreferredBaseUrl(url) {
  try { url ? localStorage.setItem(_epPrefKey(), url) : localStorage.removeItem(_epPrefKey()); }
  catch (_) {}
}

async function pollCampaign() {
  if (!DEVICE_UDID) return;
  try {
    let json = null;

    if (MOCK_API_FILE) {
      // ── MOCK MODE: bypass real API — load local JSON file instead ──────────
      const mockPath = MOCK_API_FILE === '1' ? './mock-ph-api.json' : `./${MOCK_API_FILE}`;
      console.log('[Campaign] \uD83E\uDDEA MOCK MODE — loading', mockPath);
      const resp = await fetch(mockPath);
      if (!resp.ok) { console.warn('[Campaign] Mock file not found:', mockPath); return; }
      json = await resp.json();

    } else {
      // ── REAL API MODE — multi-endpoint probe ─────────────────────────────────
      const endpoints = _settings.phApi?.endpoints;

      // Backwards compat: old single-token format or no config — wait until admin saves
      if (!Array.isArray(endpoints) || endpoints.length === 0) return;

      // Phase 1: try the cached active endpoint (avoids re-probing on every poll)
      if (_activeEndpoint) {
        const { baseUrl, token } = _activeEndpoint;
        try {
          const resp = await fetch(
            `${baseUrl}/location-api/device/${DEVICE_UDID}/campaign_data`,
            { headers: { accept: 'application/json', 'x-api-key': token } }
          );
          if (resp.ok) {
            _setApiError(null);
            json = await resp.json();
          } else {
            console.warn(`[Campaign] Active endpoint HTTP ${resp.status} \u2014 re-probing`);
            _activeEndpoint = null;
          }
        } catch (activeErr) {
          console.warn('[Campaign] Active endpoint unreachable:', activeErr.message, '\u2014 re-probing');
          _activeEndpoint = null;
        }
      }

      // Phase 2: probe all endpoints in preference order
      if (!json) {
        // Build probe order: localStorage-preferred first, then remaining in array order
        const preferred  = _loadPreferredBaseUrl();
        const probeOrder = [];
        if (preferred) {
          const prefEp = endpoints.find(e => e.baseUrl === preferred);
          if (prefEp) probeOrder.push(prefEp);
        }
        for (const ep of endpoints) {
          if (!probeOrder.some(p => p.baseUrl === ep.baseUrl)) probeOrder.push(ep);
        }

        let lastTriedUrl = '';
        for (const ep of probeOrder) {
          if (!ep.baseUrl || !ep.authToken) continue;
          let token;
          try { token = await decryptToken(ep.authToken); }
          catch (_) { console.warn('[Campaign] Decrypt failed for', ep.baseUrl); continue; }

          const url = `${ep.baseUrl}/location-api/device/${DEVICE_UDID}/campaign_data`;
          lastTriedUrl = ep.baseUrl;
          try {
            const resp = await fetch(url, { headers: { accept: 'application/json', 'x-api-key': token } });
            if (resp.ok) {
              _activeEndpoint = { baseUrl: ep.baseUrl, token };
              _savePreferredBaseUrl(ep.baseUrl);
              _setApiError(null);
              json = await resp.json();
              console.log('[Campaign] Using endpoint:', ep.baseUrl);
              break;
            } else {
              console.warn(`[Campaign] ${ep.baseUrl} \u2014 HTTP ${resp.status}`);
            }
          } catch (fetchErr) {
            console.warn(`[Campaign] ${ep.baseUrl} \u2014 ${fetchErr.message}`);
          }
        }

        if (!json) {
          _setApiError(`All configured API endpoints failed. Last tried: ${lastTriedUrl || 'none'}`);
          return;
        }
      }
    }

    // ── Parse visitor_customer — handle both store-level and display-level responses ──
    // Store-level pushes populate json.data.visitor_customer directly.
    // Display-level pushes (display_ids) may return the same structure, but as a
    // safeguard we also check json.data directly as a fallback path.
    const d  = json?.data;
    const vc = d?.visitor_customer;

    // Resolve first_name: try visitor_customer first, then data root
    const firstName = (vc?.first_name || d?.first_name || '').trim() || null;

    // Resolve store_name from store_location
    const storeName = (d?.store_location?.store_name || '').trim() || null;

    // Resolve this store's Fixed/Variable Store Segment membership from
    // store_location, same place store_name/store_timezone already come
    // from — used by _resolveItemOffersForStore() in getItems() above to
    // decide which of an item's several offers (if any) apply here. Never
    // sourced or managed locally; whatever the PH API returns is authoritative.
    const fixedSegments = Array.isArray(d?.store_location?.fixed_store_segments) ? d.store_location.fixed_store_segments : [];
    const variableSegments = Array.isArray(d?.store_location?.variable_store_segments) ? d.store_location.variable_store_segments : [];
    // Store Suburb / Store State targeting fields — sourced from
    // store_info.address_info, same PH API response as opening_hours.
    const suburb = (d?.store_info?.address_info?.suburb || '').trim();
    const state = (d?.store_info?.address_info?.state || '').trim();

    // Resolve SKUs: try visitor_customer first, then data root
    // Filter out empty/blank strings that can appear in sparse API payloads
    // API may return field as "SKUs" (prompt schema) or "skus" (actual response) — handle both
    // Record the raw key/value for the debug panel
    if      (Array.isArray(vc?.SKUs)) { _dbgRawSkuKey = 'vc.SKUs'; _dbgRawSkuVal = vc.SKUs; }
    else if (Array.isArray(vc?.skus)) { _dbgRawSkuKey = 'vc.skus'; _dbgRawSkuVal = vc.skus; }
    else if (Array.isArray(d?.SKUs))  { _dbgRawSkuKey = 'd.SKUs';  _dbgRawSkuVal = d.SKUs;  }
    else if (Array.isArray(d?.skus))  { _dbgRawSkuKey = 'd.skus';  _dbgRawSkuVal = d.skus;  }
    else                              { _dbgRawSkuKey = null;       _dbgRawSkuVal = null;     }

    const rawSkus = _dbgRawSkuVal;
    const validSkus = rawSkus
      ? rawSkus.filter(e => typeof e === 'string' && e.trim() !== '')
      : null;
    const newSkus = (validSkus && validSkus.length > 0) ? validSkus : null;

    // Debug logging — visible in browser console; helps diagnose display-level issues
    console.log('[Campaign] visitor_customer:', JSON.stringify(vc));
    console.log('[Campaign] resolved \u2192 firstName:', firstName, '| SKUs:', newSkus, '| storeName:', storeName);

    const skusChanged      = JSON.stringify(newSkus) !== JSON.stringify(_campaignSkus);
    const nameChanged      = firstName !== _campaignFirstName;
    const storeNameChanged = storeName !== _storeName;
    const nextStoreProfile = { storeName, fixedSegments, variableSegments, suburb, state };
    const segmentsChanged  = JSON.stringify(nextStoreProfile) !== JSON.stringify(_storeProfile);

    _dbgLastPoll = Date.now();
    if (skusChanged || nameChanged || storeNameChanged || segmentsChanged) {
      _campaignSkus      = newSkus;
      _campaignFirstName = firstName;
      _storeName         = storeName;
      _storeProfile       = nextStoreProfile;
      render();
    } else {
      _updateDebugPanel();   // refresh Last poll time even when nothing changed
    }
  } catch (e) {
    console.warn('[Campaign] poll failed:', e);
    _setApiError(`Poll error \u2014 ${e.message}`);
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  if (!STORE_CODE && !DEVICE_UDID) return;

  // brand = null means "no ?brand= param — show all brands"
  // themeSource is always a valid brand object used for colours, logos, layout
  const brand       = getActiveBrand();
  const themeSource = brand || getBrands()[0] || (() => {
    const s = getSettings();
    return { name: s.brandName || 'Our Brand', currency: s.currency || '$', logo: s.logo || '', logoRight: s.logoRight || '', colors: s.colors || {}, showClock: true, timeFormat: 'british', display: { portrait: { cols: 3, rows: 5, maxItems: 15 }, landscape: { cols: 5, rows: 3, maxItems: 15 } } };
  })();

  // ── TEMPLATE RESOLUTION ──────────────────────────────────────────────────────
  // Resolve the active Offer Board template and derive effective settings.
  // Template values always win over top-level brand defaults.
  let tpl = getActiveTemplate(brand || themeSource);

  // Local Feature Highlight needs >=3 qualifying Featured items (HQ, or a
  // store's own override once it has 3+) before it activates — below that,
  // the board falls back to rendering the brand's default template instead.
  // This re-resolution runs on every render (i.e. every data change), so a
  // store crossing the 3-item threshold flips the board automatically. If no
  // template has isDefault set, tpl is left as-is rather than showing blank.
  if (tpl && tpl.templateType === 'feature-hero-board') {
    const featuredSkus = getEffectiveFeaturedSkus(brand || themeSource);
    if (featuredSkus.size < 3) {
      const fallbackTpl = (brand || themeSource).templates?.find(t => t.isDefault);
      if (fallbackTpl) tpl = fallbackTpl;
    }
  }

  // Effective menu-type filter: the template's own "Item Type Filter" wins when
  // configured (this board always shows only those types, regardless of the
  // ?menu= URL param) — otherwise fall back to the URL, as before.
  const effectiveMenuTypes = (tpl && Array.isArray(tpl.menuTypes) && tpl.menuTypes.length > 0)
    ? tpl.menuTypes : MENU_TYPES;
  const effectiveMenuType  = effectiveMenuTypes[0] || '';
  if (!effectiveMenuType) return;
  const meta = MENU_META[effectiveMenuType];

  const effectiveColors       = (tpl && tpl.colors)      || themeSource.colors      || {};
  const effectiveDisplay      = (tpl && tpl.display)     || themeSource.display     || {};
  const effectiveShowHeader   = tpl ? (tpl.showHeader    !== false) : (themeSource.showHeader !== false);
  const effectiveShowClock    = tpl ? (tpl.showClock     !== false) : (themeSource.showClock  !== false);
  const effectiveCampaignMode = (tpl && tpl.campaignMode)    || themeSource.campaignMode    || 'override';
  const effectiveTimeFormat   = (tpl && tpl.timeFormat)      || themeSource.timeFormat      || 'british';
  const effectiveShowStoreName    = tpl ? (tpl.showStoreName    !== false) : true;
  const effectivePersonalGreeting = tpl ? (tpl.personalGreeting !== false) : true;
  const effectiveHeaderTitle      = (tpl && tpl.headerTitle)   || themeSource.name || ''; // main heading; falls back to brand name
  const effectiveHeaderCopy       = (tpl && tpl.headerCopy)   || '';         // sub-header; falls back to menu type label
  const effectiveIconPosition     = (tpl && tpl.iconPosition)  || 'left';
  const effectiveHeaderLogoType   = (tpl && tpl.headerLogoType)|| 'logo';
  const effectiveTemplateType     = (tpl && tpl.templateType)  || TEMPLATE_TYPE || '';
  const effectiveGridCategories   = (tpl && Array.isArray(tpl.categoriesToPresent) && tpl.categoriesToPresent.length > 0)
    ? tpl.categoriesToPresent : [];
  const effectiveHeroSize          = (tpl && tpl.heroSize)          || 'balanced';

  // Persist time format for updateClock() which runs outside render()
  _effectiveTimeFormat = effectiveTimeFormat;

  applyColorScheme({ colors: effectiveColors });

  // Apply orientation class to boardRoot
  const boardRoot = document.getElementById('boardRoot');
  boardRoot.className = 'board ' + ORIENTATION;

  // Dynamic CSS element
  let dynStyle = document.getElementById('dynamic-grid-css');
  if (!dynStyle) {
    dynStyle = document.createElement('style');
    dynStyle.id = 'dynamic-grid-css';
    document.head.appendChild(dynStyle);
  }

  const items = getItems();

  // ── LOGO RESOLUTION ────────────────────────────────────────────────────────
  // Determine which brand asset to use based on template's headerLogoType setting
  const _headerAsset = effectiveHeaderLogoType === 'icon'  ? (themeSource.icon || themeSource.logo || '')
                     : effectiveHeaderLogoType === 'none'  ? ''
                     : /* 'logo' default */                  (themeSource.logo || '');
  let logoLeft = '', logoRight = '';
  if      (effectiveIconPosition === 'left')   { logoLeft  = _headerAsset; }
  else if (effectiveIconPosition === 'right')  { logoRight = _headerAsset; }
  else if (effectiveIconPosition === 'both')   { logoLeft  = logoRight = _headerAsset; }
  // 'center' and 'none': both sides empty; center logo rendered inside header-center below

  const brandName = esc(themeSource.name     || 'Our Brand');
  const currency  = esc(themeSource.currency || '$');

  // Tab title reflects the effective menu type (template filter or URL), not the raw URL alone
  if (meta) document.title = meta.label + (themeSource ? ' — ' + themeSource.name : ' — ' + STORE_CODE);

  // ── STEP 1: Filter first so totalItems drives layout ────────────────────────
  // brand === null means no brand filter — show all active items for this menu type
  const allFiltered = items.filter(i =>
    i.active &&
    (effectiveMenuTypes.length === 0 || (i.menuTypes || []).some(t => effectiveMenuTypes.includes(t))) &&
    (brand === null || !i.brand || i.brand === brand.id)
  );

  // Apply hideOutOfStock — from template setting (wins) or brand default
  const displayFiltered = (effectiveDisplay && effectiveDisplay.hideOutOfStock)
    ? allFiltered.filter(i => !isOos(i.sku))
    : allFiltered;

  // ── STEP 1b: Apply campaign SKU filter (Personalisation Hub) ────────────────
  // When a Device UDID is in the URL and the API returns SKUs, override the display.
  // When brand === null (show-all mode), campaign SKU filtering is skipped entirely —
  // only a board with a defined brand applies personalised SKU filtering.
  let campaignFiltered = displayFiltered;
  if (_campaignSkus && _campaignSkus.length > 0 && brand !== null) {
    const mode = effectiveCampaignMode || (_settings.phApi && _settings.phApi.campaignMode) || 'override';
    // Case-insensitive SKU set — handles mismatches between API and Firestore casing
    const skuSetLower = new Set(_campaignSkus.map(s => (s || '').trim().toLowerCase()));
    const skuMatch = i => skuSetLower.has((i.sku || '').trim().toLowerCase());
    if (mode === 'override') {
      // Ignore menu type — show any active item matching campaign SKUs (brand-constrained)
      campaignFiltered = items.filter(i =>
        i.active &&
        (!i.brand || i.brand === brand.id) &&
        skuMatch(i)
      );
      // Also apply hideOutOfStock if template/brand requires it
      if (effectiveDisplay && effectiveDisplay.hideOutOfStock) {
        campaignFiltered = campaignFiltered.filter(i => !isOos(i.sku));
      }
    } else {
      // 'filter' mode — campaign SKUs narrowed to current menu type
      campaignFiltered = displayFiltered.filter(i => skuMatch(i));
    }
    console.log('[Render] Campaign SKUs:', _campaignSkus, '| Matched', campaignFiltered.length, 'of', items.length, 'items');
    _dbgMatchCount = `${campaignFiltered.length} of ${items.length} items`;
  } else {
    _dbgMatchCount = null;
  }
  _updateDebugPanel();

  // ── STEP 1c: Apply "Categories to Present in Grid" (standard flat-grid boards) ──
  // Feature Hero Spotlight applies this separately, scoped to its supporting grid
  // (excluding the hero slot) — see the hero-layout branch further down.
  if (effectiveGridCategories.length > 0 && effectiveTemplateType !== 'feature-hero-board') {
    campaignFiltered = campaignFiltered.filter(i => effectiveGridCategories.includes(i.category || ''));
  }

  // ── STEP 1d: Menu-type-agnostic candidate pool for Local Feature Highlight ──
  // The Item Type Filter / ?menu= constraint baked into campaignFiltered above
  // is a "which menu is this" concept that doesn't apply to a curated Featured
  // selection — a store manager featuring a drinks item shouldn't have it
  // silently excluded because the board happens to be configured for lunch.
  // Recomputed without the menu-type clause, otherwise mirroring the same
  // active/brand/stock/personalisation rules as campaignFiltered.
  let featuredCandidates = campaignFiltered;
  if (effectiveTemplateType === 'feature-hero-board') {
    const allAnyMenuType = items.filter(i =>
      i.active && (brand === null || !i.brand || i.brand === brand.id)
    );
    const displayAnyMenuType = (effectiveDisplay && effectiveDisplay.hideOutOfStock)
      ? allAnyMenuType.filter(i => !isOos(i.sku))
      : allAnyMenuType;
    featuredCandidates = displayAnyMenuType;
    if (_campaignSkus && _campaignSkus.length > 0 && brand !== null) {
      const mode = effectiveCampaignMode || (_settings.phApi && _settings.phApi.campaignMode) || 'override';
      const skuSetLower = new Set(_campaignSkus.map(s => (s || '').trim().toLowerCase()));
      const skuMatch = i => skuSetLower.has((i.sku || '').trim().toLowerCase());
      if (mode === 'override') {
        featuredCandidates = items.filter(i => i.active && (!i.brand || i.brand === brand.id) && skuMatch(i));
        if (effectiveDisplay && effectiveDisplay.hideOutOfStock) {
          featuredCandidates = featuredCandidates.filter(i => !isOos(i.sku));
        }
      } else {
        featuredCandidates = displayAnyMenuType.filter(i => skuMatch(i));
      }
    }
  }

  // Sort: in-stock first, then by category, then name
  campaignFiltered.sort((a, b) => {
    const ao = isOos(a.sku), bo = isOos(b.sku);
    if (ao !== bo) return ao ? 1 : -1;
    if ((a.category || '') !== (b.category || '')) return (a.category || '').localeCompare(b.category || '');
    return a.name.localeCompare(b.name);
  });

  const totalItems = campaignFiltered.length;

  // ── STEP 2: Compute layout from the brand/template's configured display settings ──
  // Always honoured — no automatic override based on how many items happen to be
  // on the page — so Cols / Rows / Max Items configured in the template editor
  // are reflected on every board, whether it's showing 2 items or 80.
  const dispCfg   = (effectiveDisplay && effectiveDisplay[ORIENTATION]) || {};
  const COLS      = Math.max(1, parseInt(dispCfg.cols)  || (ORIENTATION === 'portrait' ? 2 : 3));
  const ROWS      = Math.max(1, parseInt(dispCfg.rows)  || (ORIENTATION === 'portrait' ? 3 : 2));
  const PAGE_SIZE = Math.min(
    Math.max(1, parseInt(dispCfg.maxItems) || (COLS * ROWS)),
    COLS * ROWS
  );

  // Larger source photo once cards are spacious (1–2 columns); compact thumbnail
  // once the grid gets denser — driven by the actual configured column count,
  // not by how many items happen to be on the page.
  const isLargeTileLayout = COLS <= 2;

  // Picks the best image URL for an item cell given the current layout size.
  // Falls back gracefully: large→small→none, small→large→none.
  function _pickImage(item) {
    const small = item.images      && item.images[0];
    const large = item.imagesLarge && item.imagesLarge[0];
    if (isLargeTileLayout) return large || small || '';
    return small || large || '';
  }

  // A product's default asset can be a video, not just a photo — Product
  // Assets (product-app) stores it the same way (images[0], base64 data
  // URI), just with a video/* MIME type instead of image/*. Detected off
  // the data URI itself rather than any separate per-item flag, since
  // that's the one thing guaranteed to travel with the src no matter which
  // render site picked it up (imagesLarge vs images, hero vs grid vs promo).
  function _isVideoSrc(src) {
    return typeof src === 'string' && /^data:video\//.test(src);
  }

  // Renders whichever media the item's picked src actually is — muted/
  // autoplay/loop so it behaves like ambient signage, not something a
  // customer has to press play on. Falls back to the same onerror swap
  // <img> already used per call site, so a corrupt/oversized asset
  // degrades to that site's own placeholder instead of a dead player.
  function _mediaTag(src, alt, placeholderClass, placeholderEmoji) {
    const onerror = `this.replaceWith(Object.assign(document.createElement('div'),{className:'${placeholderClass}',textContent:'${placeholderEmoji}'}))`;
    if (_isVideoSrc(src)) {
      return `<video src="${src}" autoplay muted loop playsinline disablepictureinpicture onerror="${onerror}"></video>`;
    }
    return `<img src="${src}" alt="${esc(alt)}" loading="lazy" onerror="${onerror}">`;
  }

  // Mutable: the Feature Hero Spotlight layout recomputes this below from its own
  // hero-rotation + secondary-grid-overflow page count, so the footer and the
  // shared rotation clock reflect what's actually rotating on screen.
  let totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));

  // Clamp currentPage — skipped for Feature Hero Spotlight, which recomputes
  // totalPages from its own hero-rotation + grid-overflow page count further
  // down and clamps there instead; clamping here first (against this flat-grid
  // totalPages, which is irrelevant to that layout) would stomp a valid
  // rotated/locked page back down to 1 before the hero branch ever sees it.
  if (effectiveTemplateType !== 'feature-hero-board') {
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;
  }

  // Slice page
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageItems = campaignFiltered.slice(pageStart, pageStart + PAGE_SIZE);

  // ── STEP 3: Inject this page's grid track sizing ─────────────────────────────
  const gridRows = Math.max(1, Math.ceil(pageItems.length / COLS));
  dynStyle.textContent = `
    .items-grid {
      grid-template-columns: repeat(${COLS}, 1fr) !important;
      grid-template-rows: repeat(${gridRows}, 1fr) !important;
    }
  `;

  // ── HEADER ──────────────────────────────────────────────────────────────────
  const logoSlot = (src, side) => src
    ? `<div class="header-logo-wrap"><img src="${src}" alt="${esc(side)} logo"></div>`
    : `<div class="header-logo-wrap no-logo"></div>`;

  const showHeader = effectiveShowHeader;
  const showClock  = effectiveShowClock;
  // The greeting/store-name row is independently useful from the clock — templates
  // like Feature Hero Spotlight hide the clock by default (dark, immersive layout)
  // but should still surface a personalised "Recommended for you" message when the
  // Personalisation Hub API has pushed a First Name for this device. So the bar
  // renders whenever either the clock is on, or personalisation has something to show.
  const showPersonalised = effectivePersonalGreeting && !!_campaignFirstName;
  const showStoreNameRow = effectiveShowStoreName && !!_storeName;
  const showInfoBar = showClock || showPersonalised || showStoreNameRow;
  const headerHtml = `
    ${showHeader ? `
    <div class="board-header">
      ${logoSlot(logoLeft, 'Left')}
      <div class="header-center">
        ${effectiveIconPosition === 'center' && _headerAsset
          ? `<img src="${esc(_headerAsset)}" alt="${brandName} logo" style="height:2.4em;max-width:180px;object-fit:contain;margin-bottom:4px;">`
          : ''}
        <div class="header-brand">${esc(effectiveHeaderTitle)}</div>
        <div class="header-menu-type">${esc(effectiveHeaderCopy || meta.label)}</div>
      </div>
      ${logoSlot(logoRight, 'Right')}
    </div>
    ` : ''}
    ${showInfoBar ? `
      <div class="clock-bar">
        ${MOCK_API_FILE ? `<span class="mock-badge">🧪 MOCK</span>` : ''}
        ${showPersonalised
          ? `<div class="greeting-text">${esc(_campaignFirstName).toUpperCase()}, THIS IS WHAT WE RECOMMEND FOR YOU</div>`
          : (showStoreNameRow ? `<div class="greeting-text">${_storeName}</div>` : '')}
        ${showClock ? `<div class="time-display" id="clockDisplay"></div>` : ''}
      </div>
    ` : ''}
  `;

  // ── BODY ────────────────────────────────────────────────────────────────────
  let bodyHtml = '';

  // Helper to render a standard item card — full-width hero photo on top,
  // name + description below, divider, then price and category badge.
  function _itemCell(item) {
    const oos = isOos(item.sku);
    const cat = item.category || '';
    const cellImg = _pickImage(item);
    const thumbInner = cellImg
      ? _mediaTag(cellImg, item.name, 'item-thumb-placeholder', '🍽️')
      : `<div class="item-thumb-placeholder">🍽️</div>`;
    const desc = item.description ? `<div class="item-desc">${esc(item.description)}</div>` : '';
    const menuNote = shouldShowMenuNote(item) ? `<div class="menu-board-note">${esc(item.showOnMenuBoard)}</div>` : '';
    return `
      <div class="item-cell${oos ? ' oos-cell' : ''}">
        <div class="item-thumb">${thumbInner}</div>
        <div class="item-body">
          <div class="item-name">${esc(item.name)}</div>
          ${desc}
          <div class="item-divider"></div>
          <div class="item-footer">
            <span class="item-price">${priceHtml(item, currency, 'price-was')}</span>
            ${cat ? `<span class="item-cat-badge">${esc(cat)}</span>` : ''}
          </div>
          ${menuNote}
        </div>
        <div class="oos-overlay"><div class="oos-stamp"><div class="oos-stamp-text">SOLD OUT</div></div></div>
      </div>`;
  }

  if (!totalItems) {
    const campaignActive = _campaignSkus && _campaignSkus.length > 0;
    bodyHtml = `
      <div class="board-empty">
        <div class="icon">${meta.emoji}</div>
        <h2>${campaignActive ? 'No Recommended Items' : 'No Items Available'}</h2>
        <p>${campaignActive
          ? 'No menu items match your personalised selection.'
          : `There are currently no active ${esc(meta.label)} items for this location.`
        }</p>
      </div>
    `;
  } else if (effectiveTemplateType === 'feature-hero-board') {
    // ── LOCAL FEATURE HIGHLIGHT LAYOUT ────────────────────────────────────────
    // A full-bleed image (no overlay copy) beside/above a stack of equally-
    // weighted promo cards — "just show promotions", not one dominant item
    // with a small supporting grid. Item selection is driven entirely by the
    // Featured flag (HQ Admin), overridable per store from Retail Admin —
    // see getEffectiveFeaturedSkus(). By the time render() reaches here, tpl
    // has already been re-resolved to the brand's default template if fewer
    // than 3 qualifying items exist, so featuredPool below is expected to
    // have >=3 items in the normal case (it can still be smaller for this
    // specific menu type/screen if some Featured items belong to others).
    const featuredSkus = getEffectiveFeaturedSkus(brand || themeSource);
    // Feature priority (HQ Admin, Product Details — 1 = highest) decides
    // which item leads: sorted ascending, with unset/blank priority sinking
    // to the end (stable sort keeps their relative order otherwise).
    const featuredPool = featuredCandidates.filter(i => featuredSkus.has(i.sku)).slice().sort((a, b) => {
      const pa = parseInt(a.featurePriority, 10);
      const pb = parseInt(b.featurePriority, 10);
      const va = isNaN(pa) ? Infinity : pa;
      const vb = isNaN(pb) ? Infinity : pb;
      return va - vb;
    });

    if (featuredPool.length === 0) {
      bodyHtml = `
        <div class="board-empty">
          <div class="icon">${meta.emoji}</div>
          <h2>No Featured Items</h2>
          <p>No Featured items are configured for this menu. Feature at least 3 products from the product table (HQ Admin, or a store's own picks in Retail Admin) to activate this board.</p>
        </div>
      `;
    } else {
      // Promo card count from template settings — defaults to 2 stacked cards.
      const promoCols = ORIENTATION === 'portrait'
        ? (parseInt((effectiveDisplay.portrait || {}).cols) || 1)
        : (parseInt((effectiveDisplay.landscape || {}).cols) || 1);
      const promoRows = ORIENTATION === 'portrait'
        ? (parseInt((effectiveDisplay.portrait || {}).rows) || 2)
        : (parseInt((effectiveDisplay.landscape || {}).rows) || 2);
      const promoMax = promoCols * promoRows;

      // Rotation is a sliding window around the Featured pool, treated as a
      // ring: each page's hero is the next item in sequence, and the promo
      // cards are simply the promoMax items that immediately follow it in
      // that same ring (wrapping back to the start past the end). Advancing
      // one page slides the whole window forward by one, so every item gets
      // a turn as hero and every promo slot is filled on every page — no
      // separate "promo pages vs hero pages" pagination to keep in sync,
      // which is what let some pages fall out of step and land on a
      // partially-filled or duplicated promo row once there were enough
      // Featured items (5+) that the two paginations' cycle lengths no
      // longer lined up. Total pages is just the pool size — one full lap
      // shows every item as hero exactly once.
      totalPages = featuredPool.length;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const heroIndex = (currentPage - 1) % featuredPool.length;
      const heroItem = featuredPool[heroIndex];
      const promoSlots = Math.min(promoMax, featuredPool.length - 1);
      const promoPage = [];
      for (let k = 1; k <= promoSlots; k++) {
        promoPage.push(featuredPool[(heroIndex + k) % featuredPool.length]);
      }

      // Hero image panel size — fine-tunes how much of the screen the image
      // takes versus the promo cards (compact 32% / balanced 42% / dominant 55%).
      const heroFlexBasis = effectiveHeroSize === 'compact' ? '32%'
        : effectiveHeroSize === 'dominant' ? '55%'
        : '42%';

      dynStyle.textContent += `
        .promo-hero { --hero-flex-basis: ${heroFlexBasis}; }
        .promo-list {
          grid-template-columns: repeat(${promoCols}, 1fr) !important;
          grid-template-rows: repeat(${promoRows}, 1fr) !important;
        }
      `;

      // Build hero image panel — full-bleed photo with product info/pricing in
      // a top-left card (black text) and the description in its own card at
      // the bottom (grey text), the same fields shown on each promo card.
      const heroSrc = (heroItem.imagesLarge && heroItem.imagesLarge[0]) || (heroItem.images && heroItem.images[0]);
      const heroImgHtml = heroSrc
        ? _mediaTag(heroSrc, heroItem.name, 'promo-hero-placeholder', '🏷️')
        : `<div class="promo-hero-placeholder">🏷️</div>`;
      const heroCat = heroItem.category ? `<div class="promo-cat">${esc(heroItem.category)}</div>` : '';
      const heroMenuNote = shouldShowMenuNote(heroItem) ? `<div class="menu-board-note">${esc(heroItem.showOnMenuBoard)}</div>` : '';
      const heroTopHtml = `
        <div class="promo-hero-top">
          ${heroCat}
          <div class="promo-hero-title">${esc(heroItem.name)}</div>
          <div class="promo-hero-price">${priceHtml(heroItem, currency, 'price-was')}</div>
          ${heroMenuNote}
        </div>`;
      const heroBottomHtml = heroItem.description
        ? `<div class="promo-hero-bottom"><div class="promo-hero-desc">${esc(heroItem.description)}</div></div>`
        : '';

      // Build promo tiles — striped accent bar, category/title/price in the
      // text column, description overlaid across the full width of the tile
      // (text column + photo) at the bottom.
      const promoTilesHtml = promoPage.map(item => {
        const src = (item.imagesLarge && item.imagesLarge[0]) || (item.images && item.images[0]);
        const img = src
          ? _mediaTag(src, item.name, 'promo-img-placeholder', '🍽️')
          : `<div class="promo-img-placeholder">🍽️</div>`;
        const desc = item.description
          ? `<div class="promo-tile-desc"><div class="promo-desc">${esc(item.description)}</div></div>` : '';
        const cat = item.category ? `<div class="promo-cat">${esc(item.category)}</div>` : '';
        const menuNote = shouldShowMenuNote(item) ? `<div class="menu-board-note">${esc(item.showOnMenuBoard)}</div>` : '';
        return `
          <div class="promo-tile">
            <div class="promo-text">
              ${cat}
              <div class="promo-title">${esc(item.name)}</div>
              <div class="promo-price">${priceHtml(item, currency, 'price-was')}</div>
              ${menuNote}
            </div>
            <div class="promo-img-wrap">${img}</div>
            ${desc}
          </div>`;
      }).join('');

      bodyHtml = `
        <div class="promo-board">
          <div class="promo-hero">${heroImgHtml}${heroTopHtml}${heroBottomHtml}</div>
          <div class="promo-list">${promoTilesHtml}</div>
        </div>`;
    }
  } else {
    // Standard flat grid — all items on this page
    const cells = pageItems.map(_itemCell).join('');
    bodyHtml = `<div class="board-body"><div class="items-grid">${cells}</div></div>`;
  }

  // ── FOOTER ──────────────────────────────────────────────────────────────────
  let pageInfoText = '';
  if (totalPages > 1) {
    pageInfoText = SCREEN_LOCK
      ? `Screen ${currentPage} of ${totalPages} (locked)`
      : `Screen ${currentPage} of ${totalPages}`;
  }

  const showProgressBar = !SCREEN_LOCK && totalPages > 1;

  // Feature Hero Spotlight has no footer — the promo tiles run edge to edge
  // to the bottom of the screen instead of leaving room for a status bar.
  const footerHtml = effectiveTemplateType === 'feature-hero-board' ? '' : `
    <div class="board-footer">
      <div class="footer-text">${brandName} — ${esc(meta.label)}</div>
      <div class="footer-page-info">${esc(pageInfoText)}</div>
      <div class="footer-refresh">
        <span class="refresh-dot"></span> Live sync enabled
      </div>
    </div>
    ${showProgressBar ? '<div class="rotation-bar-wrap"><div class="rotation-bar" id="rotationBar"></div></div>' : ''}
  `;

  // ── INJECT ──────────────────────────────────────────────────────────────────
  boardRoot.innerHTML = headerHtml + bodyHtml + footerHtml;

  updateClock();

  if (!SCREEN_LOCK && totalPages > 1) {
    const effectiveRotationSeconds = (tpl && parseInt(tpl.rotationSeconds)) || DEFAULT_ROTATION_SECONDS;
    startRotation(totalPages, effectiveRotationSeconds * 1000);
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  if (!MENU_TYPE || (!STORE_CODE && !DEVICE_UDID)) {
    const missing = !MENU_TYPE
      ? 'a Menu Type (<code>?menu=supplements</code>)'
      : 'a Store Code (<code>?store=STORE001</code>) or Device UDID (<code>?device=…</code>)';
    document.getElementById('boardRoot').innerHTML = `
      <div class="error-board">
        <div class="icon">📺</div>
        <h2>Invalid Offer Board URL</h2>
        <p>This offer board requires ${missing}.</p>
        <br>
        <p>Example URLs:</p>
        <code>menu-board.html?store=STORE001&amp;menu=supplements</code><br>
        <code>menu-board.html?device=&lt;UDID&gt;&amp;menu=vitamins</code>
        <a href="index.html">← Back to Portal</a>
      </div>
    `;
    return;
  }

  // Per-store stock listener — only when a store code is present
  if (STORE_CODE) {
    onSnapshot(doc(db, STOCK_COLL, STORE_CODE), snap => {
      const newStock = snap.exists() ? snap.data() : {};
      const h = _fp(newStock);
      if (h === _stockHash) return;   // data unchanged — skip render
      _stockHash = h;
      _stock = newStock;
      render();
    });
    // Per-store Local Feature Highlight override, set from Retail Admin —
    // once a store has starred 3+ items, this replaces HQ's Featured list
    // for that store (see getEffectiveFeaturedSkus() in render()).
    onSnapshot(doc(db, LOCAL_FEATURED_COLL, STORE_CODE), snap => {
      const newLocalFeatured = snap.exists() ? snap.data() : {};
      const h = _fp(newLocalFeatured);
      if (h === _localFeaturedHash) return;
      _localFeaturedHash = h;
      _localFeatured = newLocalFeatured;
      render();
    });
    // Per-store price override, set from Retail Admin's Pricing tab (only
    // shown there when HQ Admin has switched it on for the item's brand) —
    // a store's own price/offer/menu-board-copy for a sku, never affecting
    // any other store or HQ's own default. See getItems() below.
    onSnapshot(doc(db, STORE_PRICING_COLL, STORE_CODE), snap => {
      const newStorePricing = snap.exists() ? snap.data() : {};
      const h = _fp(newStorePricing);
      if (h === _storePricingHash) return;
      _storePricingHash = h;
      _storePricing = newStorePricing;
      render();
    });
  }

  updateClock();
  setInterval(updateClock, 1000);

  // Campaign polling — only active when a Device UDID is provided in the URL.
  // Key derivation is cached so only the first call pays the PBKDF2 cost (~100ms);
  // subsequent polls reuse the cached token and complete in network time only.
  if (DEVICE_UDID) {
    // Kick off key derivation immediately so it is ready before the first poll
    _deriveKey();
    pollCampaign();                   // immediate first call
    setInterval(pollCampaign, 5000);  // then every 5 s for near-instant updates
  }
});
</script>

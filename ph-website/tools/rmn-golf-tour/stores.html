<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Stores / Branches</title>
<!-- Capture-only stand-in for HQ Admin → Stores / Branches (list page archetype A in the ph-designer skill), framed by shell.html:
     the Fairlinks Golf Network's 100 connected golf clubs. Every name is fictional; Fernhollow Golf Club is one of them.
     v3: the rows, each club's Displays and the total come from network.json (written by slots_golf.py); v4: clubs have 2 to 16 screens,
     each with its own mix of types, and no two neighbouring rows share a total. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<style>
  :root { --primary: #169bc2; --tint: rgba(22,155,194,.10); --text: #333; --muted: rgba(0,0,0,.45); --divider: rgba(5,5,5,.06); --border: #d9d9d9; --ok: #52c41a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { font: 14px/1.5715 Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .ms { font-family: "Material Symbols Outlined"; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; vertical-align: middle; font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
  .page { padding: 20px; }
  .title { display: flex; align-items: center; justify-content: space-between; }
  .title h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .title .meta { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .rule { height: 1px; background: var(--divider); margin: 16px 0; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bar .acts { display: flex; gap: 16px; }
  .tact { font: inherit; border: 0; background: none; color: #333; padding: 4px 8px; display: inline-flex; align-items: center; gap: 6px; }
  .grid { border: 1px solid #babfc7; border-radius: 3px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8f8f8; font-weight: 700; text-align: left; height: 36px; padding: 0 12px; border-bottom: 1px solid #babfc7; white-space: nowrap; font-size: 13px; }
  tr.f th { font-weight: 400; height: 34px; }
  tr.f input { width: 100%; height: 24px; border: 1px solid #babfc7; border-radius: 3px; font: inherit; font-size: 12px; padding: 0 6px; }
  td { height: 42px; padding: 0 12px; border-bottom: 1px solid #dde2eb; white-space: nowrap; font-size: 13px; }
  tbody tr:nth-child(even) td { background: #fcfcfc; }
  .cb { width: 16px; height: 16px; border: 1px solid #babfc7; border-radius: 3px; display: inline-block; vertical-align: middle; }
  .code { display: inline-flex; align-items: center; gap: 6px; }
  .code .ms { font-size: 16px; color: var(--muted); }
  .feat .ms { font-size: 18px; color: #555; margin-right: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-left: 8px; }
  .seg { display: inline-block; padding: 0 8px; border-radius: 9999px; background: #f5f5f5; font-size: 12px; line-height: 20px; margin-right: 4px; }
  .pag { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; }
  .pag span { min-width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
  .pag .on { border: 1px solid var(--primary); color: var(--primary); font-weight: 600; }
  .pag .size { border: 1px solid var(--border); padding: 0 10px; gap: 4px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="title"><h1>Stores / Branches</h1><div class="meta" id="meta">Total connected displays <b id="tdisp"></b><span class="ms">desktop_windows</span></div></div>
  <div class="rule"></div>
  <div class="bar"><div id="count"></div><div class="acts"><button class="tact"><span class="ms">add</span>Add New Store(s)</button></div></div>
  <div class="grid">
    <table>
      <thead>
        <tr><th style="width:40px"><span class="cb"></span></th><th>Store Code</th><th>Brand Name</th><th>Store Name</th><th>Enabled Features</th><th>Displays</th><th>Staff</th><th>Store Segments</th><th style="width:40px"></th></tr>
        <tr class="f"><th></th><th><input></th><th><input></th><th><input></th><th></th><th></th><th></th><th><input></th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pag"><span class="muted">‹</span><span class="on">1</span><span>2</span><span>3</span><span>4</span><span class="muted">›</span><span class="size">25 / page<span class="ms" style="font-size:16px">expand_more</span></span></div>
</div>
<script>
  /* The network seed (network.json, from slots_golf.py): 100 fictional clubs, Fernhollow first, each with its own number of screens.
     Displays is the club's screen count; Total connected displays is their sum. Nothing here is typed by hand. */
  (async () => {
    const net = await (await fetch("network.json")).json(), clubs = net.clubs;
    document.getElementById("tdisp").textContent = clubs.reduce((n, c) => n + c.total, 0).toLocaleString("en-GB");
    document.getElementById("rows").innerHTML = clubs.slice(0, 25).map((c) => `<tr data-club="${c.name}" data-displays="${c.total}"><td><span class="cb"></span></td>
    <td><span class="code">${c.code}<span class="ms">content_copy</span></span></td><td>Fairlinks Golf Network</td><td>${c.name}</td>
    <td class="feat"><span class="ms">desktop_windows</span><span class="ms">qr_code_2</span><span class="ms">sports_golf</span></td>
    <td>${c.total}<span class="dot"></span></td><td>${c.staff}</td><td>${c.segments.map((s) => `<span class="seg">${s}</span>`).join("")}</td><td><span class="ms">more_horiz</span></td></tr>`).join("");
    document.getElementById("count").innerHTML = `<b>${clubs.length}</b> Stores`;
    document.body.dataset.ready = "1";
  })();
</script>
</body>
</html>

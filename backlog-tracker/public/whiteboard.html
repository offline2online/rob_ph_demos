<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Whiteboard</title>
  <link rel="icon" type="image/svg+xml" href="img/ph-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=accessibility,account_circle,add,add_a_photo,add_photo_alternate,anchor,api,arrow_back,article,attach_file,attachment,auto_awesome,auto_fix_high,automation,autorenew,block,bolt,brush,bug_report,build,campaign,cancel,cards,category,center_focus_strong,chat_bubble,check_box,check_circle,class,close,cloud,code,comment,construction,content_cut,contract,crop,dashboard,delete,delete_sweep,description,details,devices,do_not_disturb_on,docs,done,draft,drag_handle,draw,edit,email,error,event,expand_less,expand_more,fact_check,filter,fit_screen,flag,folder,folder_copy,forum,function,functions,gavel,group,healing,help,help_center,history,hourglass_empty,hourglass_top,how_to_reg,iframe,image,info,ink_eraser,input,inventory_2,ios_share,keyboard_arrow_down,keyboard_arrow_up,keyboard_double_arrow_down,keyboard_double_arrow_up,label,left_panel_close,left_panel_open,light,lightbulb,link,link_off,list,list_alt,local_offer,lock,logout,loop,map,menu,merge_type,message,mic,monitoring,mouse,move,movie,navigation,note,notes,notifications,open_in_new,pan_tool,password,payments,pending,person,photo,priority,progress_activity,psychology,public,publish,radio,refresh,remove,report,resize,right_panel_close,right_panel_open,rocket_launch,rule,schedule,screenshot,script,search,security,select,settings,share,smart_toy,source,sprint,start,stop,storage,store,storefront,support_agent,swap_horiz,sync,sync_problem,tab,table,target,task,title,toolbar,tooltip,tune,undo,update,upload,view_agenda,view_kanban,warning,width&display=block">
  <link rel="stylesheet" href="css/whiteboard.css">
</head>
<body>
  <!-- Standalone and full screen: a shared link opens straight onto the board, no console sign-in. -->
  <canvas id="wb-canvas" aria-label="Whiteboard. Draw with a mouse, finger or pen."></canvas>

  <div class="wb-error" id="wb-error" role="alert" hidden>
    <span class="material-symbols-outlined" aria-hidden="true">link_off</span>
    <h1 id="wb-error-title">This whiteboard link isn't valid</h1>
    <p id="wb-error-text">Check the link you were sent, or ask for a new one.</p>
  </div>

  <div class="wb-ui" id="wb-ui" hidden>
    <a class="wb-home" id="wb-home" href="./" title="Back to PH Agent Console"><img src="img/ph-agent-console-logo.svg" alt="PH Agent Console: back to the console" width="129" height="32"></a>

    <div class="wb-toolbar" id="wb-toolbar" role="toolbar" aria-label="Whiteboard tools">
      <button type="button" class="wb-tool" data-tool="pen" aria-pressed="true" title="Pen"><span class="material-symbols-outlined" aria-hidden="true">edit</span><span class="wb-label">Pen</span></button>
      <button type="button" class="wb-tool" data-tool="eraser" aria-pressed="false" title="Eraser: drag across a stroke"><span class="material-symbols-outlined" aria-hidden="true">ink_eraser</span><span class="wb-label">Eraser</span></button>
      <button type="button" class="wb-tool" data-tool="pan" aria-pressed="false" title="Hand: drag to move (or hold Space)"><span class="material-symbols-outlined" aria-hidden="true">pan_tool</span><span class="wb-label">Move</span></button>
      <span class="wb-sep" aria-hidden="true"></span>
      <span class="wb-group" id="wb-colors" role="group" aria-label="Colour"></span>
      <span class="wb-sep" aria-hidden="true"></span>
      <span class="wb-group" id="wb-sizes" role="group" aria-label="Pen size"></span>
      <span class="wb-sep" aria-hidden="true"></span>
      <button type="button" class="wb-tool" id="wb-undo" title="Undo your last stroke"><span class="material-symbols-outlined" aria-hidden="true">undo</span><span class="wb-label">Undo</span></button>
      <button type="button" class="wb-tool" id="wb-reset" title="Reset view: frame the whole drawing and auto-fit"><span class="material-symbols-outlined" aria-hidden="true">center_focus_strong</span><span class="wb-label">Reset view</span></button>
      <button type="button" class="wb-tool" id="wb-clear" title="Clear the whole board"><span class="material-symbols-outlined" aria-hidden="true">delete_sweep</span><span class="wb-label">Clear</span></button>
      <span class="wb-sep" aria-hidden="true"></span>
      <button type="button" class="wb-share-btn" id="wb-share-open" aria-haspopup="dialog" aria-expanded="false" title="Share"><span class="material-symbols-outlined" aria-hidden="true">share</span><span class="wb-share-word">Share</span></button>
    </div>

    <div class="wb-zoom" id="wb-zoom" role="group" aria-label="Zoom">
      <button type="button" class="wb-tool" id="wb-fit" aria-pressed="true" title="Auto-fit: keep everything drawn in view"><span class="material-symbols-outlined" aria-hidden="true">fit_screen</span></button>
      <button type="button" class="wb-tool" id="wb-zoom-out" title="Zoom out" aria-label="Zoom out"><span class="material-symbols-outlined" aria-hidden="true">remove</span></button>
      <button type="button" class="wb-tool" id="wb-zoom-in" title="Zoom in" aria-label="Zoom in"><span class="material-symbols-outlined" aria-hidden="true">add</span></button>
    </div>

    <div class="wb-status" id="wb-status" role="status" aria-live="polite"></div>

    <div class="wb-share" id="wb-share" role="dialog" aria-label="Share this whiteboard" hidden>
      <div class="wb-share-head">
        <strong>Share this whiteboard</strong>
        <button type="button" class="wb-icon" id="wb-share-close" aria-label="Close share panel"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
      </div>
      <p class="wb-share-note">Anyone with this link can open the board and draw on it. No sign-in needed.</p>
      <div class="wb-share-row">
        <input type="text" id="wb-link" readonly aria-label="Whiteboard link" spellcheck="false">
        <button type="button" class="wb-primary" id="wb-copy">Copy link</button>
      </div>
      <button type="button" class="wb-secondary" id="wb-native-share" hidden><span class="material-symbols-outlined" aria-hidden="true">ios_share</span>Share…</button>
      <p class="wb-share-msg" id="wb-copy-msg" role="status" aria-live="polite"></p>
    </div>

    <div class="wb-confirm" id="wb-confirm" role="alertdialog" aria-labelledby="wb-confirm-text" hidden>
      <p id="wb-confirm-text">Clear the whole board for everyone?</p>
      <div><button type="button" class="wb-secondary" id="wb-confirm-no">Cancel</button><button type="button" class="wb-danger" id="wb-confirm-yes">Clear board</button></div>
    </div>
  </div>

  <script type="module" src="js/whiteboard.js"></script>
</body>
</html>

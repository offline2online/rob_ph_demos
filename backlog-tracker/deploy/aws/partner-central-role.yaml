AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PH Agent Console -> AWS Partner Central (Selling + Benefits APIs).
  Keyless: the console's Cloud Function presents a Google-issued OIDC token and
  assumes this role with AssumeRoleWithWebIdentity. No access keys exist.
Parameters:
  ConsoleServiceAccountUniqueId:
    Type: String
    Description: >
      Numeric unique id of the Cloud Functions runtime service account in
      backlog-tracker-e4ed2 (gcloud iam service-accounts describe <email> --format='value(uniqueId)').
    AllowedPattern: "^[0-9]{10,25}$"
  RoleName:
    Type: String
    Default: PH-Console-PartnerCentral
  ExportBucketName:
    Type: String
    Default: ""
    Description: >
      The PH-owned S3 bucket Partner Central's data export writes to (read by the
      Conversion Funnel's import, functions/pc-export.js). Empty: no S3 access.
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
Conditions:
  HasExportBucket: !Not [!Equals [!Ref ExportBucketName, ""]]
Resources:
  ConsoleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Assumed by the PH Agent Console backend via Google OIDC federation.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: accounts.google.com }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "accounts.google.com:sub": !Ref ConsoleServiceAccountUniqueId
      ManagedPolicyArns:
        # AWS-managed Partner Central policies. Opportunity management only;
        # funding is added below as draft-only (no Submit*).
        - arn:aws:iam::aws:policy/AWSPartnerCentralOpportunityManagement
      Policies:
        - PolicyName: BenefitsDraftOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - partnercentral:CreateBenefitApplication
                  - partnercentral:UpdateBenefitApplication
                  - partnercentral:GetBenefitApplication
                  - partnercentral:ListBenefitApplications
                  - partnercentral:ListBenefitAllocations
                  - partnercentral:ListBenefits
                  - partnercentral:GetBenefit
                Resource: "*"
              - Effect: Deny
                Action:
                  - partnercentral:SubmitBenefitApplication
                  - partnercentral:CancelBenefitApplication
                Resource: "*"
        - PolicyName: PartnerCentralAgentMcp
          # The Partner Central agents MCP server (the console's "Ask the
          # Partner Central agent" panel). UseSession lets the role open and
          # continue agent sessions; what the agent may read or write is
          # still limited by the policies above (opportunities, customer
          # insights, benefit drafts), and every write waits for an admin's
          # approval in the console. Benefit submission stays denied above.
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - partnercentral:UseSession
                Resource: "*"
  # Read-only access to the Partner Central data export bucket, and nothing else in S3.
  ExportReadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasExportBucket
    Properties:
      PolicyName: PartnerCentralExportRead
      Roles: [!Ref ConsoleRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${ExportBucketName}"
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ExportBucketName}/*"
Outputs:
  RoleArn:
    Value: !GetAtt ConsoleRole.Arn

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://firestore.googleapis.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Category — Personalisation Hub Help Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="data/index.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/faq.css">
</head>
<body>
  <header class="ph-header">
    <a class="brand" href="index.html"><span class="dot"></span> Personalisation Hub <span class="help-label">Help Centre</span></a>
  </header>

  <section class="hero hero-compact">
    <div class="search-wrap">
      <span class="search-icon" id="search-icon"></span>
      <label for="faq-search" class="visually-hidden">Search articles</label>
      <input type="search" id="faq-search" class="search-box" placeholder="Search for articles…" autocomplete="off">
      <div class="search-results" id="faq-search-results" hidden></div>
    </div>
  </section>

  <main class="wrap" id="main">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Help Centre</a> <span class="sep">›</span> <span id="crumb-cat"></span></nav>
    <div class="page-title">
      <div class="cat-icon" id="cat-icon"></div>
      <h1 id="cat-name">Loading…</h1>
    </div>
    <p class="page-desc" id="cat-desc"></p>
    <div class="article-list" id="article-list" aria-busy="true"></div>
    <p class="empty-hint" id="article-empty" hidden>No published articles in this category yet.</p>
    <p class="load-error" id="load-error" hidden>The help centre content could not be loaded. Check your connection and refresh the page.</p>
    <p class="cat-nav" id="cat-nav"></p>
  </main>

  <footer class="ph-footer">Personalisation Hub Help Centre &middot; <a href="https://personalisationhub.com" target="_blank" rel="noopener">personalisationhub.com</a> &middot; <span id="app-version"></span></footer>

  <script type="module" src="js/page-category.js"></script>
</body>
</html>

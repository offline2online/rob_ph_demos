<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="slot-charts.css">
<style>
  html, body { margin: 0; background: #fff; }
  body { padding: 20px; font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  @media (max-width: 600px) { body { padding: 16px; } }
</style>
</head>
<body>
<!-- Content frame only: the platform shell owns the header, sidebar and breadcrumb. -->
<div id="charts"></div>
<script src="fixtures.js"></script>
<script src="slot-charts.js"></script>
<script>
  // ?state=loading|empty|error previews the non-data states. The tab shell passes its own fetchJson.
  var q = new URLSearchParams(location.search), st = q.get('state');
  var charts = SlotCharts.mount(document.getElementById('charts'), {
    fetchJson: function (endpoint, params) {
      return SlotChartsFixtures.fetchJson(endpoint, params, { state: st, delay: st === 'loading' ? 3600000 : 120 });
    }
  });
</script>
</body>
</html>

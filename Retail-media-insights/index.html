<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Media Performance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="css/insights.css">
<link rel="stylesheet" href="frontend/revenue-deals.css">
<link rel="stylesheet" href="frontend/slot-charts.css">
<link rel="stylesheet" href="frontend/demand-charts.css">
<link rel="stylesheet" href="frontend/advertiser-view.css">
<link rel="stylesheet" href="frontend/uplift-chart.css">
</head>
<body>
<!-- Content frame only: the platform shell owns the header, sidebar and the outer breadcrumb. -->
<main class="frame" id="frame">
  <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
  <h1 class="title">Insights / Analytics</h1>

  <div class="alert info" id="scope" role="note" hidden></div>
  <section class="filters" id="filters" aria-label="Page filters"></section>
  <div class="tabs" id="tabs" role="tablist"></div>

  <div id="tab-rmp">
    <div id="msg" class="msg" hidden></div>
    <section id="strip" class="card" aria-label="Summary" aria-live="polite"></section>
    <div id="rd" class="rd-host"></div>
    <div id="sc" class="rd-host"></div>
    <div id="dc" class="rd-host"></div>
    <section id="mysum" class="card" aria-label="Your summary" aria-live="polite" hidden></section>
    <div id="av" class="rd-host" hidden></div>
    <div id="up" class="rd-host"></div>
  </div>
  <div id="tab-other" class="msg" hidden></div>
</main>
<script src="frontend/local-api.js"></script>
<script src="frontend/revenue-deals.js"></script>
<script src="frontend/slot-charts.js"></script>
<script src="frontend/demand-charts.js"></script>
<script src="frontend/advertiser-view.js"></script>
<script src="frontend/uplift-chart.js"></script>
<script src="js/scroll-keeper.js"></script>
<script src="js/insights.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacy Screen</title>
<!-- Campaign URL (the PH player swaps ${UniqueDeviceID} for the screen's own ID; the URL never carries a store code):
     pharmacy-screen.html?device=${UniqueDeviceID}&promo=<promo id>&orientation=<portrait|landscape> -->
<!-- Where the screen's data comes from: base URLs, comma-separated, each serving /api/device/** (the back-end
     proxy) and /api/screens/** (the public config read). Tried last-good first, then in this order.
     Empty: this page's own origin (the Hosting rewrites). -->
<meta name="pharmacy-screen-api" content="">
<!-- Fonts and icons are self-hosted (tools/fetch-fonts.mjs), so a screen behind a firewall never calls Google.
     The Seasonal templates' fonts and photo (css/occasion-fonts.css, css/occasion-media.css) are loaded by
     js/player.js only when the promotion playing is a Seasonal one; css/debug.css (with Roboto) only with debug=1.
     The deploy (scripts/deploy.mjs buildShell) points every css/ and js/ URL here at its fingerprinted copy in
     assets/ and writes the fonts out as .woff2 files there. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/material-symbols.css">
<link rel="stylesheet" href="css/screen.css">
<!-- The whole static import graph of js/player.js, fetched in parallel instead of one level at a time
     (test/offline-cache.test.mjs checks the list). -->
<link rel="modulepreload" href="js/render.js">
<link rel="modulepreload" href="js/hours.js">
<link rel="modulepreload" href="js/tokens.js">
<link rel="modulepreload" href="js/fit-text.js">
<link rel="modulepreload" href="js/occasions.js">
<link rel="modulepreload" href="js/live-data.js">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* the screen is drawn at its real size (1080x1920 or 1920x1080) and scaled to fit the player's viewport */
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage"><div class="screen" id="screen" aria-live="off"></div></div>
<script type="module" src="js/player.js"></script>
</body>
</html>
